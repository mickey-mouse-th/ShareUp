<script>
var _slipCarouselList = [];
var _slipCarouselIdx = 0;

function _renderSlipCarousel() {
  var cur = _slipCarouselList[_slipCarouselIdx];
  $('#slipCarouselImg').attr('src', (cur && cur.slip) || '');
  $('#slipCounter').text(_slipCarouselList.length > 1 ? (_slipCarouselIdx + 1) + ' / ' + _slipCarouselList.length : '');
  $('#slipPrev, #slipNext').toggle(_slipCarouselList.length > 1);
}
function _downloadDataUri(dataUri, filename) {
  var a = document.createElement('a');
  a.href = dataUri;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// slips: [{id, slip, slipHi}] - slip/slipHi are either a data: URI already
// (old, pre-Drive rows) or a Drive fileId that needs resolving first (see
// _resolveSlipSrc in Shared_js.html).
async function openSlipCarousel(slips) {
  $('#slipDlMenu').removeClass('on');
  _slipCarouselList = slips.map(function (s) { return { id: s.id, slip: '', slipHi: '' } });
  _slipCarouselIdx = 0;
  openSheet('shSlipView');
  _renderSlipCarousel();
  var resolved = await Promise.all(slips.map(function (s) {
    return Promise.all([_resolveSlipSrc(s.slip), _resolveSlipSrc(s.slipHi)]).then(function (r) {
      return { id: s.id, slip: r[0], slipHi: r[1] };
    });
  }));
  _slipCarouselList = resolved;
  _renderSlipCarousel();
}
function _slipGoPrev() {
  _slipCarouselIdx = (_slipCarouselIdx - 1 + _slipCarouselList.length) % _slipCarouselList.length;
  _renderSlipCarousel();
}
function _slipGoNext() {
  _slipCarouselIdx = (_slipCarouselIdx + 1) % _slipCarouselList.length;
  _renderSlipCarousel();
}
// Swipe left/right on the photo itself, in addition to the < > buttons.
function _bindSlipSwipe(selector) {
  var startX = null, startY = null;
  $(document).on('touchstart', selector, function (e) {
    var t = e.originalEvent.touches[0];
    startX = t.clientX; startY = t.clientY;
  });
  $(document).on('touchend', selector, function (e) {
    if (startX === null || _slipCarouselList.length < 2) return;
    var t = e.originalEvent.changedTouches[0];
    var dx = t.clientX - startX, dy = t.clientY - startY;
    startX = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0) _slipGoNext(); else _slipGoPrev();
    }
  });
}

// Keeps Home's filter tabs/list in sync with settlement data fetched here,
// without a full Home reload — mirrors this app's existing optimistic-UI style.
function _syncEventSettled(id, settlements) {
  var settled = settlements.every(function (s) { return s.paid });
  var idx = EVENTS.findIndex(function (e) { return e.id === id });
  if (idx !== -1 && EVENTS[idx].settled !== settled) {
    EVENTS[idx].settled = settled;
    if (typeof refreshEventsUI === 'function') refreshEventsUI();
  }
}

async function loadDetailData(id) {
  TX_SEARCH = '';
  $('#txSearchInp').val('');
  $('#txSearchClear').addClass('hidden');
  $('#txList').html(skeletonHtml(3, 'tx'));
  try {
    if (IS_SHARE) {
      var r = await gsc('getSharedEventView', SHARE_TOKEN);
      if (r.success) {
        _applyPermFromShare(r.permission);
        CUR_EV = { id: null, name: r.event.name, createdAt: r.event.createdAt, icon: r.event.icon };
        $('#hdrTitle').text(CUR_EV.name);
        $('#detailBanner').css('background', bannerGrad(CUR_EV.name));
        $('#detailEmoji').text(CUR_EV.icon || evEmoji(CUR_EV.name));
        $('#detailBannerName').text(CUR_EV.name);
        $('#detailBannerDate').text(fmtDate(CUR_EV.createdAt));
        $('#fab').toggleClass('hide', !PERM.canAdd);
        $('#btnShareEvent').toggle(!!PERM.canShare);
        DETAILS = r.details || [];
        FRIENDS = r.friends || [];
        SETTLEMENTS = r.settlements || [];
        SELF_FRIEND_ID = r.selfFriendId || null;
        SLIPS = r.slips || {};
        ME_PHOTO = r.ownerPhoto || '';
        renderDetails();
      } else {
        $('#txList').html('<div class="empty"><div class="empty-t">Link unavailable</div><div class="empty-s">' + esc(r.error || 'This share link is no longer active') + '</div></div>');
      }
      return;
    }
    var r = await gsc('getDetailData', TK, id);
    if (r.success) {
      DETAILS = r.details || [];
      FRIENDS = r.friends || [];
      SETTLEMENTS = r.settlements || [];
      SELF_FRIEND_ID = r.selfFriendId || null;
      SLIPS = r.slips || {};
      renderDetails();
      _syncEventSettled(id, SETTLEMENTS);
    } else _handleDataError(r.error);
  } catch (e) { _handleDataError('' + e) }
}

var TX_SEARCH = '';

function renderDetails() {
  var $el = $('#txList');
  if (!DETAILS.length) {
    $el.html(
      '<div class="empty">' +
      '<div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M18 17H6v-2h12v2zm0-4H6v-2h12v2zm0-4H6V7h12v2zM3 22l1.5-1.5L6 22l1.5-1.5L9 22l1.5-1.5L12 22l1.5-1.5L15 22l1.5-1.5L18 22l1.5-1.5L21 22V2l-1.5 1.5L18 2l-1.5 1.5L15 2l-1.5 1.5L12 2l-1.5 1.5L9 2 7.5 3.5 6 2 4.5 3.5 3 2v20z"/></svg></div>' +
      '<div class="empty-t">No transactions yet</div>' +
      '<div class="empty-s">Tap + to record the first expense</div>' +
      '</div>'
    );
    return;
  }
  var fm = {};
  $.each(FRIENDS, function (_, f) { fm[f.id] = f.name });
  var grp = {}, ord = [];
  $.each(DETAILS, function (_, d) {
    if (!grp[d.transactionId]) { grp[d.transactionId] = []; ord.push(d.transactionId) }
    grp[d.transactionId].push(d);
  });
  ord.reverse();
  var q = TX_SEARCH.trim().toLowerCase();
  if (q) {
    ord = ord.filter(function (tid) {
      var f = grp[tid][0];
      var desc = (f.description || '').toLowerCase();
      var payer = (fm[f.payId] || '').toLowerCase();
      return desc.indexOf(q) !== -1 || payer.indexOf(q) !== -1;
    });
  }
  if (!ord.length) {
    $el.html('<div class="empty"><div class="empty-t">No matching expenses</div><div class="empty-s">Try a different search</div></div>');
    return;
  }
  var html = $.map(ord, function (tid, i) {
    var rows = grp[tid], f = rows[0];
    var pn    = fm[f.payId] || f.payId;
    var total = parseFloat(f.totalAmount);
    var desc  = f.description || 'Transaction';
    var isCustom = $.grep(rows, function (r) {
      return Math.abs(parseFloat(r.amount) - parseFloat(rows[0].amount)) > 0.01;
    }).length > 0;
    var chips = $.map(rows, function (r) {
      var name = fm[r.friendId] || r.friendId;
      return '<span class="tx-chip">' + esc(name) + (isCustom ? ' ' + fmtAmt(r.amount) : '') + '</span>';
    }).join('');
    var d = new Date(f.createdAt);
    var timeStr = isNaN(d) ? '' : d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    var isLast = i === ord.length - 1;
    var footerBtns =
      (PERM.canEdit ? '<button class="sched-act-btn tx-edit" data-tid="' + esc(tid) + '" title="Edit">' +
        '<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.9959.9959 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></button>' : '') +
      (PERM.canDelete ? '<button class="sched-act-btn del tx-del" data-tid="' + esc(tid) + '" data-desc="' + esc(desc) + '" title="Delete">' +
        '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>' : '');
    var footerHtml = footerBtns ? '<div class="sched-card-footer">' + footerBtns + '</div>' : '';
    return '<div class="sched-item">' +
      '<div class="sched-time-col"><div class="sched-time">' + esc(timeStr) + '</div><div class="sched-date">' + fmtDate(f.createdAt) + '</div></div>' +
      '<div class="sched-axis">' + (isLast ? '' : '<div class="sched-line"></div>') + '</div>' +
      '<div class="sched-card" data-tid="' + esc(tid) + '">' +
      '<div class="tx-head">' +
      avatarHtml('tx-av', pn, f.payId) +
      '<div class="tx-meta">' +
      '<div class="tx-desc">' + highlightText(desc, q) + '</div>' +
      '<div class="tx-by">Paid by ' + highlightText(pn, q) + (isCustom ? ' · custom' : '') + '</div>' +
      '</div>' +
      (SLIPS[tid] && SLIPS[tid].length ?
        '<button class="sched-slip-btn tx-view-slip" data-tid="' + esc(tid) + '" title="View receipt">' +
        '<svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>' +
        '</button>' : '') +
      '<div class="tx-amt">' + fmtAmt(total) + '</div>' +
      '</div>' +
      '<div class="tx-people">' + chips + '</div>' +
      footerHtml +
      '</div>' +
      '</div>';
  }).join('');
  $el.html(html);
}

// Lazy-loaded on first export so a normal page load never pays for these.
var _pdfLibsPromise = null;
function _loadPdfLibs() {
  if (_pdfLibsPromise) return _pdfLibsPromise;
  _pdfLibsPromise = new Promise(function (resolve, reject) {
    var s1 = document.createElement('script');
    s1.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s1.onload = function () {
      var s2 = document.createElement('script');
      s2.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
      s2.onload = resolve;
      s2.onerror = reject;
      document.head.appendChild(s2);
    };
    s1.onerror = reject;
    document.head.appendChild(s1);
  });
  return _pdfLibsPromise;
}

async function exportExpensesPdf() {
  if (!CUR_EV) return;
  if (!DETAILS.length) { toast('No expenses to export yet', 'warn'); return }

  toast('Preparing PDF…');
  try {
    await _loadPdfLibs();
  } catch (e) {
    toast('Could not load the PDF library — check your connection', 'err');
    return;
  }

  var fm = {};
  $.each(FRIENDS, function (_, f) { fm[f.id] = f.name });
  var grp = {}, ord = [];
  $.each(DETAILS, function (_, d) {
    if (!grp[d.transactionId]) { grp[d.transactionId] = []; ord.push(d.transactionId) }
    grp[d.transactionId].push(d);
  });
  ord.reverse();

  var grandTotal = 0;
  var txRowsHtml = ord.map(function (tid, idx) {
    var group = grp[tid], f = group[0];
    var payerName = fm[f.payId] || f.payId;
    var total = parseFloat(f.totalAmount);
    grandTotal += total;
    var isCustom = group.some(function (g) {
      return Math.abs(parseFloat(g.amount) - parseFloat(group[0].amount)) > 0.01;
    });
    var paidForHtml = group.map(function (g) {
      var n = esc(fm[g.friendId] || g.friendId);
      return isCustom ? n + ' <span style="color:#D97706">(' + esc(fmtAmt(g.amount)) + ')</span>' : n;
    }).join(', ');
    var perPersonCell = isCustom ? 'Custom' : esc(fmtAmt(total / group.length));
    var rowBg = idx % 2 ? 'background:#FBF7FF' : '';
    var td = 'padding:9px 10px;border-bottom:1px solid #EDE4FB;vertical-align:top';
    return '<tr style="' + rowBg + '">' +
      '<td style="' + td + ';color:#6B7280;white-space:nowrap">' + esc(fmtDate(f.createdAt)) + '</td>' +
      '<td style="' + td + ';color:#1F2937;font-weight:600">' + esc(f.description || 'Transaction') + '</td>' +
      '<td style="' + td + ';text-align:right;color:#1F2937;font-weight:700">' + esc(fmtAmt(total)) + '</td>' +
      '<td style="' + td + ';color:#1F2937">' + esc(payerName) + '</td>' +
      '<td style="' + td + ';color:#4B5563">' + paidForHtml + '</td>' +
      '<td style="' + td + ';text-align:right;color:#92400E;font-weight:700;white-space:nowrap">' + perPersonCell + '</td>' +
      '</tr>';
  }).join('');

  // Reuse the settlements already loaded for this event; only hit the server
  // if they were invalidated (e.g. a transaction changed since).
  var settlements = SETTLEMENTS;
  if (settlements === null) {
    try {
      var r = IS_SHARE ? await gsc('getSharedEventView', SHARE_TOKEN) : await gsc('getSummary', TK, CUR_EV.id);
      if (r.success) settlements = r.settlements || [];
    } catch (e) {}
  }

  var settleHtml;
  if (settlements === null) {
    settleHtml = '<div style="padding:16px;text-align:center;color:#9CA3AF;font-size:12px">Could not load summary</div>';
  } else if (!settlements.length) {
    settleHtml = '<div style="background:#ECFDF5;border:1px solid #A7F3D0;border-radius:12px;padding:14px 16px;text-align:center;color:#047857;font-weight:700;font-size:13px">🎉 All settled — nobody owes anyone</div>';
  } else {
    settleHtml = settlements.map(function (s) {
      return '<div style="display:flex;align-items:center;gap:10px;background:#FBF7FF;border:1px solid #E9D5FF;border-radius:12px;padding:11px 16px;margin-bottom:8px">' +
        '<div style="font-weight:700;font-size:12.5px;color:#1F2937;flex:1">' + esc(s.fromName) + '</div>' +
        '<div style="font-size:11px;color:#D97706;font-weight:600;white-space:nowrap">Owes →</div>' +
        '<div style="font-weight:700;font-size:12.5px;color:#1F2937;flex:1">' + esc(s.toName) + '</div>' +
        '<div style="font-weight:800;font-size:13.5px;color:#92400E;min-width:90px;text-align:right">' + esc(fmtAmt(s.amount)) + '</div>' +
        '</div>';
    }).join('');
  }

  var now = new Date();
  var generatedAt = now.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) +
    ' ' + now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

  var hideWrap = document.createElement('div');
  hideWrap.style.cssText = 'position:absolute;top:0;left:0;width:0;height:0;overflow:hidden;';
  var container = document.createElement('div');
  container.style.cssText = 'width:760px;padding:36px;background:#fff;font-family:\'Sarabun\',\'Segoe UI\',sans-serif;color:#1F2937;';
  container.innerHTML =
    '<div style="background:linear-gradient(135deg,#FCD34D 0%,#F59E0B 55%,#B45309 100%);border-radius:18px;padding:26px 30px;margin-bottom:26px;color:#fff">' +
    '<div style="font-size:11px;letter-spacing:2px;font-weight:700;opacity:.85;margin-bottom:8px">SHAREUP · Expense Summary</div>' +
    '<div style="font-size:26px;font-weight:800;margin-bottom:4px">' + esc(CUR_EV.name) + '</div>' +
    '<div style="font-size:12px;opacity:.85">Created ' + esc(fmtDate(CUR_EV.createdAt)) + ' · Generated ' + esc(generatedAt) + '</div>' +
    '</div>' +

    '<div style="display:flex;gap:12px;margin-bottom:28px">' +
    '<div style="flex:1;background:#FBF7FF;border:1px solid #E9D5FF;border-radius:14px;padding:14px 18px">' +
    '<div style="font-size:11px;color:#7E22CE;font-weight:700;margin-bottom:5px">Total Amount</div>' +
    '<div style="font-size:19px;font-weight:800;color:#92400E">' + esc(fmtAmt(grandTotal)) + '</div>' +
    '</div>' +
    '<div style="flex:1;background:#FBF7FF;border:1px solid #E9D5FF;border-radius:14px;padding:14px 18px">' +
    '<div style="font-size:11px;color:#7E22CE;font-weight:700;margin-bottom:5px">Total Items</div>' +
    '<div style="font-size:19px;font-weight:800;color:#92400E">' + ord.length + ' items</div>' +
    '</div>' +
    '<div style="flex:1;background:#FBF7FF;border:1px solid #E9D5FF;border-radius:14px;padding:14px 18px">' +
    '<div style="font-size:11px;color:#7E22CE;font-weight:700;margin-bottom:5px">Members</div>' +
    '<div style="font-size:19px;font-weight:800;color:#92400E">' + FRIENDS.length + ' people</div>' +
    '</div>' +
    '</div>' +

    '<div style="font-size:15px;font-weight:800;color:#92400E;margin-bottom:12px">' +
    '<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#D97706;margin-right:8px"></span>' +
    'Settlement Summary — who owes whom</div>' +
    '<div style="margin-bottom:30px">' + settleHtml + '</div>' +

    '<div style="font-size:15px;font-weight:800;color:#92400E;margin-bottom:12px">' +
    '<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#D97706;margin-right:8px"></span>' +
    'All Expenses</div>' +
    '<table style="width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed">' +
    '<colgroup><col style="width:11%"><col style="width:16%"><col style="width:11%"><col style="width:13%"><col style="width:34%"><col style="width:15%"></colgroup>' +
    '<thead><tr style="background:#F3E8FF">' +
    '<th style="padding:9px 10px;text-align:left;color:#92400E;font-size:10.5px;letter-spacing:.3px">Date</th>' +
    '<th style="padding:9px 10px;text-align:left;color:#92400E;font-size:10.5px;letter-spacing:.3px">Description</th>' +
    '<th style="padding:9px 10px;text-align:right;color:#92400E;font-size:10.5px;letter-spacing:.3px">Total</th>' +
    '<th style="padding:9px 10px;text-align:left;color:#92400E;font-size:10.5px;letter-spacing:.3px">Paid By</th>' +
    '<th style="padding:9px 10px;text-align:left;color:#92400E;font-size:10.5px;letter-spacing:.3px">Split Between</th>' +
    '<th style="padding:9px 10px;text-align:right;color:#92400E;font-size:10.5px;letter-spacing:.3px">Per Person</th>' +
    '</tr></thead><tbody>' + txRowsHtml + '</tbody></table>' +

    '<div style="margin-top:26px;text-align:center;font-size:10px;color:#B9A6D1">Generated by ShareUp</div>';
  hideWrap.appendChild(container);
  document.body.appendChild(hideWrap);

  var filename = (CUR_EV.name || 'expenses').replace(/[^\w฀-๿ -]/g, '') + '_expenses.pdf';
  try {
    // Rasterize with html2canvas and place as an image — jsPDF's own .html()
    // renderer falls back to its built-in Latin-only fonts for text nodes and
    // garbles Thai, so we bypass it entirely and never hand it real text.
    var canvas = await html2canvas(container, { scale: 2, backgroundColor: '#fff', windowWidth: 760 });
    document.body.removeChild(hideWrap);

    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF('p', 'pt', 'a4');
    var margin = 20;
    var pageW = doc.internal.pageSize.getWidth();
    var pageH = doc.internal.pageSize.getHeight();
    var usableW = pageW - margin * 2;
    var usableH = pageH - margin * 2;
    var imgH = canvas.height * usableW / canvas.width;
    var imgData = canvas.toDataURL('image/png');

    var heightLeft = imgH;
    var y = margin;
    doc.addImage(imgData, 'PNG', margin, y, usableW, imgH);
    heightLeft -= usableH;
    while (heightLeft > 0) {
      doc.addPage();
      y = margin - (imgH - heightLeft);
      doc.addImage(imgData, 'PNG', margin, y, usableW, imgH);
      heightLeft -= usableH;
    }

    doc.save(filename);
  } catch (e) {
    if (hideWrap.parentNode) document.body.removeChild(hideWrap);
    toast('Could not generate PDF', 'err');
  }
}

// Fallback path: only hit when SETTLEMENTS wasn't already bundled/cached
// (e.g. invalidated after a transaction changed). See switchTab().
async function loadSummary(id) {
  $('#sumList').html(skeletonHtml(2, 'sum'));
  try {
    if (IS_SHARE) {
      var r = await gsc('getSharedEventView', SHARE_TOKEN);
      if (r.success) { SETTLEMENTS = r.settlements || []; renderSummary(SETTLEMENTS) }
      else _handleDataError(r.error);
      return;
    }
    var r = await gsc('getSummary', TK, id);
    if (r.success) {
      SETTLEMENTS = r.settlements || [];
      renderSummary(SETTLEMENTS);
      _syncEventSettled(id, SETTLEMENTS);
    } else _handleDataError(r.error);
  } catch (e) { _handleDataError('' + e) }
}

function renderSummary(ss) {
  var $el = $('#sumList');
  if (!ss.length) {
    $el.html(
      '<div class="empty">' +
      '<div class="empty-icon" style="background:var(--g-dim);border-color:rgba(34,197,94,.2)">' +
      '<svg viewBox="0 0 24 24" style="fill:var(--g)"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>' +
      '</div>' +
      '<div class="empty-t" style="color:var(--g)">All Settled! 🎉</div>' +
      '<div class="empty-s">Everyone is even — no payments needed</div>' +
      '</div>'
    );
    return;
  }
  var html = $.map(ss, function (x) {
    return '<div class="settle-card' + (x.paid ? ' paid' : '') + '">' +
      '<div class="se-person">' +
      avatarHtml('se-av', x.fromName, x.from) +
      '<div class="se-name">' + esc(x.fromName) + '</div>' +
      '</div>' +
      '<div class="se-mid">' +
      '<div class="se-label">owes <span class="se-arrow">→</span></div>' +
      '<div class="se-amt">' + fmtAmt(x.amount) + '</div>' +
      '</div>' +
      '<div class="se-person">' +
      avatarHtml('se-av', x.toName, x.to) +
      '<div class="se-name">' + esc(x.toName) + '</div>' +
      '</div>' +
      '<label class="se-check">' +
      '<input type="checkbox" class="se-paid-cb" data-from="' + esc(x.from) + '" data-to="' + esc(x.to) + '" data-amt="' + x.amount + '"' + (x.paid ? ' checked' : '') + (IS_SHARE ? ' disabled' : '') + '>' +
      '<span class="se-check-box"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>' +
      '</label>' +
      '</div>';
  }).join('');
  $el.html(html);
}

// ── Share Event ────────────────────────────────
var _sharePermission = 'view';

async function openShareSheet() {
  if (!CUR_EV) return;
  _sharePermission = 'view';
  _renderSharePerm();
  $('#shareOff').show();
  $('#shareOn').hide();
  openSheet('shShare');
  try {
    var r = await gsc('getShareLink', TK, CUR_EV.id);
    if (r.success && r.shareToken) {
      _sharePermission = r.permission || 'view';
      _renderSharePerm();
      showShareLink(r.shareUrl);
    }
  } catch (e) {}
}

function _renderSharePerm() {
  var editMode = _sharePermission === 'edit';
  $('#shPermView').toggleClass('on', !editMode);
  $('#shPermEdit').toggleClass('on', editMode);
  $('#shareOffHint').text(editMode
    ? "Anyone with the link can view AND add, edit, or delete this event's expenses — no login required."
    : "Anyone with the link can view this event's expenses and summary — they won't be able to add, edit, or delete anything.");
  $('#shareOnHint').text(editMode
    ? 'Anyone with this link can view and edit expenses for this event. Turn it off anytime to revoke access.'
    : 'Anyone with this link can view — but not edit — this event. Turn it off anytime to revoke access.');
}

async function _setSharePermission(perm) {
  if (_sharePermission === perm) return;
  _sharePermission = perm;
  _renderSharePerm();
  if (!$('#shareOn').is(':visible')) return; // no link yet - just changes what "Create" will use
  try {
    var r = await gsc('enableEventShare', TK, CUR_EV.id, perm);
    if (!r.success) toast(r.error, 'err');
  } catch (e) { toast('' + e, 'err') }
}

function showShareLink(url) {
  $('#shareLinkInp').val(url);
  $('#shareOff').hide();
  $('#shareOn').show();
}

async function enableShare() {
  try {
    var r = await gsc('enableEventShare', TK, CUR_EV.id, _sharePermission);
    if (r.success) showShareLink(r.shareUrl);
    else toast(r.error, 'err');
  } catch (e) { toast('' + e, 'err') }
}

async function disableShare() {
  try {
    var r = await gsc('disableEventShare', TK, CUR_EV.id);
    if (r.success) {
      toast('Sharing turned off');
      $('#shareOn').hide();
      $('#shareOff').show();
    } else toast(r.error, 'err');
  } catch (e) { toast('' + e, 'err') }
}

function copyShareLink() { copyInputValue('shareLinkInp') }

$(function () {
  $('#txSearchInp').on('input', function () {
    TX_SEARCH = $(this).val();
    $('#txSearchClear').toggleClass('hidden', !TX_SEARCH);
    renderDetails();
  });
  $('#txSearchClear').on('click', function () {
    TX_SEARCH = '';
    $('#txSearchInp').val('').trigger('focus');
    $(this).addClass('hidden');
    renderDetails();
  });

  $('#btnSummary').on('click', openSummarySheet);
  $('#shSummaryClose').on('click', closeSheets);
  $('#txList').on('click', '.tx-del', function (e) {
    e.stopPropagation();
    askDel('tx', $(this).data('tid'), $(this).data('desc'));
  });
  $('#txList').on('click', '.tx-edit', function (e) {
    e.stopPropagation();
    openEditTxSheet($(this).data('tid'));
  });
  $('#txList').on('click', '.tx-view-slip', function (e) {
    e.stopPropagation();
    var slips = SLIPS[$(this).data('tid')];
    if (!slips || !slips.length) return;
    openSlipCarousel(slips);
  });
  $('#slipPrev').on('click', _slipGoPrev);
  $('#slipNext').on('click', _slipGoNext);
  _bindSlipSwipe('#slipCarousel');
  $('#slipDlBtn').on('click', function (e) {
    e.stopPropagation();
    $('#slipDlMenu').toggleClass('on');
  });
  $(document).on('click', function () { $('#slipDlMenu').removeClass('on') });
  $('#slipDlPreview').on('click', function () {
    var cur = _slipCarouselList[_slipCarouselIdx];
    if (cur) _downloadDataUri(cur.slip, 'receipt-preview.jpg');
  });
  $('#slipDlOrig').on('click', function () {
    var cur = _slipCarouselList[_slipCarouselIdx];
    if (cur) _downloadDataUri(cur.slipHi || cur.slip, 'receipt.jpg');
  });
  $('#sumList').on('change', '.se-paid-cb', async function () {
    if (!CUR_EV) return;
    var from = $(this).data('from'), to = $(this).data('to'), amt = $(this).data('amt');
    var paid = $(this).is(':checked');
    try {
      var r = await gsc('markSettlementPaid', TK, CUR_EV.id, from, to, amt, paid);
      if (!r.success) toast(r.error, 'err');
    } catch (e) { toast('' + e, 'err') }
    loadSummary(CUR_EV.id);
  });
  $('#btnShareEvent').on('click', openShareSheet);
  $('#btnEnableShare').on('click', enableShare);
  $('#btnCopyShare').on('click', copyShareLink);
  $('#btnDisableShare').on('click', disableShare);
  $('#shPermView').on('click', function () { _setSharePermission('view') });
  $('#shPermEdit').on('click', function () { _setSharePermission('edit') });
  $('#btnExportTx').on('click', exportExpensesPdf);
});
