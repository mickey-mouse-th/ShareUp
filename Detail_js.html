<script>
var _slipCarouselList = [];
var _slipCarouselIdx = 0;

function _renderSlipCarousel() {
  var cur = _curSlip();
  $('#slipCarouselImg').attr('src', (cur && cur.slip) || '');
  $('#slipCounter').text(_slipCarouselList.length > 1 ? (_slipCarouselIdx + 1) + ' / ' + _slipCarouselList.length : '');
  $('#slipPrev, #slipNext').toggle(_slipCarouselList.length > 1);
}
function _downloadDataUri(dataUri, filename) {
  var a = document.createElement('a');
  a.href = dataUri;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
function _curSlip() { return _slipCarouselList[_slipCarouselIdx] }

// slip/slipHi: data: URI (old rows) or a Drive fileId to resolve (_resolveSlipSrc, Shared_js.html)
async function openSlipCarousel(slips) {
  $('#slipDlMenu').removeClass('on');
  _slipCarouselList = slips.map(function (s) { return { id: s.id, slip: '', slipHi: '' } });
  _slipCarouselIdx = 0;
  openSheet('shSlipView');
  _renderSlipCarousel();
  var resolved = await Promise.all(slips.map(function (s) {
    return Promise.all([_resolveSlipSrc(s.slip), _resolveSlipSrc(s.slipHi)]).then(function (r) {
      return { id: s.id, slip: r[0], slipHi: r[1] };
    });
  }));
  _slipCarouselList = resolved;
  _renderSlipCarousel();
}
function _slipGoPrev() {
  _slipCarouselIdx = (_slipCarouselIdx - 1 + _slipCarouselList.length) % _slipCarouselList.length;
  _renderSlipCarousel();
}
function _slipGoNext() {
  _slipCarouselIdx = (_slipCarouselIdx + 1) % _slipCarouselList.length;
  _renderSlipCarousel();
}
// swipe on the photo, same effect as the < > buttons
function _bindSlipSwipe(selector) {
  var startX = null, startY = null;
  $(document).on('touchstart', selector, function (e) {
    var t = e.originalEvent.touches[0];
    startX = t.clientX; startY = t.clientY;
  });
  $(document).on('touchend', selector, function (e) {
    if (startX === null || _slipCarouselList.length < 2) return;
    var t = e.originalEvent.changedTouches[0];
    var dx = t.clientX - startX, dy = t.clientY - startY;
    startX = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0) _slipGoNext(); else _slipGoPrev();
    }
  });
}

// keeps Home's filter tabs/list in sync without a full Home reload
function _syncEventSettled(id, settlements) {
  var settled = settlements.every(function (s) { return s.paid });
  var idx = EVENTS.findIndex(function (e) { return e.id === id });
  if (idx !== -1 && EVENTS[idx].settled !== settled) {
    EVENTS[idx].settled = settled;
    if (typeof refreshEventsUI === 'function') refreshEventsUI();
  }
}

async function loadDetailData(id) {
  TX_SEARCH = '';
  $('#txSearchInp').val('');
  $('#txSearchClear').addClass('hidden');
  $('#txList').html(skeletonHtml(3, 'tx'));
  try {
    if (IS_SHARE) {
      var r = await gsc('getSharedEventView', SHARE_TOKEN);
      if (r.success) {
        _applyPermFromShare(r.permission);
        CUR_EV = { id: null, name: r.event.name, createdAt: r.event.createdAt, icon: r.event.icon };
        $('#hdrTitle').text(CUR_EV.name);
        $('#detailBanner').css('background', bannerGrad(CUR_EV.name));
        $('#detailEmoji').removeClass('sk-pulse').text(CUR_EV.icon || evEmoji(CUR_EV.name));
        $('#detailBannerName').removeClass('sk-pulse').text(CUR_EV.name);
        $('#detailBannerDate').removeClass('sk-pulse').text(fmtDate(CUR_EV.createdAt));
        $('#fab').toggleClass('hide', !PERM.canAdd);
        $('#btnSummary, #btnExportTx').show();
        $('#btnShareEvent').toggle(!!PERM.canShare);
        DETAILS = r.details || [];
        FRIENDS = r.friends || [];
        SETTLEMENTS = r.settlements || [];
        SELF_FRIEND_ID = r.selfFriendId || null;
        SLIPS = r.slips || {};
        ME_PHOTO = r.ownerPhoto || '';
        renderDetails();
      } else {
        $('#detailEmoji').removeClass('sk-pulse');
        $('#detailBannerName').removeClass('sk-pulse').text('ShareUp');
        $('#detailBannerDate').removeClass('sk-pulse').text('');
        $('#txList').html('<div class="empty"><div class="empty-t">Link unavailable</div><div class="empty-s">' + esc(r.error || 'This share link is no longer active') + '</div></div>');
      }
      return;
    }
    var r = await gsc('getDetailData', TK, id);
    if (r.success) {
      DETAILS = r.details || [];
      FRIENDS = r.friends || [];
      SETTLEMENTS = r.settlements || [];
      SELF_FRIEND_ID = r.selfFriendId || null;
      SLIPS = r.slips || {};
      renderDetails();
      _syncEventSettled(id, SETTLEMENTS);
    } else _handleDataError(r.error);
  } catch (e) {
    $('#detailEmoji, #detailBannerName, #detailBannerDate').removeClass('sk-pulse');
    _handleDataError('' + e);
  }
}

var TX_SEARCH = '';

function _friendNameMap(friends) {
  var fm = {};
  $.each(friends, function (_, f) { fm[f.id] = f.name });
  return fm;
}
// groups DETAILS-shaped rows by transactionId, newest tx first
function _groupDetailsByTx(details) {
  var grp = {}, ord = [];
  $.each(details, function (_, d) {
    if (!grp[d.transactionId]) { grp[d.transactionId] = []; ord.push(d.transactionId) }
    grp[d.transactionId].push(d);
  });
  ord.reverse();
  return { grp: grp, ord: ord };
}
function _isCustomSplit(rows) {
  var base = parseFloat(rows[0].amount);
  return rows.some(function (r) { return Math.abs(parseFloat(r.amount) - base) > 0.01 });
}

// Client-side port of Code.js's _computeSettlements - lets the paid
// checkboxes recompute settlements instantly from data already on screen
// instead of a round-trip after every click.
function _computeSettlementsClient(detailRows, friendMap) {
  var debt = {};
  detailRows.forEach(function (row) {
    var payerId = row.payId, participantId = row.friendId, amount = parseFloat(row.amount);
    if (participantId !== payerId) {
      if (!debt[participantId]) debt[participantId] = {};
      debt[participantId][payerId] = (debt[participantId][payerId] || 0) + amount;
    }
  });
  var netDebt = {}, processed = {};
  Object.keys(debt).forEach(function (debtor) {
    Object.keys(debt[debtor]).forEach(function (creditor) {
      var key1 = debtor + '_' + creditor, key2 = creditor + '_' + debtor;
      if (processed[key1] || processed[key2]) return;
      processed[key1] = processed[key2] = true;
      var net = (debt[debtor][creditor] || 0) - ((debt[creditor] && debt[creditor][debtor]) || 0);
      if (Math.abs(net) < 0.01) return;
      var from = net > 0 ? debtor : creditor, to = net > 0 ? creditor : debtor;
      if (!netDebt[from]) netDebt[from] = {};
      netDebt[from][to] = Math.abs(net);
    });
  });
  var settlements = [];
  Object.keys(netDebt).forEach(function (from) {
    Object.keys(netDebt[from]).forEach(function (to) {
      settlements.push({ from: from, fromName: friendMap[from] || from, to: to, toName: friendMap[to] || to, amount: Math.round(netDebt[from][to] * 100) / 100 });
    });
  });
  return settlements;
}
// Carries .paid over from the old settlement list to the new one, matched by
// (from, to, amount) - same invalidation rule the server uses, so a
// settlement whose amount shifted (a transaction got excluded/included)
// correctly reverts to unpaid instead of keeping a stale confirmation.
function _carryPaidFlags(oldSettlements, newSettlements) {
  var oldPaid = {};
  oldSettlements.forEach(function (s) {
    if (s.paid) oldPaid[s.from + '|' + s.to + '|' + Math.round(s.amount * 100)] = true;
  });
  newSettlements.forEach(function (s) {
    s.paid = !!oldPaid[s.from + '|' + s.to + '|' + Math.round(s.amount * 100)];
  });
  return newSettlements;
}
// Recomputes SETTLEMENTS from the current DETAILS array and re-renders the
// Summary tab + Home's settled badge - shared by every optimistic
// add/edit/delete transaction path (Sheets_js.html) so none of them need a
// server round-trip just to reflect the new debt totals.
function _recomputeSettlementsLocal() {
  if (!CUR_EV) return;
  var friendMap = _friendNameMap(FRIENDS);
  var rows = DETAILS.filter(function (d) { return !d.paid })
    .map(function (d) { return { payId: d.payId, friendId: d.friendId, amount: d.amount } });
  SETTLEMENTS = _carryPaidFlags(SETTLEMENTS || [], _computeSettlementsClient(rows, friendMap));
  renderSummary(SETTLEMENTS);
  _syncEventSettled(CUR_EV.id, SETTLEMENTS);
}

function renderDetails() {
  var $el = $('#txList');
  if (!DETAILS.length) {
    $el.html(
      '<div class="empty">' +
      '<div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M18 17H6v-2h12v2zm0-4H6v-2h12v2zm0-4H6V7h12v2zM3 22l1.5-1.5L6 22l1.5-1.5L9 22l1.5-1.5L12 22l1.5-1.5L15 22l1.5-1.5L18 22l1.5-1.5L21 22V2l-1.5 1.5L18 2l-1.5 1.5L15 2l-1.5 1.5L12 2l-1.5 1.5L9 2 7.5 3.5 6 2 4.5 3.5 3 2v20z"/></svg></div>' +
      '<div class="empty-t">No transactions yet</div>' +
      '<div class="empty-s">Tap + to record the first expense</div>' +
      '</div>'
    );
    return;
  }
  var fm = _friendNameMap(FRIENDS);
  var g = _groupDetailsByTx(DETAILS), grp = g.grp, ord = g.ord;
  var q = TX_SEARCH.trim().toLowerCase();
  if (q) {
    ord = ord.filter(function (tid) {
      var f = grp[tid][0];
      var desc = (f.description || '').toLowerCase();
      var payer = (fm[f.payId] || '').toLowerCase();
      return desc.indexOf(q) !== -1 || payer.indexOf(q) !== -1;
    });
  }
  if (!ord.length) {
    $el.html('<div class="empty"><div class="empty-t">No matching expenses</div><div class="empty-s">Try a different search</div></div>');
    return;
  }
  var html = $.map(ord, function (tid, i) {
    var rows = grp[tid], f = rows[0];
    var pn    = fm[f.payId] || f.payId;
    var total = parseFloat(f.totalAmount);
    var desc  = f.description || 'Transaction';
    var isCustom = _isCustomSplit(rows);
    var chips = $.map(rows, function (r) {
      var name = fm[r.friendId] || r.friendId;
      return '<span class="tx-chip">' + esc(name) + (isCustom ? ' ' + fmtAmt(r.amount) : '') + '</span>';
    }).join('');
    var d = new Date(f.createdAt);
    var timeStr = isNaN(d) ? '' : d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    var isLast = i === ord.length - 1;
    var footerBtns =
      (PERM.canEdit ? '<button class="sched-act-btn tx-edit" data-tid="' + esc(tid) + '" title="Edit">' +
        '<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.9959.9959 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></button>' : '') +
      (PERM.canDelete ? '<button class="sched-act-btn del tx-del" data-tid="' + esc(tid) + '" data-desc="' + esc(desc) + '" title="Delete">' +
        '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>' : '');
    var canTogglePaid = !IS_SHARE || PERM.canEdit;
    var paidCheck = canTogglePaid
      ? '<label class="se-check tx-paid-check" title="Exclude this expense from settlement calculations">' +
        '<input type="checkbox" class="tx-paid-cb" data-tid="' + esc(tid) + '"' + (f.paid ? ' checked' : '') + '>' +
        '<span class="se-check-box"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>' +
        '</label><span class="tx-paid-lbl">Paid</span>'
      : '<span class="se-check tx-paid-check is-static" title="' + (f.paid ? 'Paid' : 'Not paid') + '">' +
        '<span class="se-check-box' + (f.paid ? ' checked' : '') + '"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>' +
        '</span><span class="tx-paid-lbl">' + (f.paid ? 'Paid' : 'Not paid') + '</span>';
    var footerHtml = '<div class="sched-card-footer">' + paidCheck + '<span class="tx-paid-spacer"></span>' + footerBtns + '</div>';
    return '<div class="sched-item">' +
      '<div class="sched-time-col"><div class="sched-time">' + esc(timeStr) + '</div><div class="sched-date">' + fmtDate(f.createdAt) + '</div></div>' +
      '<div class="sched-axis">' + (isLast ? '' : '<div class="sched-line"></div>') + '</div>' +
      '<div class="sched-card' + (f.paid ? ' paid' : '') + '" data-tid="' + esc(tid) + '">' +
      '<div class="tx-head">' +
      avatarHtml('tx-av', pn, f.payId) +
      '<div class="tx-meta">' +
      '<div class="tx-desc">' + highlightText(desc, q) + '</div>' +
      '<div class="tx-by">Paid by ' + highlightText(pn, q) + (isCustom ? ' · custom' : '') + '</div>' +
      '</div>' +
      (SLIPS[tid] && SLIPS[tid].length ?
        '<button class="sched-slip-btn tx-view-slip" data-tid="' + esc(tid) + '" title="View receipt">' +
        '<svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>' +
        '</button>' : '') +
      '<div class="tx-amt">' + fmtAmt(total) + '</div>' +
      '</div>' +
      '<div class="tx-people">' + chips + '</div>' +
      footerHtml +
      '</div>' +
      '</div>';
  }).join('');
  $el.html(html);
}

// Blends a hex color toward white by pct (0-1) - used to build light tint
// backgrounds for the PDF from the live theme instead of hardcoded hex,
// since html2canvas can't reliably resolve CSS color-mix() when rasterizing.
function _tintHex(hex, pct) {
  hex = (hex || '#4F46E5').replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(function (c) { return c + c }).join('');
  var r = parseInt(hex.slice(0, 2), 16), g = parseInt(hex.slice(2, 4), 16), b = parseInt(hex.slice(4, 6), 16);
  var mix = function (c) { return Math.round(c + (255 - c) * pct) };
  return 'rgb(' + mix(r) + ',' + mix(g) + ',' + mix(b) + ')';
}

// lazy-loaded on first export so a normal page load never pays for these
var _pdfLibsPromise = null;
function _loadPdfLibs() {
  if (_pdfLibsPromise) return _pdfLibsPromise;
  _pdfLibsPromise = new Promise(function (resolve, reject) {
    var s1 = document.createElement('script');
    s1.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s1.onload = function () {
      var s2 = document.createElement('script');
      s2.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
      s2.onload = resolve;
      s2.onerror = reject;
      document.head.appendChild(s2);
    };
    s1.onerror = reject;
    document.head.appendChild(s1);
  });
  return _pdfLibsPromise;
}

async function exportExpensesPdf() {
  if (!CUR_EV) return;
  if (!DETAILS.length) { toast('No expenses to export yet', 'warn'); return }

  toast('Preparing PDF…');
  try {
    await _loadPdfLibs();
  } catch (e) {
    toast('Could not load the PDF library — check your connection', 'err');
    return;
  }

  // Read the live, admin-configurable theme instead of hardcoded colors, so
  // the exported PDF actually matches whatever branding is set up.
  var cs = getComputedStyle(document.documentElement);
  var THEME = {
    p: (cs.getPropertyValue('--p') || '#4F46E5').trim(),
    pLt: (cs.getPropertyValue('--p-lt') || '#4338CA').trim(),
    g: (cs.getPropertyValue('--g') || '#15803D').trim(),
    t1: (cs.getPropertyValue('--t1') || '#0F172A').trim(),
    t2: (cs.getPropertyValue('--t2') || '#64748B').trim(),
    bd: (cs.getPropertyValue('--bd') || '#E2E8F0').trim()
  };
  var pTint = _tintHex(THEME.p, .94), pTintBd = _tintHex(THEME.p, .82);
  var gTint = _tintHex(THEME.g, .94), gTintBd = _tintHex(THEME.g, .78);

  var fm = _friendNameMap(FRIENDS);
  var g0 = _groupDetailsByTx(DETAILS), grp = g0.grp, ord = g0.ord;

  var grandTotal = 0;
  var paidTotals = {}, shareTotals = {};
  var txRowHtmls = ord.map(function (tid, idx) {
    var group = grp[tid], f = group[0];
    var payerName = fm[f.payId] || f.payId;
    var total = parseFloat(f.totalAmount);
    grandTotal += total;
    paidTotals[f.payId] = (paidTotals[f.payId] || 0) + total;
    var isCustom = _isCustomSplit(group);
    var paidForHtml = group.map(function (g) {
      shareTotals[g.friendId] = (shareTotals[g.friendId] || 0) + parseFloat(g.amount);
      var n = esc(fm[g.friendId] || g.friendId);
      return isCustom ? n + ' <span style="color:' + THEME.pLt + '">(' + esc(fmtAmt(g.amount)) + ')</span>' : n;
    }).join(', ');
    var perPersonCell = isCustom ? 'Custom' : esc(fmtAmt(total / group.length));
    var rowBg = idx % 2 ? 'background:' + pTint : '';
    var td = 'padding:9px 10px;border-bottom:1px solid ' + THEME.bd + ';vertical-align:top';
    var d = new Date(f.createdAt);
    var dateTime = esc(fmtDate(f.createdAt)) + (isNaN(d) ? '' : ' ' + esc(d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })));
    return '<tr style="' + rowBg + '">' +
      '<td style="' + td + ';color:' + THEME.t2 + ';white-space:nowrap">' + dateTime + '</td>' +
      '<td style="' + td + ';color:' + THEME.t1 + ';font-weight:600">' + esc(f.description || 'Transaction') + '</td>' +
      '<td style="' + td + ';text-align:right;color:' + THEME.t1 + ';font-weight:700">' + esc(fmtAmt(total)) + '</td>' +
      '<td style="' + td + ';color:' + THEME.t1 + '">' + esc(payerName) + '</td>' +
      '<td style="' + td + ';color:' + THEME.t2 + '">' + paidForHtml + '</td>' +
      '<td style="' + td + ';text-align:right;color:' + THEME.pLt + ';font-weight:700;white-space:nowrap">' + perPersonCell + '</td>' +
      '</tr>';
  });

  // Per-person totals: how much each friend paid overall vs. their overall
  // share of every expense - net is positive if they're owed money overall.
  var personRows = FRIENDS.map(function (f) {
    var paid = paidTotals[f.id] || 0, share = shareTotals[f.id] || 0;
    return { name: f.name, paid: paid, share: share, net: paid - share };
  }).filter(function (p) { return p.paid || p.share });

  // reuse already-loaded settlements; only re-fetch if invalidated
  var settlements = SETTLEMENTS;
  if (settlements === null) {
    try {
      var r = IS_SHARE ? await gsc('getSharedEventView', SHARE_TOKEN) : await gsc('getSummary', TK, CUR_EV.id);
      if (r.success) settlements = r.settlements || [];
    } catch (e) {}
  }

  var settleHtml;
  if (settlements === null) {
    settleHtml = '<div style="padding:16px;text-align:center;color:' + THEME.t2 + ';font-size:12px">Could not load summary</div>';
  } else if (!settlements.length) {
    settleHtml = '<div style="background:' + gTint + ';border:1px solid ' + gTintBd + ';border-radius:12px;padding:14px 16px;text-align:center;color:' + THEME.g + ';font-weight:700;font-size:13px">🎉 All settled — nobody owes anyone</div>';
  } else {
    settleHtml = settlements.map(function (s) {
      return '<div style="display:flex;align-items:center;gap:10px;background:' + pTint + ';border:1px solid ' + pTintBd + ';border-radius:12px;padding:11px 16px;margin-bottom:8px">' +
        '<div style="font-weight:700;font-size:12.5px;color:' + THEME.t1 + ';flex:1">' + esc(s.fromName) + '</div>' +
        '<div style="font-size:11px;color:' + THEME.pLt + ';font-weight:600;white-space:nowrap">Owes →</div>' +
        '<div style="font-weight:700;font-size:12.5px;color:' + THEME.t1 + ';flex:1">' + esc(s.toName) + '</div>' +
        '<div style="font-weight:800;font-size:13.5px;color:' + THEME.pLt + ';min-width:90px;text-align:right">' + esc(fmtAmt(s.amount)) + '</div>' +
        '</div>';
    }).join('');
  }

  var personTotalsHtml = !personRows.length ? '' :
    '<table style="width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed;margin-bottom:30px">' +
    '<colgroup><col style="width:34%"><col style="width:22%"><col style="width:22%"><col style="width:22%"></colgroup>' +
    '<thead><tr style="background:' + pTint + '">' +
    '<th style="padding:9px 10px;text-align:left;color:' + THEME.pLt + ';font-size:10.5px;letter-spacing:.3px">Person</th>' +
    '<th style="padding:9px 10px;text-align:right;color:' + THEME.pLt + ';font-size:10.5px;letter-spacing:.3px">Paid</th>' +
    '<th style="padding:9px 10px;text-align:right;color:' + THEME.pLt + ';font-size:10.5px;letter-spacing:.3px">Share</th>' +
    '<th style="padding:9px 10px;text-align:right;color:' + THEME.pLt + ';font-size:10.5px;letter-spacing:.3px">Net</th>' +
    '</tr></thead><tbody>' +
    personRows.map(function (p, idx) {
      var netColor = p.net > 0.005 ? THEME.g : (p.net < -0.005 ? '#DC2626' : THEME.t2);
      var netLabel = (p.net > 0.005 ? '+' : '') + esc(fmtAmt(p.net));
      var rowBg = idx % 2 ? 'background:' + pTint : '';
      var td = 'padding:9px 10px;border-bottom:1px solid ' + THEME.bd;
      return '<tr style="' + rowBg + '">' +
        '<td style="' + td + ';color:' + THEME.t1 + ';font-weight:600">' + esc(p.name) + '</td>' +
        '<td style="' + td + ';text-align:right;color:' + THEME.t1 + '">' + esc(fmtAmt(p.paid)) + '</td>' +
        '<td style="' + td + ';text-align:right;color:' + THEME.t1 + '">' + esc(fmtAmt(p.share)) + '</td>' +
        '<td style="' + td + ';text-align:right;font-weight:700;color:' + netColor + '">' + netLabel + '</td>' +
        '</tr>';
    }).join('') + '</tbody></table>';

  var now = new Date();
  var generatedAt = now.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) +
    ' ' + now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

  function sectionHead(label) {
    return '<div style="font-size:15px;font-weight:800;color:' + THEME.pLt + ';margin-bottom:12px">' +
      '<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:' + THEME.p + ';margin-right:8px"></span>' + label + '</div>';
  }

  var coverHtml =
    '<div style="background:linear-gradient(135deg,' + THEME.p + ' 0%,' + THEME.pLt + ' 100%);border-radius:18px;padding:26px 30px;margin-bottom:26px;color:#fff">' +
    '<div style="font-size:11px;letter-spacing:2px;font-weight:700;opacity:.85;margin-bottom:8px">SHAREUP · Expense Summary</div>' +
    '<div style="font-size:26px;font-weight:800;margin-bottom:4px">' + esc(CUR_EV.name) + '</div>' +
    '<div style="font-size:12px;opacity:.85">Created ' + esc(fmtDate(CUR_EV.createdAt)) + ' · Generated ' + esc(generatedAt) + '</div>' +
    '</div>' +
    '<div style="display:flex;gap:12px;margin-bottom:28px">' +
    [['Total Amount', esc(fmtAmt(grandTotal))], ['Total Transactions', ord.length], ['Members', FRIENDS.length]].map(function (s) {
      return '<div style="flex:1;background:' + pTint + ';border:1px solid ' + pTintBd + ';border-radius:14px;padding:14px 18px">' +
        '<div style="font-size:11px;color:' + THEME.pLt + ';font-weight:700;margin-bottom:5px">' + s[0] + '</div>' +
        '<div style="font-size:19px;font-weight:800;color:' + THEME.t1 + '">' + s[1] + '</div></div>';
    }).join('') +
    '</div>' +
    sectionHead('Settlement Summary — who owes whom') +
    '<div style="margin-bottom:30px">' + settleHtml + '</div>' +
    (personTotalsHtml ? sectionHead('Per-Person Totals') + personTotalsHtml : '');

  var tableHeadHtml =
    '<colgroup><col style="width:15%"><col style="width:16%"><col style="width:11%"><col style="width:13%"><col style="width:30%"><col style="width:15%"></colgroup>' +
    '<thead><tr style="background:' + pTint + '">' +
    '<th style="padding:9px 10px;text-align:left;color:' + THEME.pLt + ';font-size:10.5px;letter-spacing:.3px">Date</th>' +
    '<th style="padding:9px 10px;text-align:left;color:' + THEME.pLt + ';font-size:10.5px;letter-spacing:.3px">Description</th>' +
    '<th style="padding:9px 10px;text-align:right;color:' + THEME.pLt + ';font-size:10.5px;letter-spacing:.3px">Total</th>' +
    '<th style="padding:9px 10px;text-align:left;color:' + THEME.pLt + ';font-size:10.5px;letter-spacing:.3px">Paid By</th>' +
    '<th style="padding:9px 10px;text-align:left;color:' + THEME.pLt + ';font-size:10.5px;letter-spacing:.3px">Split Between</th>' +
    '<th style="padding:9px 10px;text-align:right;color:' + THEME.pLt + ';font-size:10.5px;letter-spacing:.3px">Per Person</th>' +
    '</tr></thead>';

  var PAGE_W = 760;
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF('p', 'pt', 'a4');
  var margin = 20;
  var pageW = doc.internal.pageSize.getWidth();
  var pageH = doc.internal.pageSize.getHeight();
  var usableW = pageW - margin * 2;
  var usableH = pageH - margin * 2;
  var usableHPx = usableH * PAGE_W / usableW; // max content height per page, in the render container's own CSS px

  function renderHidden(html) {
    var hideWrap = document.createElement('div');
    hideWrap.style.cssText = 'position:absolute;top:0;left:0;width:0;height:0;overflow:hidden;';
    var container = document.createElement('div');
    container.style.cssText = 'width:' + PAGE_W + 'px;padding:36px;background:#fff;font-family:\'Sarabun\',\'Segoe UI\',sans-serif;color:' + THEME.t1 + ';';
    container.innerHTML = html;
    hideWrap.appendChild(container);
    document.body.appendChild(hideWrap);
    return hideWrap;
  }

  // rasterize to an image — jsPDF's own .html() renderer uses Latin-only fonts and garbles Thai
  async function rasterize(html) {
    var hideWrap = renderHidden(html);
    try {
      return await html2canvas(hideWrap.firstChild, { scale: 2, backgroundColor: '#fff', windowWidth: PAGE_W });
    } finally {
      document.body.removeChild(hideWrap);
    }
  }

  var filename = (CUR_EV.name || 'expenses').replace(/[^\w฀-๿ -]/g, '') + '_expenses.pdf';
  var pageCanvases = [];
  try {
    // Page 1 is always the summary/cover - simplest way to guarantee its own
    // page without needing to also chunk it row-by-row.
    pageCanvases.push(await rasterize(coverHtml));

    // Transaction table: measure real row heights first, then chunk into
    // page-sized groups so a page break never lands mid-row, and repeat the
    // column header + a small event-name reminder on every continuation page.
    var measureWrap = renderHidden(
      '<table style="width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed">' + tableHeadHtml +
      '<tbody>' + txRowHtmls.join('') + '</tbody></table>'
    );
    var rowEls = measureWrap.querySelectorAll('tbody tr');
    var rowHeights = Array.prototype.map.call(rowEls, function (el) { return el.offsetHeight });
    var headHeight = measureWrap.querySelector('thead').offsetHeight;
    document.body.removeChild(measureWrap);

    var FOOTER_RESERVE = 30; // room for the "Generated by ShareUp" line on the last chunk
    var chunks = [[]], curH = headHeight;
    rowHeights.forEach(function (h, i) {
      if (curH + h > usableHPx - FOOTER_RESERVE && chunks[chunks.length - 1].length) {
        chunks.push([]);
        curH = headHeight;
      }
      chunks[chunks.length - 1].push(i);
      curH += h;
    });

    for (var c = 0; c < chunks.length; c++) {
      var rowsHtml = chunks[c].map(function (i) { return txRowHtmls[i] }).join('');
      var isLast = c === chunks.length - 1;
      var chunkHtml =
        (c === 0 ? sectionHead('All Expenses') : '<div style="font-size:12px;color:' + THEME.t2 + ';margin-bottom:10px">' + esc(CUR_EV.name) + ' (continued)</div>') +
        '<table style="width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed">' + tableHeadHtml + '<tbody>' + rowsHtml + '</tbody></table>' +
        (isLast ? '<div style="margin-top:26px;text-align:center;font-size:10px;color:' + THEME.t2 + '">Generated by ShareUp</div>' : '');
      pageCanvases.push(await rasterize(chunkHtml));
    }
  } catch (e) {
    toast('Could not generate PDF', 'err');
    return;
  }

  pageCanvases.forEach(function (canvas, i) {
    if (i > 0) doc.addPage();
    var imgH = canvas.height * usableW / canvas.width;
    doc.addImage(canvas.toDataURL('image/png'), 'PNG', margin, margin, usableW, imgH);
    doc.setFontSize(8);
    doc.setTextColor(150);
    doc.text('Page ' + (i + 1) + ' of ' + pageCanvases.length, pageW - margin, pageH - 8, { align: 'right' });
  });
  doc.save(filename);
}

// fallback path: only hit when SETTLEMENTS wasn't already bundled/cached (see switchTab())
async function loadSummary(id) {
  $('#sumList').html(skeletonHtml(2, 'sum'));
  try {
    if (IS_SHARE) {
      var r = await gsc('getSharedEventView', SHARE_TOKEN);
      if (r.success) { SETTLEMENTS = r.settlements || []; renderSummary(SETTLEMENTS) }
      else _handleDataError(r.error);
      return;
    }
    var r = await gsc('getSummary', TK, id);
    if (r.success) {
      SETTLEMENTS = r.settlements || [];
      renderSummary(SETTLEMENTS);
      _syncEventSettled(id, SETTLEMENTS);
    } else _handleDataError(r.error);
  } catch (e) { _handleDataError('' + e) }
}

function renderSummary(ss) {
  var $el = $('#sumList');
  if (!ss.length) {
    $el.html(
      '<div class="empty">' +
      '<div class="empty-icon" style="background:var(--g-dim);border-color:rgba(34,197,94,.2)">' +
      '<svg viewBox="0 0 24 24" style="fill:var(--g)"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>' +
      '</div>' +
      '<div class="empty-t" style="color:var(--g)">All Settled! 🎉</div>' +
      '<div class="empty-s">Everyone is even — no payments needed</div>' +
      '</div>'
    );
    return;
  }
  var html = $.map(ss, function (x) {
    return '<div class="settle-card' + (x.paid ? ' paid' : '') + '">' +
      '<div class="se-person">' +
      avatarHtml('se-av', x.fromName, x.from) +
      '<div class="se-name">' + esc(x.fromName) + '</div>' +
      '</div>' +
      '<div class="se-mid">' +
      '<div class="se-label">owes <span class="se-arrow">→</span></div>' +
      '<div class="se-amt">' + fmtAmt(x.amount) + '</div>' +
      '</div>' +
      '<div class="se-person">' +
      avatarHtml('se-av', x.toName, x.to) +
      '<div class="se-name">' + esc(x.toName) + '</div>' +
      '</div>' +
      ((!IS_SHARE || PERM.canEdit)
        ? '<label class="se-check">' +
          '<input type="checkbox" class="se-paid-cb" data-from="' + esc(x.from) + '" data-to="' + esc(x.to) + '" data-amt="' + x.amount + '"' + (x.paid ? ' checked' : '') + '>' +
          '<span class="se-check-box"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>' +
          '</label>'
        : '<span class="se-check is-static" title="' + (x.paid ? 'Paid' : 'Not paid') + '">' +
          '<span class="se-check-box' + (x.paid ? ' checked' : '') + '"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>' +
          '</span>') +
      '</div>';
  }).join('');
  $el.html(html);
}

// ── Share Event ────────────────────────────────
var _sharePermission = 'view';

function _setShareLinkVisible(hasLink) {
  $('#shareOff').toggle(!hasLink);
  $('#shareOn').toggle(hasLink);
}
// wraps a gsc() call: toasts on failure/exception, returns the result (or null)
async function _gscOrToast(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  try {
    var r = await gsc.apply(null, [fn].concat(args));
    if (!r.success) toast(r.error, 'err');
    return r;
  } catch (e) { toast('' + e, 'err'); return null }
}

async function openShareSheet() {
  if (!CUR_EV) return;
  _sharePermission = 'view';
  _renderSharePerm();
  _setShareLinkVisible(false);
  openSheet('shShare');
  try { // silent: this is just a background prefetch of an existing link
    var r = await gsc('getShareLink', TK, CUR_EV.id);
    if (r.success && r.shareToken) {
      _sharePermission = r.permission || 'view';
      _renderSharePerm();
      showShareLink(r.shareUrl);
    }
  } catch (e) {}
}

function _renderSharePerm() {
  var editMode = _sharePermission === 'edit';
  $('#shPermView').toggleClass('on', !editMode);
  $('#shPermEdit').toggleClass('on', editMode);
  $('#shareOffHint').text(editMode
    ? "Anyone with the link can view AND add, edit, or delete this event's expenses — no login required."
    : "Anyone with the link can view this event's expenses and summary — they won't be able to add, edit, or delete anything.");
  $('#shareOnHint').text(editMode
    ? 'Anyone with this link can view and edit expenses for this event. Turn it off anytime to revoke access.'
    : 'Anyone with this link can view — but not edit — this event. Turn it off anytime to revoke access.');
}

function _setSharePermission(perm) {
  if (_sharePermission === perm) return;
  var oldPerm = _sharePermission;
  _sharePermission = perm;
  _renderSharePerm();
  if (!$('#shareOn').is(':visible')) return; // no link yet - just changes what "Create" will use
  bgSync(
    function () { return gsc('enableEventShare', TK, CUR_EV.id, perm) },
    function () { _sharePermission = oldPerm; _renderSharePerm() }
  );
}

function showShareLink(url) {
  $('#shareLinkInp').val(url);
  _setShareLinkVisible(true);
}

// The share token is server-generated - can't be predicted client-side, so
// the link section reveals with a placeholder immediately and fills in the
// real URL once the background call resolves.
function enableShare() {
  if (!CUR_EV) return;
  var eventId = CUR_EV.id, perm = _sharePermission;
  $('#shareLinkInp').val('Generating link…');
  _setShareLinkVisible(true);
  toast('Sharing turned on');
  bgSync(
    function () { return gsc('enableEventShare', TK, eventId, perm) },
    function () { _setShareLinkVisible(false) },
    function (r) { showShareLink(r.shareUrl) }
  );
}

function disableShare() {
  if (!CUR_EV) return;
  var eventId = CUR_EV.id;
  var oldUrl = $('#shareLinkInp').val();
  _setShareLinkVisible(false);
  toast('Sharing turned off');
  bgSync(
    function () { return gsc('disableEventShare', TK, eventId) },
    function () { $('#shareLinkInp').val(oldUrl); _setShareLinkVisible(true) }
  );
}

function copyShareLink() { copyInputValue('shareLinkInp') }

$(function () {
  $('#txSearchInp').on('input', function () {
    TX_SEARCH = $(this).val();
    $('#txSearchClear').toggleClass('hidden', !TX_SEARCH);
    renderDetails();
  });
  $('#txSearchClear').on('click', function () {
    TX_SEARCH = '';
    $('#txSearchInp').val('').trigger('focus');
    $(this).addClass('hidden');
    renderDetails();
  });

  $('#btnSummary').on('click', openSummarySheet);
  $('#shSummaryClose').on('click', closeSheets);
  $('#txList').on('click', '.tx-del', function (e) {
    e.stopPropagation();
    askDel('tx', $(this).data('tid'), $(this).data('desc'));
  });
  $('#txList').on('click', '.tx-edit', function (e) {
    e.stopPropagation();
    openEditTxSheet($(this).data('tid'));
  });
  $('#txList').on('click', '.tx-view-slip', function (e) {
    e.stopPropagation();
    var slips = SLIPS[$(this).data('tid')];
    if (!slips || !slips.length) return;
    openSlipCarousel(slips);
  });
  $('#slipPrev').on('click', _slipGoPrev);
  $('#slipNext').on('click', _slipGoNext);
  _bindSlipSwipe('#slipCarousel');
  $('#slipDlBtn').on('click', function (e) {
    e.stopPropagation();
    $('#slipDlMenu').toggleClass('on');
  });
  $(document).on('click', function () { $('#slipDlMenu').removeClass('on') });
  $('#slipDlPreview').on('click', function () {
    var cur = _curSlip();
    if (cur) _downloadDataUri(cur.slip, 'receipt-preview.jpg');
  });
  $('#slipDlOrig').on('click', function () {
    var cur = _curSlip();
    if (cur) _downloadDataUri(cur.slipHi || cur.slip, 'receipt.jpg');
  });
  // Both handlers below update SETTLEMENTS/DETAILS and re-render from data
  // already on screen, then fire the save in the background - no reload on
  // the happy path. On failure, fall back to a full reload to resync.
  $('#sumList').on('change', '.se-paid-cb', function () {
    if (!CUR_EV) return;
    if (IS_SHARE && !PERM.canEdit) return; // defense-in-depth - checkbox is already disabled in this case
    var from = $(this).data('from'), to = $(this).data('to'), amt = parseFloat($(this).data('amt'));
    var paid = $(this).is(':checked');
    var s = SETTLEMENTS.filter(function (x) { return x.from === from && x.to === to && Math.abs(x.amount - amt) < 0.01 })[0];
    if (s) s.paid = paid;
    renderSummary(SETTLEMENTS);
    _syncEventSettled(CUR_EV.id, SETTLEMENTS);
    var call = IS_SHARE
      ? _gscOrToast('markSettlementPaidViaShare', SHARE_TOKEN, from, to, amt, paid)
      : _gscOrToast('markSettlementPaid', TK, CUR_EV.id, from, to, amt, paid);
    call.then(function (r) {
      if (!r || !r.success) loadSummary(CUR_EV.id);
    });
  });
  $('#txList').on('change', '.tx-paid-cb', function () {
    if (!CUR_EV) return;
    if (IS_SHARE && !PERM.canEdit) return; // defense-in-depth - checkbox is already disabled in this case
    var tid = $(this).data('tid');
    var paid = $(this).is(':checked');
    DETAILS.forEach(function (d) { if (d.transactionId === tid) d.paid = paid });
    _recomputeSettlementsLocal();
    renderDetails();
    var call = IS_SHARE
      ? _gscOrToast('markTransactionPaidViaShare', SHARE_TOKEN, tid, paid)
      : _gscOrToast('markTransactionPaid', TK, CUR_EV.id, tid, paid);
    call.then(function (r) {
      if (!r || !r.success) loadDetailData(CUR_EV.id);
    });
  });
  $('#btnShareEvent').on('click', openShareSheet);
  $('#btnEnableShare').on('click', enableShare);
  $('#btnCopyShare').on('click', copyShareLink);
  $('#btnDisableShare').on('click', disableShare);
  $('#shPermView').on('click', function () { _setSharePermission('view') });
  $('#shPermEdit').on('click', function () { _setSharePermission('edit') });
  $('#btnExportTx').on('click', exportExpensesPdf);
});
