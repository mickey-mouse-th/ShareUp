<script>
async function loadDetailData(id) {
  $('#txList').html(skeletonHtml(3, 'tx'));
  try {
    var r = await gsc('getDetailData', TK, id);
    if (r.success) {
      DETAILS = r.details || [];
      FRIENDS = r.friends || [];
      renderDetails();
    } else _handleDataError(r.error);
  } catch (e) { _handleDataError('' + e) }
}

function renderDetails() {
  var $el = $('#txList');
  if (!DETAILS.length) {
    $el.html(
      '<div class="empty">' +
      '<div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M18 17H6v-2h12v2zm0-4H6v-2h12v2zm0-4H6V7h12v2zM3 22l1.5-1.5L6 22l1.5-1.5L9 22l1.5-1.5L12 22l1.5-1.5L15 22l1.5-1.5L18 22l1.5-1.5L21 22V2l-1.5 1.5L18 2l-1.5 1.5L15 2l-1.5 1.5L12 2l-1.5 1.5L9 2 7.5 3.5 6 2 4.5 3.5 3 2v20z"/></svg></div>' +
      '<div class="empty-t">No transactions yet</div>' +
      '<div class="empty-s">Tap + to record the first expense</div>' +
      '</div>'
    );
    return;
  }
  var fm = {};
  $.each(FRIENDS, function (_, f) { fm[f.id] = f.name });
  var grp = {}, ord = [];
  $.each(DETAILS, function (_, d) {
    if (!grp[d.transactionId]) { grp[d.transactionId] = []; ord.push(d.transactionId) }
    grp[d.transactionId].push(d);
  });
  ord.reverse();
  var html = $.map(ord, function (tid) {
    var rows = grp[tid], f = rows[0];
    var pn    = fm[f.payId] || f.payId;
    var total = parseFloat(f.totalAmount);
    var desc  = f.description || 'Transaction';
    var isCustom = $.grep(rows, function (r) {
      return Math.abs(parseFloat(r.amount) - parseFloat(rows[0].amount)) > 0.01;
    }).length > 0;
    var chips = $.map(rows, function (r) {
      var name = fm[r.friendId] || r.friendId;
      return '<span class="tx-chip">' + esc(name) + (isCustom ? ' ' + fmtAmt(r.amount) : '') + '</span>';
    }).join('');
    return '<div class="tx-card">' +
      '<div class="tx-head">' +
      '<div class="tx-av" style="background:' + avCol(pn) + '">' + initials(pn) + '</div>' +
      '<div class="tx-meta">' +
      '<div class="tx-desc">' + esc(desc) + '</div>' +
      '<div class="tx-by">Paid by ' + esc(pn) + (isCustom ? ' · ระบุเอง' : '') + '</div>' +
      '</div>' +
      '<div class="tx-amt">' + fmtAmt(total) + '</div>' +
      '</div>' +
      '<div class="tx-people">' + chips + '</div>' +
      '<div class="tx-foot">' +
      '<span class="tx-date">' + fmtDate(f.createdAt) + '</span>' +
      '<div class="tx-actions">' +
      '<button class="btn-edit tx-edit" data-tid="' + esc(tid) + '">' +
      '<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.9959.9959 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>' +
      '</button>' +
      '<button class="btn-del tx-del" data-tid="' + esc(tid) + '" data-desc="' + esc(desc) + '">' +
      '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>' +
      '</button>' +
      '</div>' +
      '</div>' +
      '</div>';
  }).join('');
  $el.html(html);
}

// Lazy-loaded on first export so a normal page load never pays for these.
var _pdfLibsPromise = null;
function _loadPdfLibs() {
  if (_pdfLibsPromise) return _pdfLibsPromise;
  _pdfLibsPromise = new Promise(function (resolve, reject) {
    var s1 = document.createElement('script');
    s1.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s1.onload = function () {
      var s2 = document.createElement('script');
      s2.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
      s2.onload = resolve;
      s2.onerror = reject;
      document.head.appendChild(s2);
    };
    s1.onerror = reject;
    document.head.appendChild(s1);
  });
  return _pdfLibsPromise;
}

async function exportExpensesPdf() {
  if (!CUR_EV) return;
  if (!DETAILS.length) { toast('No expenses to export yet', 'warn'); return }

  toast('Preparing PDF…');
  try {
    await _loadPdfLibs();
  } catch (e) {
    toast('Could not load the PDF library — check your connection', 'err');
    return;
  }

  var fm = {};
  $.each(FRIENDS, function (_, f) { fm[f.id] = f.name });
  var grp = {}, ord = [];
  $.each(DETAILS, function (_, d) {
    if (!grp[d.transactionId]) { grp[d.transactionId] = []; ord.push(d.transactionId) }
    grp[d.transactionId].push(d);
  });
  ord.reverse();

  var grandTotal = 0;
  var txRowsHtml = ord.map(function (tid, idx) {
    var group = grp[tid], f = group[0];
    var payerName = fm[f.payId] || f.payId;
    var total = parseFloat(f.totalAmount);
    grandTotal += total;
    var isCustom = group.some(function (g) {
      return Math.abs(parseFloat(g.amount) - parseFloat(group[0].amount)) > 0.01;
    });
    var paidForHtml = group.map(function (g) {
      var n = esc(fm[g.friendId] || g.friendId);
      return isCustom ? n + ' <span style="color:#9333EA">(' + esc(fmtAmt(g.amount)) + ')</span>' : n;
    }).join(', ');
    var perPersonCell = isCustom ? 'ระบุเอง' : esc(fmtAmt(total / group.length));
    var rowBg = idx % 2 ? 'background:#FBF7FF' : '';
    var td = 'padding:9px 10px;border-bottom:1px solid #EDE4FB;vertical-align:top';
    return '<tr style="' + rowBg + '">' +
      '<td style="' + td + ';color:#6B7280;white-space:nowrap">' + esc(fmtDate(f.createdAt)) + '</td>' +
      '<td style="' + td + ';color:#1F2937;font-weight:600">' + esc(f.description || 'Transaction') + '</td>' +
      '<td style="' + td + ';text-align:right;color:#1F2937;font-weight:700">' + esc(fmtAmt(total)) + '</td>' +
      '<td style="' + td + ';color:#1F2937">' + esc(payerName) + '</td>' +
      '<td style="' + td + ';color:#4B5563">' + paidForHtml + '</td>' +
      '<td style="' + td + ';text-align:right;color:#581C87;font-weight:700;white-space:nowrap">' + perPersonCell + '</td>' +
      '</tr>';
  }).join('');

  var settlements = null;
  try {
    var r = await gsc('getSummary', TK, CUR_EV.id);
    if (r.success) settlements = r.settlements || [];
  } catch (e) {}

  var settleHtml;
  if (settlements === null) {
    settleHtml = '<div style="padding:16px;text-align:center;color:#9CA3AF;font-size:12px">ไม่สามารถโหลดสรุปยอดได้</div>';
  } else if (!settlements.length) {
    settleHtml = '<div style="background:#ECFDF5;border:1px solid #A7F3D0;border-radius:12px;padding:14px 16px;text-align:center;color:#047857;font-weight:700;font-size:13px">🎉 ยอดเคลียร์เรียบร้อย ไม่มีใครต้องจ่ายใคร</div>';
  } else {
    settleHtml = settlements.map(function (s) {
      return '<div style="display:flex;align-items:center;gap:10px;background:#FBF7FF;border:1px solid #E9D5FF;border-radius:12px;padding:11px 16px;margin-bottom:8px">' +
        '<div style="font-weight:700;font-size:12.5px;color:#1F2937;flex:1">' + esc(s.fromName) + '</div>' +
        '<div style="font-size:11px;color:#9333EA;font-weight:600;white-space:nowrap">ต้องจ่าย →</div>' +
        '<div style="font-weight:700;font-size:12.5px;color:#1F2937;flex:1">' + esc(s.toName) + '</div>' +
        '<div style="font-weight:800;font-size:13.5px;color:#581C87;min-width:90px;text-align:right">' + esc(fmtAmt(s.amount)) + '</div>' +
        '</div>';
    }).join('');
  }

  var now = new Date();
  var generatedAt = now.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }) +
    ' ' + now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

  var hideWrap = document.createElement('div');
  hideWrap.style.cssText = 'position:absolute;top:0;left:0;width:0;height:0;overflow:hidden;';
  var container = document.createElement('div');
  container.style.cssText = 'width:760px;padding:36px;background:#fff;font-family:\'Sarabun\',\'Segoe UI\',sans-serif;color:#1F2937;';
  container.innerHTML =
    '<div style="background:linear-gradient(135deg,#C084FC 0%,#9333EA 55%,#581C87 100%);border-radius:18px;padding:26px 30px;margin-bottom:26px;color:#fff">' +
    '<div style="font-size:11px;letter-spacing:2px;font-weight:700;opacity:.85;margin-bottom:8px">SHAREUP · สรุปรายจ่าย</div>' +
    '<div style="font-size:26px;font-weight:800;margin-bottom:4px">' + esc(CUR_EV.name) + '</div>' +
    '<div style="font-size:12px;opacity:.85">สร้างเมื่อ ' + esc(fmtDate(CUR_EV.createdAt)) + ' · ออกรายงาน ' + esc(generatedAt) + '</div>' +
    '</div>' +

    '<div style="display:flex;gap:12px;margin-bottom:28px">' +
    '<div style="flex:1;background:#FBF7FF;border:1px solid #E9D5FF;border-radius:14px;padding:14px 18px">' +
    '<div style="font-size:11px;color:#7E22CE;font-weight:700;margin-bottom:5px">ยอดรวมทั้งหมด</div>' +
    '<div style="font-size:19px;font-weight:800;color:#581C87">' + esc(fmtAmt(grandTotal)) + '</div>' +
    '</div>' +
    '<div style="flex:1;background:#FBF7FF;border:1px solid #E9D5FF;border-radius:14px;padding:14px 18px">' +
    '<div style="font-size:11px;color:#7E22CE;font-weight:700;margin-bottom:5px">รายการทั้งหมด</div>' +
    '<div style="font-size:19px;font-weight:800;color:#581C87">' + ord.length + ' รายการ</div>' +
    '</div>' +
    '<div style="flex:1;background:#FBF7FF;border:1px solid #E9D5FF;border-radius:14px;padding:14px 18px">' +
    '<div style="font-size:11px;color:#7E22CE;font-weight:700;margin-bottom:5px">สมาชิก</div>' +
    '<div style="font-size:19px;font-weight:800;color:#581C87">' + FRIENDS.length + ' คน</div>' +
    '</div>' +
    '</div>' +

    '<div style="font-size:15px;font-weight:800;color:#581C87;margin-bottom:12px">' +
    '<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#9333EA;margin-right:8px"></span>' +
    'สรุปยอด — ใครต้องจ่ายใครบ้าง</div>' +
    '<div style="margin-bottom:30px">' + settleHtml + '</div>' +

    '<div style="font-size:15px;font-weight:800;color:#581C87;margin-bottom:12px">' +
    '<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#9333EA;margin-right:8px"></span>' +
    'รายการค่าใช้จ่ายทั้งหมด</div>' +
    '<table style="width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed">' +
    '<colgroup><col style="width:11%"><col style="width:16%"><col style="width:11%"><col style="width:13%"><col style="width:34%"><col style="width:15%"></colgroup>' +
    '<thead><tr style="background:#F3E8FF">' +
    '<th style="padding:9px 10px;text-align:left;color:#581C87;font-size:10.5px;letter-spacing:.3px">วันที่บันทึก</th>' +
    '<th style="padding:9px 10px;text-align:left;color:#581C87;font-size:10.5px;letter-spacing:.3px">รายละเอียด</th>' +
    '<th style="padding:9px 10px;text-align:right;color:#581C87;font-size:10.5px;letter-spacing:.3px">ราคารวม</th>' +
    '<th style="padding:9px 10px;text-align:left;color:#581C87;font-size:10.5px;letter-spacing:.3px">ใครจ่าย</th>' +
    '<th style="padding:9px 10px;text-align:left;color:#581C87;font-size:10.5px;letter-spacing:.3px">จ่ายให้ใครไปบ้าง</th>' +
    '<th style="padding:9px 10px;text-align:right;color:#581C87;font-size:10.5px;letter-spacing:.3px">ตกคนละเท่าไหร่</th>' +
    '</tr></thead><tbody>' + txRowsHtml + '</tbody></table>' +

    '<div style="margin-top:26px;text-align:center;font-size:10px;color:#B9A6D1">สร้างจากแอป ShareUp</div>';
  hideWrap.appendChild(container);
  document.body.appendChild(hideWrap);

  var filename = (CUR_EV.name || 'expenses').replace(/[^\w฀-๿ -]/g, '') + '_expenses.pdf';
  try {
    // Rasterize with html2canvas and place as an image — jsPDF's own .html()
    // renderer falls back to its built-in Latin-only fonts for text nodes and
    // garbles Thai, so we bypass it entirely and never hand it real text.
    var canvas = await html2canvas(container, { scale: 2, backgroundColor: '#fff', windowWidth: 760 });
    document.body.removeChild(hideWrap);

    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF('p', 'pt', 'a4');
    var margin = 20;
    var pageW = doc.internal.pageSize.getWidth();
    var pageH = doc.internal.pageSize.getHeight();
    var usableW = pageW - margin * 2;
    var usableH = pageH - margin * 2;
    var imgH = canvas.height * usableW / canvas.width;
    var imgData = canvas.toDataURL('image/png');

    var heightLeft = imgH;
    var y = margin;
    doc.addImage(imgData, 'PNG', margin, y, usableW, imgH);
    heightLeft -= usableH;
    while (heightLeft > 0) {
      doc.addPage();
      y = margin - (imgH - heightLeft);
      doc.addImage(imgData, 'PNG', margin, y, usableW, imgH);
      heightLeft -= usableH;
    }

    doc.save(filename);
  } catch (e) {
    if (hideWrap.parentNode) document.body.removeChild(hideWrap);
    toast('Could not generate PDF', 'err');
  }
}

async function loadSummary(id) {
  $('#sumList').html(skeletonHtml(2, 'sum'));
  try {
    var r = await gsc('getSummary', TK, id);
    if (r.success) {
      var settlements = r.settlements || [];
      renderSummary(settlements);
      // Keep Home's filter tabs/list in sync without a full reload — mirrors
      // this app's existing optimistic-UI pattern for create/edit/delete.
      var settled = settlements.every(function (s) { return s.paid });
      var idx = EVENTS.findIndex(function (e) { return e.id === id });
      if (idx !== -1 && EVENTS[idx].settled !== settled) {
        EVENTS[idx].settled = settled;
        if (typeof refreshEventsUI === 'function') refreshEventsUI();
      }
    } else _handleDataError(r.error);
  } catch (e) { _handleDataError('' + e) }
}

function renderSummary(ss) {
  var $el = $('#sumList');
  if (!ss.length) {
    $el.html(
      '<div class="empty">' +
      '<div class="empty-icon" style="background:var(--g-dim);border-color:rgba(34,197,94,.2)">' +
      '<svg viewBox="0 0 24 24" style="fill:var(--g)"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>' +
      '</div>' +
      '<div class="empty-t" style="color:var(--g)">All Settled! 🎉</div>' +
      '<div class="empty-s">Everyone is even — no payments needed</div>' +
      '</div>'
    );
    return;
  }
  var html = $.map(ss, function (x) {
    return '<div class="settle-card' + (x.paid ? ' paid' : '') + '">' +
      '<div class="se-person">' +
      '<div class="se-av" style="background:' + avCol(x.fromName) + '">' + initials(x.fromName) + '</div>' +
      '<div class="se-name">' + esc(x.fromName) + '</div>' +
      '</div>' +
      '<div class="se-mid">' +
      '<div class="se-label">owes <span class="se-arrow">→</span></div>' +
      '<div class="se-amt">' + fmtAmt(x.amount) + '</div>' +
      '</div>' +
      '<div class="se-person">' +
      '<div class="se-av" style="background:' + avCol(x.toName) + '">' + initials(x.toName) + '</div>' +
      '<div class="se-name">' + esc(x.toName) + '</div>' +
      '</div>' +
      '<label class="se-check">' +
      '<input type="checkbox" class="se-paid-cb" data-from="' + esc(x.from) + '" data-to="' + esc(x.to) + '" data-amt="' + x.amount + '"' + (x.paid ? ' checked' : '') + '>' +
      '<span class="se-check-box"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>' +
      '</label>' +
      '</div>';
  }).join('');
  $el.html(html);
}

// ── Share Event ────────────────────────────────
async function openShareSheet() {
  if (!CUR_EV) return;
  $('#shareOff').show();
  $('#shareOn').hide();
  openSheet('shShare');
  try {
    var r = await gsc('getShareLink', TK, CUR_EV.id);
    if (r.success && r.shareToken) showShareLink(r.shareUrl);
  } catch (e) {}
}

function showShareLink(url) {
  $('#shareLinkInp').val(url);
  $('#shareOff').hide();
  $('#shareOn').show();
}

async function enableShare() {
  try {
    var r = await gsc('enableEventShare', TK, CUR_EV.id);
    if (r.success) showShareLink(r.shareUrl);
    else toast(r.error, 'err');
  } catch (e) { toast('' + e, 'err') }
}

async function disableShare() {
  try {
    var r = await gsc('disableEventShare', TK, CUR_EV.id);
    if (r.success) {
      toast('Sharing turned off');
      $('#shareOn').hide();
      $('#shareOff').show();
    } else toast(r.error, 'err');
  } catch (e) { toast('' + e, 'err') }
}

function copyShareLink() {
  var el = document.getElementById('shareLinkInp');
  var val = el.value;
  function done() { toast('Link copied') }
  function fail() {
    el.select(); el.setSelectionRange(0, 99999);
    try { document.execCommand('copy'); done() } catch (e) { toast('Copy failed — select and copy manually', 'warn') }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(val).then(done, fail);
  } else {
    fail();
  }
}

function renderEventFriends() {
  var $el = $('#detailFriendsList');
  if (!FRIENDS.length) {
    $el.html(
      '<div class="empty">' +
      '<div class="empty-t">No friends in this event yet</div>' +
      '<div class="empty-s">Tap + to add friends</div>' +
      '</div>'
    );
    return;
  }
  var html = $.map(FRIENDS, function (f, i) {
    return (i > 0 ? '<div class="fr-sep"></div>' : '') +
      '<div class="fr-row">' +
      '<div class="fr-av" style="background:' + avCol(f.name) + '">' + initials(f.name) + '</div>' +
      '<span class="fr-name">' + esc(f.name) + '</span>' +
      '<button class="btn-del ef-remove" data-id="' + esc(f.id) + '">' +
      '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>' +
      '</button>' +
      '</div>';
  }).join('');
  $el.html(html);
}

async function removeEventFriend(friendId) {
  var ids = FRIENDS.filter(function (f) { return f.id !== friendId }).map(function (f) { return f.id });
  try {
    var r = await gsc('setEventFriends', TK, CUR_EV.id, ids);
    if (r.success) {
      FRIENDS = r.friends;
      renderEventFriends();
      if (r.blocked && r.blocked.length) {
        toast(r.blocked.map(function (b) { return b.name }).join(', ') + ' has transactions here and can\'t be removed', 'warn');
      }
    } else toast(r.error, 'err');
  } catch (e) { toast('' + e, 'err') }
}

$(function () {
  $('#tabTx').on('click', function () { switchTab('tx') });
  $('#tabSum').on('click', function () { switchTab('sum') });
  $('#tabFr').on('click', function () { switchTab('friends') });
  $('#txList').on('click', '.tx-del', function (e) {
    e.stopPropagation();
    askDel('tx', $(this).data('tid'), $(this).data('desc'));
  });
  $('#txList').on('click', '.tx-edit', function (e) {
    e.stopPropagation();
    openEditTxSheet($(this).data('tid'));
  });
  $('#detailFriendsList').on('click', '.ef-remove', function (e) {
    e.stopPropagation();
    removeEventFriend($(this).data('id'));
  });
  $('#sumList').on('change', '.se-paid-cb', async function () {
    if (!CUR_EV) return;
    var from = $(this).data('from'), to = $(this).data('to'), amt = $(this).data('amt');
    var paid = $(this).is(':checked');
    try {
      var r = await gsc('markSettlementPaid', TK, CUR_EV.id, from, to, amt, paid);
      if (!r.success) toast(r.error, 'err');
    } catch (e) { toast('' + e, 'err') }
    loadSummary(CUR_EV.id);
  });
  $('#btnEditEvent').on('click', function () {
    if (CUR_EV) openRenameEventSheet(CUR_EV);
  });
  $('#btnShareEvent').on('click', openShareSheet);
  $('#btnEnableShare').on('click', enableShare);
  $('#btnCopyShare').on('click', copyShareLink);
  $('#btnDisableShare').on('click', disableShare);
  $('#btnExportTx').on('click', exportExpensesPdf);
});
</script>
