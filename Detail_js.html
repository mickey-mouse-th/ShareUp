<script>
async function loadDetailData(id) {
  $('#txList').html(skeletonHtml(3, 'tx'));
  try {
    var r = await gsc('getDetailData', TK, id);
    if (r.success) {
      DETAILS = r.details || [];
      FRIENDS = r.friends || [];
      renderDetails();
    } else _handleDataError(r.error);
  } catch (e) { _handleDataError('' + e) }
}

function renderDetails() {
  var $el = $('#txList');
  if (!DETAILS.length) {
    $el.html(
      '<div class="empty">' +
      '<div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M18 17H6v-2h12v2zm0-4H6v-2h12v2zm0-4H6V7h12v2zM3 22l1.5-1.5L6 22l1.5-1.5L9 22l1.5-1.5L12 22l1.5-1.5L15 22l1.5-1.5L18 22l1.5-1.5L21 22V2l-1.5 1.5L18 2l-1.5 1.5L15 2l-1.5 1.5L12 2l-1.5 1.5L9 2 7.5 3.5 6 2 4.5 3.5 3 2v20z"/></svg></div>' +
      '<div class="empty-t">No transactions yet</div>' +
      '<div class="empty-s">Tap + to record the first expense</div>' +
      '</div>'
    );
    return;
  }
  var fm = {};
  $.each(FRIENDS, function (_, f) { fm[f.id] = f.name });
  var grp = {}, ord = [];
  $.each(DETAILS, function (_, d) {
    if (!grp[d.transactionId]) { grp[d.transactionId] = []; ord.push(d.transactionId) }
    grp[d.transactionId].push(d);
  });
  ord.reverse();
  var html = $.map(ord, function (tid) {
    var rows = grp[tid], f = rows[0];
    var pn    = fm[f.payId] || f.payId;
    var total = parseFloat(f.totalAmount);
    var desc  = f.description || 'Transaction';
    var isCustom = $.grep(rows, function (r) {
      return Math.abs(parseFloat(r.amount) - parseFloat(rows[0].amount)) > 0.01;
    }).length > 0;
    var chips = $.map(rows, function (r) {
      var name = fm[r.friendId] || r.friendId;
      return '<span class="tx-chip">' + esc(name) + (isCustom ? ' ' + fmtAmt(r.amount) : '') + '</span>';
    }).join('');
    return '<div class="tx-card">' +
      '<div class="tx-head">' +
      '<div class="tx-av" style="background:' + avCol(pn) + '">' + initials(pn) + '</div>' +
      '<div class="tx-meta">' +
      '<div class="tx-desc">' + esc(desc) + '</div>' +
      '<div class="tx-by">Paid by ' + esc(pn) + (isCustom ? ' · ระบุเอง' : '') + '</div>' +
      '</div>' +
      '<div class="tx-amt">' + fmtAmt(total) + '</div>' +
      '</div>' +
      '<div class="tx-people">' + chips + '</div>' +
      '<div class="tx-foot">' +
      '<span class="tx-date">' + fmtDate(f.createdAt) + '</span>' +
      '<div class="tx-actions">' +
      '<button class="btn-edit tx-edit" data-tid="' + esc(tid) + '">' +
      '<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.9959.9959 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>' +
      '</button>' +
      '<button class="btn-del tx-del" data-tid="' + esc(tid) + '" data-desc="' + esc(desc) + '">' +
      '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>' +
      '</button>' +
      '</div>' +
      '</div>' +
      '</div>';
  }).join('');
  $el.html(html);
}

// Lazy-loaded on first export so a normal page load never pays for these.
var _pdfLibsPromise = null;
function _loadPdfLibs() {
  if (_pdfLibsPromise) return _pdfLibsPromise;
  _pdfLibsPromise = new Promise(function (resolve, reject) {
    var s1 = document.createElement('script');
    s1.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s1.onload = function () {
      var s2 = document.createElement('script');
      s2.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
      s2.onload = resolve;
      s2.onerror = reject;
      document.head.appendChild(s2);
    };
    s1.onerror = reject;
    document.head.appendChild(s1);
  });
  return _pdfLibsPromise;
}

async function exportExpensesPdf() {
  if (!CUR_EV) return;
  if (!DETAILS.length) { toast('No expenses to export yet', 'warn'); return }

  toast('Preparing PDF…');
  try {
    await _loadPdfLibs();
  } catch (e) {
    toast('Could not load the PDF library — check your connection', 'err');
    return;
  }

  var fm = {};
  $.each(FRIENDS, function (_, f) { fm[f.id] = f.name });
  var grp = {}, ord = [];
  $.each(DETAILS, function (_, d) {
    if (!grp[d.transactionId]) { grp[d.transactionId] = []; ord.push(d.transactionId) }
    grp[d.transactionId].push(d);
  });
  ord.reverse();

  var txRowsHtml = ord.map(function (tid) {
    var group = grp[tid], f = group[0];
    var payerName = fm[f.payId] || f.payId;
    var total = parseFloat(f.totalAmount);
    var perPerson = total / group.length;
    return '<tr>' +
      '<td style="padding:8px;border:1px solid #ddd">' + esc(fmtDate(f.createdAt)) + '</td>' +
      '<td style="padding:8px;border:1px solid #ddd">' + esc(f.description || 'Transaction') + '</td>' +
      '<td style="padding:8px;border:1px solid #ddd;text-align:right">' + esc(fmtAmt(total)) + '</td>' +
      '<td style="padding:8px;border:1px solid #ddd">' + esc(payerName) + '</td>' +
      '<td style="padding:8px;border:1px solid #ddd;text-align:right">' + esc(fmtAmt(perPerson)) + '</td>' +
      '</tr>';
  }).join('');

  var settlements = null;
  try {
    var r = await gsc('getSummary', TK, CUR_EV.id);
    if (r.success) settlements = r.settlements || [];
  } catch (e) {}

  var settleHtml;
  if (settlements === null) {
    settleHtml = '<tr><td colspan="4" style="padding:10px;text-align:center;color:#999">Unable to load summary</td></tr>';
  } else if (!settlements.length) {
    settleHtml = '<tr><td colspan="4" style="padding:10px;text-align:center;color:#16a34a">All settled — no payments needed</td></tr>';
  } else {
    settleHtml = settlements.map(function (s) {
      return '<tr>' +
        '<td style="padding:8px;border:1px solid #ddd">' + esc(s.fromName) + '</td>' +
        '<td style="padding:8px;border:1px solid #ddd;text-align:center">→</td>' +
        '<td style="padding:8px;border:1px solid #ddd">' + esc(s.toName) + '</td>' +
        '<td style="padding:8px;border:1px solid #ddd;text-align:right">' + esc(fmtAmt(s.amount)) + '</td>' +
        '</tr>';
    }).join('');
  }

  var hideWrap = document.createElement('div');
  hideWrap.style.cssText = 'position:absolute;top:0;left:0;width:0;height:0;overflow:hidden;';
  var container = document.createElement('div');
  container.style.cssText = 'width:760px;padding:32px;background:#fff;font-family:\'Segoe UI\',sans-serif;color:#111;';
  container.innerHTML =
    '<h1 style="font-size:22px;margin:0 0 4px">' + esc(CUR_EV.name) + '</h1>' +
    '<div style="font-size:13px;color:#666;margin-bottom:24px">' + esc(fmtDate(CUR_EV.createdAt)) + '</div>' +
    '<h2 style="font-size:16px;margin:0 0 10px">รายการค่าใช้จ่าย</h2>' +
    '<table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:28px">' +
    '<thead><tr style="background:#f3f0fa">' +
    '<th style="padding:8px;border:1px solid #ddd;text-align:left">วันที่บันทึก</th>' +
    '<th style="padding:8px;border:1px solid #ddd;text-align:left">รายละเอียด</th>' +
    '<th style="padding:8px;border:1px solid #ddd;text-align:right">ราคารวม</th>' +
    '<th style="padding:8px;border:1px solid #ddd;text-align:left">ใครจ่าย</th>' +
    '<th style="padding:8px;border:1px solid #ddd;text-align:right">ตกคนละเท่าไหร่</th>' +
    '</tr></thead><tbody>' + txRowsHtml + '</tbody></table>' +
    '<h2 style="font-size:16px;margin:0 0 10px">สรุปรวม — ใครต้องจ่ายใครบ้าง</h2>' +
    '<table style="width:100%;border-collapse:collapse;font-size:12px">' +
    '<thead><tr style="background:#f3f0fa">' +
    '<th style="padding:8px;border:1px solid #ddd;text-align:left">ผู้จ่าย</th>' +
    '<th style="padding:8px;border:1px solid #ddd"></th>' +
    '<th style="padding:8px;border:1px solid #ddd;text-align:left">ผู้รับเงิน</th>' +
    '<th style="padding:8px;border:1px solid #ddd;text-align:right">จำนวนเงิน</th>' +
    '</tr></thead><tbody>' + settleHtml + '</tbody></table>';
  hideWrap.appendChild(container);
  document.body.appendChild(hideWrap);

  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF('p', 'pt', 'a4');
  var filename = (CUR_EV.name || 'expenses').replace(/[^\w฀-๿ -]/g, '') + '_expenses.pdf';
  doc.html(container, {
    x: 20, y: 20,
    width: 555,
    windowWidth: 760,
    callback: function (doc) {
      document.body.removeChild(hideWrap);
      doc.save(filename);
    }
  });
}

async function loadSummary(id) {
  $('#sumList').html(skeletonHtml(2, 'sum'));
  try {
    var r = await gsc('getSummary', TK, id);
    if (r.success) renderSummary(r.settlements || []);
    else _handleDataError(r.error);
  } catch (e) { _handleDataError('' + e) }
}

function renderSummary(ss) {
  var $el = $('#sumList');
  if (!ss.length) {
    $el.html(
      '<div class="empty">' +
      '<div class="empty-icon" style="background:var(--g-dim);border-color:rgba(34,197,94,.2)">' +
      '<svg viewBox="0 0 24 24" style="fill:var(--g)"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>' +
      '</div>' +
      '<div class="empty-t" style="color:var(--g)">All Settled! 🎉</div>' +
      '<div class="empty-s">Everyone is even — no payments needed</div>' +
      '</div>'
    );
    return;
  }
  var html = $.map(ss, function (x) {
    return '<div class="settle-card">' +
      '<div class="se-person">' +
      '<div class="se-av" style="background:' + avCol(x.fromName) + '">' + initials(x.fromName) + '</div>' +
      '<div class="se-name">' + esc(x.fromName) + '</div>' +
      '</div>' +
      '<div class="se-mid">' +
      '<div class="se-label">owes <span class="se-arrow">→</span></div>' +
      '<div class="se-amt">' + fmtAmt(x.amount) + '</div>' +
      '</div>' +
      '<div class="se-person">' +
      '<div class="se-av" style="background:' + avCol(x.toName) + '">' + initials(x.toName) + '</div>' +
      '<div class="se-name">' + esc(x.toName) + '</div>' +
      '</div>' +
      '</div>';
  }).join('');
  $el.html(html);
}

// ── Share Event ────────────────────────────────
async function openShareSheet() {
  if (!CUR_EV) return;
  $('#shareOff').show();
  $('#shareOn').hide();
  openSheet('shShare');
  try {
    var r = await gsc('getShareLink', TK, CUR_EV.id);
    if (r.success && r.shareToken) showShareLink(r.shareUrl);
  } catch (e) {}
}

function showShareLink(url) {
  $('#shareLinkInp').val(url);
  $('#shareOff').hide();
  $('#shareOn').show();
}

async function enableShare() {
  try {
    var r = await gsc('enableEventShare', TK, CUR_EV.id);
    if (r.success) showShareLink(r.shareUrl);
    else toast(r.error, 'err');
  } catch (e) { toast('' + e, 'err') }
}

async function disableShare() {
  try {
    var r = await gsc('disableEventShare', TK, CUR_EV.id);
    if (r.success) {
      toast('Sharing turned off');
      $('#shareOn').hide();
      $('#shareOff').show();
    } else toast(r.error, 'err');
  } catch (e) { toast('' + e, 'err') }
}

function copyShareLink() {
  var el = document.getElementById('shareLinkInp');
  var val = el.value;
  function done() { toast('Link copied') }
  function fail() {
    el.select(); el.setSelectionRange(0, 99999);
    try { document.execCommand('copy'); done() } catch (e) { toast('Copy failed — select and copy manually', 'warn') }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(val).then(done, fail);
  } else {
    fail();
  }
}

function renderEventFriends() {
  var $el = $('#detailFriendsList');
  if (!FRIENDS.length) {
    $el.html(
      '<div class="empty">' +
      '<div class="empty-t">No friends in this event yet</div>' +
      '<div class="empty-s">Tap + to add friends</div>' +
      '</div>'
    );
    return;
  }
  var html = $.map(FRIENDS, function (f, i) {
    return (i > 0 ? '<div class="fr-sep"></div>' : '') +
      '<div class="fr-row">' +
      '<div class="fr-av" style="background:' + avCol(f.name) + '">' + initials(f.name) + '</div>' +
      '<span class="fr-name">' + esc(f.name) + '</span>' +
      '<button class="btn-del ef-remove" data-id="' + esc(f.id) + '">' +
      '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>' +
      '</button>' +
      '</div>';
  }).join('');
  $el.html(html);
}

async function removeEventFriend(friendId) {
  var ids = FRIENDS.filter(function (f) { return f.id !== friendId }).map(function (f) { return f.id });
  try {
    var r = await gsc('setEventFriends', TK, CUR_EV.id, ids);
    if (r.success) {
      FRIENDS = r.friends;
      renderEventFriends();
      if (r.blocked && r.blocked.length) {
        toast(r.blocked.map(function (b) { return b.name }).join(', ') + ' has transactions here and can\'t be removed', 'warn');
      }
    } else toast(r.error, 'err');
  } catch (e) { toast('' + e, 'err') }
}

$(function () {
  $('#tabTx').on('click', function () { switchTab('tx') });
  $('#tabSum').on('click', function () { switchTab('sum') });
  $('#tabFr').on('click', function () { switchTab('friends') });
  $('#txList').on('click', '.tx-del', function (e) {
    e.stopPropagation();
    askDel('tx', $(this).data('tid'), $(this).data('desc'));
  });
  $('#txList').on('click', '.tx-edit', function (e) {
    e.stopPropagation();
    openEditTxSheet($(this).data('tid'));
  });
  $('#detailFriendsList').on('click', '.ef-remove', function (e) {
    e.stopPropagation();
    removeEventFriend($(this).data('id'));
  });
  $('#btnEditEvent').on('click', function () {
    if (CUR_EV) openRenameEventSheet(CUR_EV);
  });
  $('#btnShareEvent').on('click', openShareSheet);
  $('#btnEnableShare').on('click', enableShare);
  $('#btnCopyShare').on('click', copyShareLink);
  $('#btnDisableShare').on('click', disableShare);
  $('#btnExportTx').on('click', exportExpensesPdf);
});
</script>
