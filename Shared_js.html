<script>
// ── Global State ──────────────────────────────
var TK      = localStorage.getItem('su_tk')  || null;
var ME      = JSON.parse(localStorage.getItem('su_me') || 'null');
var CUR_TAB = 'home';
var CUR_EV  = null;
var FRIENDS = [];
var EVENTS  = [];
var DETAILS = [];
var SETTLEMENTS = null; // null = not loaded yet for the open event; [] is a valid "all settled" result
var ME_PHOTO = ''; // currently-displayed header avatar photo (base64), '' = showing initials
var SELF_FRIEND_ID = null; // the open event's friend row that maps back to this account (see getDetailData)
var SLIPS = {}; // transactionId -> receipt/slip data URI, for the currently open event

// ── Share-link viewer state ───────────────────
// SHARE_TOKEN/SHARE_PERMISSION are emitted by doGet into Index.html before
// this script loads - '' when this is a normal logged-in visit.
var IS_SHARE = !!SHARE_TOKEN;
var PERM = { canAdd: true, canEdit: true, canDelete: true, canDownload: true, canSummary: true, canShare: true };
// Re-derived from the LIVE getSharedEventView response every load (not just
// the page-load-time SHARE_PERMISSION) so a link whose permission changes
// while a tab is open is picked up on next refresh - single source of truth.
function _applyPermFromShare(permission) {
  var canEdit = permission === 'edit';
  PERM = { canAdd: canEdit, canEdit: canEdit, canDelete: false, canDownload: true, canSummary: true, canShare: false };
}

// ── Color / Emoji Constants ───────────────────
var BANNER_GRADS = [
  'linear-gradient(135deg,#3730A3,#A5B4FC)',
  'linear-gradient(135deg,#065F46,#5EEAD4)',
  'linear-gradient(135deg,#92400E,#FCD34D)',
  'linear-gradient(135deg,#6D28D9,#C4B5FD)',
  'linear-gradient(135deg,#075985,#7DD3FC)',
  'linear-gradient(135deg,#9D174D,#FDA4AF)',
  'linear-gradient(135deg,#14532D,#6EE7B7)',
  'linear-gradient(135deg,#7C2D12,#FDBA74)'
];
var AV_COLORS = [
  'linear-gradient(135deg,#6D28D9,#C4B5FD)',
  'linear-gradient(135deg,#1D4ED8,#93C5FD)',
  'linear-gradient(135deg,#047857,#6EE7B7)',
  'linear-gradient(135deg,#B45309,#FCD34D)',
  'linear-gradient(135deg,#B91C1C,#FCA5A5)',
  'linear-gradient(135deg,#BE185D,#F9A8D4)',
  'linear-gradient(135deg,#5B21B6,#DDD6FE)',
  'linear-gradient(135deg,#0E7490,#67E8F9)'
];
var EV_BG = [
  'rgba(147,51,234,.18)','rgba(59,130,246,.18)','rgba(16,185,129,.18)',
  'rgba(245,158,11,.18)','rgba(239,68,68,.18)','rgba(236,72,153,.18)',
  'rgba(139,92,246,.18)','rgba(6,182,212,.18)','rgba(249,115,22,.18)'
];
var EMOJIS = ['🎉','🍕','✈️','🎬','🏖️','🎂','🍜','⚽','🎮','🛒','🏕️','🎵','🎸','🚂','🏔️'];

function _hash(s, mod) {
  var h = 0;
  for (var i = 0; i < (s || '').length; i++) h = (h * 31 + s.charCodeAt(i)) & 0xFFFF;
  return h % mod;
}
function avCol(s)      { return AV_COLORS[_hash(s, AV_COLORS.length)] }
function evEmoji(s)    { return EMOJIS[_hash(s, EMOJIS.length)] }
function evBg(s)       { return EV_BG[_hash(s, EV_BG.length)] }
function bannerGrad(s) { return BANNER_GRADS[_hash(s, BANNER_GRADS.length)] }
function initials(s)   { return (s || '?')[0].toUpperCase() }

// Renders this account's own profile photo (set via My Profile) in place of
// the initials circle for whichever avatar is "you" — friendId is matched
// against SELF_FRIEND_ID (set per open event by loadDetailData).
function avatarHtml(cls, name, friendId) {
  if (friendId && SELF_FRIEND_ID && friendId === SELF_FRIEND_ID && ME_PHOTO) {
    return '<div class="' + cls + '" style="background:url(' + ME_PHOTO + ') center/cover no-repeat"></div>';
  }
  return '<div class="' + cls + '" style="background:' + avCol(name) + '">' + initials(name) + '</div>';
}

// Same idea for places that already have a specific account's own photo in
// hand (e.g. the Admin account list), rather than needing SELF_FRIEND_ID.
function avatarHtmlDirect(cls, name, photo) {
  if (photo) return '<div class="' + cls + '" style="background:url(' + photo + ') center/cover no-repeat"></div>';
  return '<div class="' + cls + '" style="background:' + avCol(name) + '">' + initials(name) + '</div>';
}

// ── Utilities ─────────────────────────────────
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
// Escapes text like esc(), but wraps every case-insensitive match of `q` in
// a <mark class="search-hl"> - used to highlight search matches in list UIs.
function highlightText(text, q) {
  var safe = esc(text);
  q = (q || '').trim();
  if (!q) return safe;
  var safeQ = esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return safe.replace(new RegExp('(' + safeQ + ')', 'ig'), '<mark class="search-hl">$1</mark>');
}
function fmtAmt(n) {
  return '฿' + parseFloat(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtDate(iso) {
  if (!iso) return '';
  try { return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) }
  catch (e) { return iso }
}

// Renders the admin-configured password policy as a human-readable hint,
// shared by the register form and the change-password form.
function pwPolicyText(p) {
  var parts = ['At least ' + p.pwMinLength + ' characters'];
  if (p.pwRequireUpper) parts.push('an uppercase letter');
  if (p.pwRequireLower) parts.push('a lowercase letter');
  if (p.pwRequireNumber) parts.push('a number');
  if (p.pwRequireSpecial) parts.push('a special character');
  return parts.join(', ');
}

// ── Live password requirement checklist (Register + Profile) ──
var _PW_RULES = [
  { rule: 'len',     label: function (p) { return 'At least ' + p.pwMinLength + ' characters' }, on: function () { return true }, test: function (v, p) { return v.length >= p.pwMinLength } },
  { rule: 'upper',   label: function () { return 'An uppercase letter (A-Z)' }, on: function (p) { return p.pwRequireUpper }, test: function (v) { return /[A-Z]/.test(v) } },
  { rule: 'lower',   label: function () { return 'A lowercase letter (a-z)' }, on: function (p) { return p.pwRequireLower }, test: function (v) { return /[a-z]/.test(v) } },
  { rule: 'number',  label: function () { return 'A number (0-9)' }, on: function (p) { return p.pwRequireNumber }, test: function (v) { return /[0-9]/.test(v) } },
  { rule: 'special', label: function () { return 'A special character' }, on: function (p) { return p.pwRequireSpecial }, test: function (v) { return /[^A-Za-z0-9]/.test(v) } }
];

function renderPwChecklist(containerId, policy) {
  var html = _PW_RULES.filter(function (r) { return r.on(policy) }).map(function (r) {
    return '<div class="pw-rule" data-rule="' + r.rule + '">' +
      '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>' +
      '<span>' + esc(r.label(policy)) + '</span></div>';
  }).join('');
  $('#' + containerId).html(html);
}

function updatePwChecklist(containerId, policy, value) {
  _PW_RULES.forEach(function (r) {
    if (!r.on(policy)) return;
    $('#' + containerId + ' [data-rule="' + r.rule + '"]').toggleClass('met', r.test(value || '', policy));
  });
}

// ── Skeleton ─────────────────────────────────
function skeletonHtml(count, type) {
  var card;
  if (type === 'ev') {
    card = '<div class="sk-card"><div class="sk-row">' +
      '<div class="sk-ic sk-pulse"></div>' +
      '<div class="sk-lines"><div class="sk-line sk-w60 sk-pulse"></div><div class="sk-line sk-w35 sk-pulse"></div></div>' +
      '<div class="sk-amt sk-pulse"></div></div></div>';
  } else if (type === 'fr') {
    card = '<div class="sk-card"><div class="sk-row">' +
      '<div class="sk-av sk-pulse"></div>' +
      '<div class="sk-lines"><div class="sk-line sk-w55 sk-pulse"></div><div class="sk-line sk-w35 sk-pulse"></div></div>' +
      '</div></div>';
  } else if (type === 'tx') {
    card = '<div class="sk-card">' +
      '<div class="sk-row" style="margin-bottom:10px">' +
      '<div class="sk-av sk-pulse"></div>' +
      '<div class="sk-lines"><div class="sk-line sk-w65 sk-pulse"></div><div class="sk-line sk-w40 sk-pulse"></div></div>' +
      '<div class="sk-amt sk-pulse"></div></div>' +
      '<div class="sk-chips"><div class="sk-chip sk-pulse"></div><div class="sk-chip sk-pulse"></div><div class="sk-chip sk-pulse"></div></div>' +
      '</div>';
  } else {
    card = '<div class="sk-card"><div class="sk-row">' +
      '<div class="sk-av sk-pulse"></div>' +
      '<div class="sk-lines"><div class="sk-line sk-w60 sk-pulse"></div><div class="sk-line sk-w35 sk-pulse"></div></div>' +
      '</div></div>';
  }
  var h = '<div class="sk-wrap">';
  for (var i = 0; i < count; i++) h += card;
  return h + '</div>';
}

// ── Slip photo resolution ─────────────────────
// New slips are stored as a Drive fileId (see Code.js _uploadSlipToDrive) -
// every direct Drive embed URL turned out to be unreliable when hotlinked
// from inside this app's sandboxed iframe, so the bytes are fetched through
// the same google.script.run bridge as everything else and turned into a
// data: URI here. Old slips are still a raw data: URI already (pre-Drive) -
// those pass through untouched. Cached by fileId so re-rendering the same
// transaction doesn't refetch it.
var _slipSrcCache = {};
async function _resolveSlipSrc(val) {
  if (!val) return '';
  if (val.indexOf('data:') === 0) return val;
  if (_slipSrcCache[val]) return _slipSrcCache[val];
  try {
    var r = IS_SHARE ? await gsc('getSlipImageViaShare', SHARE_TOKEN, val) : await gsc('getSlipImage', TK, val);
    if (r.success) {
      var uri = 'data:' + r.mimeType + ';base64,' + r.base64;
      _slipSrcCache[val] = uri;
      return uri;
    }
  } catch (e) {}
  return '';
}

// ── GAS Bridge ───────────────────────────────
function gsc(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (res, rej) {
    var r = google.script.run.withSuccessHandler(res).withFailureHandler(rej);
    r[fn].apply(r, args);
  });
}

// ── Toast ────────────────────────────────────
function toast(msg, type) {
  type = type || 'ok';
  var $el = $('<div>').addClass('toast ' + type)
    .append($('<div>').addClass('toast-dot'))
    .append($('<span>').text(msg));
  $('#toastWrap').append($el);
  setTimeout(function () { $el.remove() }, 3200);
}

// ── Sheet management ─────────────────────────
var _activeSheet = null;
function openSheet(id) {
  closeSheets();
  _activeSheet = id;
  $('#overlay').addClass('on');
  requestAnimationFrame(function () { $('#' + id).addClass('on') });
  setTimeout(function () { $('#' + id + ' input:not([type=checkbox])').first().trigger('focus') }, 360);
}
function closeSheets() {
  $('#overlay').removeClass('on');
  $('.sheet.on').removeClass('on');
  _activeSheet = null;
}

// ── Navigation ───────────────────────────────
function goTab(tab) {
  CUR_TAB = tab; CUR_EV = null;
  var titles = { home: 'ShareUp', admin: 'Admin' };
  $('#hdrTitle').text(titles[tab] || 'ShareUp');
  $('#appHdr').removeClass('show-back');
  var pgMap = { home: 'pgHome', admin: 'pgAdmin' };
  $.each(pgMap, function (t, pgId) {
    $('#' + pgId).toggleClass('hidden', t !== tab).removeClass('behind');
  });
  $('#pgDetail').addClass('hidden').removeClass('behind');
  $('#fab').toggleClass('hide', tab === 'admin');
  $('.bnav-btn').removeClass('on');
  var navMap = { home: 'navEv', admin: 'navAd' };
  if (navMap[tab]) $('#' + navMap[tab]).addClass('on');
  if (tab === 'home')    { loadHomeData() }
  else if (tab === 'admin')   { switchAdminTab('menu'); loadAccounts() }
  _saveView();
}

function openDetail(ev) {
  CUR_EV = ev; SETTLEMENTS = null;
  $('#hdrTitle').text(ev.name);
  $('#appHdr').addClass('show-back');
  $('#detailBanner').css('background', bannerGrad(ev.name));
  $('#detailEmoji').text(ev.icon || evEmoji(ev.name));
  $('#detailBannerName').text(ev.name);
  $('#detailBannerDate').text(fmtDate(ev.createdAt));
  var pgMap = { home: 'pgHome', admin: 'pgAdmin' };
  var prev = pgMap[CUR_TAB];
  $.each(pgMap, function (_, pgId) { $('#' + pgId).addClass('hidden') });
  if (prev) { $('#' + prev).removeClass('hidden').addClass('behind') }
  $('#pgDetail').removeClass('hidden behind');
  $('#fab').removeClass('hide');
  loadDetailData(ev.id);
  _saveView();
}

function goBack() {
  CUR_EV = null;
  $('#pgDetail').addClass('hidden');
  $('#appHdr').removeClass('show-back');
  var titles = { home: 'ShareUp', admin: 'Admin' };
  $('#hdrTitle').text(titles[CUR_TAB] || 'ShareUp');
  var pgMap = { home: 'pgHome', admin: 'pgAdmin' };
  $.each(pgMap, function (t, pgId) {
    $('#' + pgId).removeClass('behind').toggleClass('hidden', t !== CUR_TAB);
  });
  $('#fab').toggleClass('hide', CUR_TAB === 'admin');
  _saveView();
}

// Opens the Summary sheet - SETTLEMENTS is already bundled into the initial
// detail load, so this only hits the server again if it was invalidated
// (e.g. a transaction changed since).
function openSummarySheet() {
  if (!CUR_EV) return;
  openSheet('shSummary');
  if (SETTLEMENTS) renderSummary(SETTLEMENTS);
  else loadSummary(CUR_EV.id);
}

// ── Reload/reopen persistence ─────────────────
// Remembers which page (and, for an event, which sub-tab) the user was on so
// a browser refresh — or just reopening the app later — lands back in the
// same place. Apps Script serves this app inside a cross-origin sandboxed
// iframe, so the visible address bar can't be updated per-navigation without
// a full page reload on every click; localStorage gets the same end result
// (refresh restores the same view) without that cost.
function _saveView() {
  var view = CUR_EV ? { tab: 'event', eventId: CUR_EV.id } : { tab: CUR_TAB };
  localStorage.setItem('su_view', JSON.stringify(view));
}

function _restoreView() {
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem('su_view') || 'null') } catch (e) {}

  if (saved && saved.tab === 'admin' && ME.role === 'admin') {
    goTab('admin');
    return;
  }
  if (saved && saved.tab === 'event' && saved.eventId) {
    loadHomeData().then(function () {
      var ev = EVENTS.filter(function (e) { return e.id === saved.eventId })[0];
      if (ev) openDetail(ev);
      // Event no longer exists (deleted elsewhere) — stay on the already-rendered Home.
    });
    return;
  }
  goTab('home');
}

function _renderHdrAvatar(name, photo) {
  ME_PHOTO = photo || '';
  var $el = $('#hdrAv');
  if (ME_PHOTO) $el.css('background', 'url(' + ME_PHOTO + ') center/cover no-repeat').text('');
  else $el.css('background', avCol(name)).text(initials(name));
}

// ── App boot ─────────────────────────────────
function startApp() {
  $('#authView').hide();
  $('#appView').css('display', 'flex');
  var name = (ME.displayName || ME.username || '');
  $('#heroName').text(name);
  _renderHdrAvatar(name, null);
  if (ME.role === 'admin') $('#navAd').show(); else $('#navAd').hide();
  _restoreView();
  gsc('getMyProfile', TK).then(function (r) {
    if (r.success) _renderHdrAvatar(ME.displayName || ME.username, r.photo);
  }).catch(function () {});
}

function doLogout() {
  closeSheets();
  gsc('logoutUser', TK).catch(function () {});
  TK = null; ME = null;
  localStorage.removeItem('su_tk');
  localStorage.removeItem('su_me');
  localStorage.removeItem('su_view');
  $('#appView').hide();
  $('#authView').css('display', 'flex');
  authPg('login');
}

// Anonymous share-link visit: jumps straight into the Detail page for the
// linked event, skipping #authView and the Home/Admin pages entirely (a
// share link is scoped to one event, there's nowhere else for it to go).
function startShareApp() {
  $('#appView').css('display', 'flex');
  $('.bnav').hide();
  $('#btnBack').hide();
  $('#hdrAv').hide();
  $('#navAd').hide();
  var pgMap = { home: 'pgHome', admin: 'pgAdmin' };
  $.each(pgMap, function (_, pgId) { $('#' + pgId).addClass('hidden') });
  $('#pgDetail').removeClass('hidden behind');
  loadDetailData(null);
}

function hideSplash() {
  $('#splash').addClass('out');
  setTimeout(function () { $('#splash').hide() }, 500);
}

// ── Document Ready ────────────────────────────
$(function () {
  // Navigation
  $('#btnBack').on('click', goBack);
  $('#navEv').on('click',  function () { goTab('home') });
  $('#navAd').on('click',  function () { goTab('admin') });
  $('#fab').on('click',    handleFab);
  $('#hdrAv').on('click',  function () { openSheet('shAccount') });
  $('#overlay').on('click', closeSheets);

  // Boot — optimistic: show app immediately with cached data,
  // validate session in background to avoid login on every cold start
  if (IS_SHARE) {
    hideSplash();
    startShareApp();
  } else if (TK && ME) {
    hideSplash();
    startApp();
    gsc('getSessionUser', TK)
      .then(function (r) {
        if (r.success) {
          ME = r.user;
          localStorage.setItem('su_me', JSON.stringify(ME));
        }
        // Don't force logout here — expired sessions are caught by data-load calls
      })
      .catch(function () {
        // Network / GAS cold-start error — stay logged in with cached data
      });
  } else {
    hideSplash();
    _showAuth();
  }
});

function _handleDataError(msg) {
  var s = String(msg || '');
  if (s.indexOf('Unauthorized') >= 0 || s.indexOf('Session expired') >= 0) {
    doLogout();
    return;
  }
  toast(s, 'err');
}

function _bootFail() {
  TK = null; ME = null;
  localStorage.removeItem('su_tk');
  localStorage.removeItem('su_me');
  hideSplash();
  _showAuth();
}
function _showAuth() {
  $('#authView').css('display', 'flex');
}
</script>
