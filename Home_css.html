<style>
.hero{
  border-radius:26px;overflow:hidden;margin-bottom:16px;
  background:var(--p-grad);
  border:1px solid var(--p-lt);padding:28px 24px 26px;position:relative;
}
.hero-deco{position:absolute;pointer-events:none}
.hero-deco1{top:-40px;right:-30px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16) 0%,transparent 65%)}
.hero-deco2{bottom:-30px;left:-20px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.10) 0%,transparent 65%)}
.hero-hi{font-size:15px;color:rgba(255,255,255,.75);font-weight:500;position:relative}
.hero-name{font-size:36px;font-weight:800;letter-spacing:-.8px;color:#fff;margin-top:6px;position:relative}
.hero-sub{font-size:15px;color:rgba(255,255,255,.65);margin-top:8px;position:relative}

.stat-row{display:flex;gap:12px;margin-bottom:8px}
.stat-card{
  flex:1;background:var(--s1);border:1px solid var(--bd);border-radius:22px;
  padding:20px 18px;display:flex;align-items:center;gap:14px;
}
.stat-ic{
  width:50px;height:50px;border-radius:16px;background:var(--p-dim);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.stat-ic svg{width:26px;height:26px;fill:var(--p-lt)}
.stat-num{font-size:32px;font-weight:800;color:var(--t1);letter-spacing:-.6px;line-height:1}
.stat-lbl{font-size:14px;color:var(--t2);margin-top:4px;font-weight:500}

/* ── Filter pills (trip-manager style) ────────── */
.stat-pill-row{
  display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin:16px 0;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.stat-pill-row::-webkit-scrollbar{display:none}
.stat-pill{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:10px 20px;border-radius:14px;border:2px solid transparent;
  background:var(--s1);cursor:pointer;white-space:nowrap;flex-shrink:0;
  box-shadow:var(--shadow);transition:border-color var(--ease),background var(--ease);
}
.stat-pill-num{font-size:22px;font-weight:800;line-height:1;letter-spacing:-.5px;color:var(--t1)}
.stat-pill-lbl{font-size:11px;font-weight:500;color:var(--t2)}
.stat-pill.on{border-color:var(--p);background:var(--p-dim)}
.stat-pill.on .stat-pill-num,.stat-pill.on .stat-pill-lbl{color:var(--p-lt)}

/* ── Search + status filter ────────────────────── */
.home-toolbar{display:flex;gap:10px;margin-bottom:8px}
@media (max-width:360px){
  .home-toolbar{flex-wrap:wrap}
  .ev-search-wrap{flex-basis:100%}
}
.ev-search-wrap{position:relative;flex:1}
.ev-search-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;fill:var(--t3);pointer-events:none;
}
.ev-search-inp{
  width:100%;height:48px;padding:0 40px 0 42px;
  border:1.5px solid var(--bd);border-radius:var(--rad);
  background:var(--s1);font-size:15px;color:var(--t1);
  outline:none;box-shadow:var(--shadow);transition:border-color var(--ease);
}
.ev-search-inp::placeholder{color:var(--t3)}
.ev-search-inp:focus{border-color:var(--p)}
.ev-search-clear{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border-radius:50%;border:none;background:var(--s2);
  color:var(--t3);display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background var(--ease),color var(--ease);
}
.ev-search-clear svg{width:14px;height:14px;fill:currentColor}
.ev-search-clear:hover{background:var(--bd);color:var(--t1)}
.ev-status-sel{
  flex-shrink:0;height:48px;padding:0 14px;
  border:1.5px solid var(--bd);border-radius:var(--rad);
  background:var(--s1);font-size:14px;font-weight:500;color:var(--t1);
  box-shadow:var(--shadow);cursor:pointer;outline:none;
}

.events-grid{display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){
  .events-grid{display:grid;grid-template-columns:1fr 1fr}
  .events-grid .empty{grid-column:1/-1}
  /* Skeleton cards are wrapped in their own .sk-wrap (see skeletonHtml()) -
     let it disappear from layout so its .sk-card children land directly in
     the 2-col grid instead of stacking in a single left-hand column. */
  .events-grid .sk-wrap{display:contents}
}

.ev-card{
  background:var(--s1);border-radius:var(--rad);box-shadow:var(--shadow);
  cursor:pointer;
  display:flex;flex-direction:column;min-width:0;
  transition:box-shadow .25s ease,transform .25s ease;
}
.ev-card:active{transform:scale(.99)}

.ev-card-banner{
  min-height:76px;display:flex;align-items:center;gap:10px;
  padding:14px 10px 14px 16px;
  position:relative;overflow:hidden;
  border-radius:var(--rad) var(--rad) 0 0;
}
.ev-card-banner::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(circle,rgba(255,255,255,.12) 1.5px,transparent 1.5px);
  background-size:20px 20px;
}
.ev-banner-icon{
  font-size:26px;line-height:1;flex-shrink:0;position:relative;z-index:1;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.25));
}
.ev-banner-name{
  flex:1;min-width:0;font-size:17px;font-weight:800;color:#fff;
  letter-spacing:-.3px;line-height:1.3;position:relative;z-index:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 3px rgba(0,0,0,.3);
}
.ev-banner-name mark.search-hl{background:rgba(255,255,255,.9);color:#1e293b}
.ev-banner-edit{
  flex-shrink:0;width:30px;height:30px;border-radius:50%;position:relative;z-index:1;
  border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background var(--ease);
}
.ev-banner-edit:hover{background:rgba(255,255,255,.28)}
.ev-banner-edit svg{width:15px;height:15px;fill:#fff}
.ev-card-body{padding:10px 16px 12px;min-width:0}
.ev-date{font-size:13px;color:var(--t2);font-weight:500}

.ev-card-actions{display:flex;border-top:1px solid var(--bd);position:relative}
.ev-action-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
  padding:12px 6px;background:none;border:none;cursor:pointer;
  color:var(--t2);font-size:12px;font-weight:500;
  transition:background var(--ease),color var(--ease);
}
.ev-action-btn+.ev-action-btn{border-left:1px solid var(--bd)}
.ev-action-btn:hover{background:var(--s2);color:var(--t1)}
.ev-action-btn.del:hover{background:var(--r-dim);color:var(--r)}
.ev-action-btn svg{width:16px;height:16px;fill:currentColor}
</style>
