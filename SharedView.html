<script>
var SHARE_TOKEN = '<?!= shareToken ?>';
// True only if the link was 'edit' at page-load time - the add/edit/delete
// sheets (and the fab) are only rendered into the DOM at all when this is
// true (see doGet), so this must gate anything that opens them.
var CAN_EDIT = <?!= canEdit ?>;

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtAmt(n) {
  return '฿' + parseFloat(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtDate(iso) {
  if (!iso) return '';
  try { return new Date(iso).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }) }
  catch (e) { return iso }
}
function initials(s) { return (s || '?')[0].toUpperCase() }
function toast(msg, type) {
  type = type || 'ok';
  var $el = $('<div>').addClass('toast ' + type)
    .append($('<div>').addClass('toast-dot'))
    .append($('<span>').text(msg));
  $('#toastWrap').append($el);
  setTimeout(function () { $el.remove() }, 3200);
}

var BANNER_GRADS = [
  'linear-gradient(135deg,#3730A3,#A5B4FC)', 'linear-gradient(135deg,#065F46,#5EEAD4)',
  'linear-gradient(135deg,#92400E,#FCD34D)', 'linear-gradient(135deg,#6D28D9,#C4B5FD)',
  'linear-gradient(135deg,#075985,#7DD3FC)', 'linear-gradient(135deg,#9D174D,#FDA4AF)',
  'linear-gradient(135deg,#14532D,#6EE7B7)', 'linear-gradient(135deg,#7C2D12,#FDBA74)'
];
var AV_COLORS = [
  'linear-gradient(135deg,#6D28D9,#C4B5FD)', 'linear-gradient(135deg,#1D4ED8,#93C5FD)',
  'linear-gradient(135deg,#047857,#6EE7B7)', 'linear-gradient(135deg,#B45309,#FCD34D)',
  'linear-gradient(135deg,#B91C1C,#FCA5A5)', 'linear-gradient(135deg,#BE185D,#F9A8D4)',
  'linear-gradient(135deg,#5B21B6,#DDD6FE)', 'linear-gradient(135deg,#0E7490,#67E8F9)'
];
var EMOJIS = ['🎉','🍕','✈️','🎬','🏖️','🎂','🍜','⚽','🎮','🛒','🏕️','🎵','🎸','🚂','🏔️'];
function _hash(s, mod) {
  var h = 0;
  for (var i = 0; i < (s || '').length; i++) h = (h * 31 + s.charCodeAt(i)) & 0xFFFF;
  return h % mod;
}
function avCol(s) { return AV_COLORS[_hash(s, AV_COLORS.length)] }
function evEmoji(s) { return EMOJIS[_hash(s, EMOJIS.length)] }
function bannerGrad(s) { return BANNER_GRADS[_hash(s, BANNER_GRADS.length)] }

// Shows the event owner's own profile photo (set via My Profile) for their
// own avatar; everyone else still gets the initials/color circle since only
// accounts — not plain friend names — have a photo.
function _avatarHtml(cls, name, friendId) {
  if (friendId && SHARE_DATA && friendId === SHARE_DATA.selfFriendId && SHARE_DATA.ownerPhoto) {
    return '<div class="' + cls + '" style="background:url(' + SHARE_DATA.ownerPhoto + ') center/cover no-repeat"></div>';
  }
  return '<div class="' + cls + '" style="background:' + avCol(name) + '">' + initials(name) + '</div>';
}

function renderTx(details) {
  var $el = $('#shTxList');
  if (!details.length) {
    $el.html('<div class="empty"><div class="empty-t">No expenses yet</div></div>');
    return;
  }
  var grp = {}, ord = [];
  details.forEach(function (d) {
    if (!grp[d.transactionId]) { grp[d.transactionId] = []; ord.push(d.transactionId) }
    grp[d.transactionId].push(d);
  });
  var html = ord.map(function (tid, i) {
    var rows = grp[tid], f = rows[0];
    var total = parseFloat(f.totalAmount);
    var desc = f.description || 'Transaction';
    var isCustom = rows.some(function (r) { return Math.abs(parseFloat(r.amount) - parseFloat(rows[0].amount)) > 0.01 });
    var chips = rows.map(function (r) {
      return '<span class="tx-chip">' + esc(r.friendName) + (isCustom ? ' ' + fmtAmt(r.amount) : '') + '</span>';
    }).join('');
    var d = new Date(f.createdAt);
    var timeStr = isNaN(d) ? '' : d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    var isLast = i === ord.length - 1;
    var hasSlip = SHARE_DATA.slips && SHARE_DATA.slips[tid] && SHARE_DATA.slips[tid].length;
    return '<div class="sched-item">' +
      '<div class="sched-time-col"><div class="sched-time">' + esc(timeStr) + '</div><div class="sched-date">' + fmtDate(f.createdAt) + '</div></div>' +
      '<div class="sched-axis"><div class="sched-dot"></div>' + (isLast ? '' : '<div class="sched-line"></div>') + '</div>' +
      '<div class="sched-card" data-tid="' + esc(tid) + '">' +
      '<div class="tx-head">' +
      _avatarHtml('tx-av', f.payerName, f.payId) +
      '<div class="tx-meta">' +
      '<div class="tx-desc">' + esc(desc) + '</div>' +
      '<div class="tx-by">Paid by ' + esc(f.payerName) + (isCustom ? ' · ระบุเอง' : '') + '</div>' +
      '</div>' +
      (hasSlip ?
        '<button class="sched-slip-btn tx-view-slip" data-tid="' + esc(tid) + '" title="View receipt">' +
        '<svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>' +
        '</button>' : '') +
      '<div class="tx-amt">' + fmtAmt(total) + '</div>' +
      '</div>' +
      '<div class="tx-people">' + chips + '</div>' +
      (CAN_EDIT ?
        '<div class="sched-card-footer">' +
        '<button class="sched-act-btn tx-edit" data-tid="' + esc(tid) + '" title="Edit">' +
        '<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.9959.9959 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></button>' +
        '<button class="sched-act-btn del tx-del" data-tid="' + esc(tid) + '" title="Delete">' +
        '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>' +
        '</div>' : '') +
      '</div>' +
      '</div>';
  }).join('');
  $el.html(html);
}

function renderSummary(ss) {
  var $el = $('#shSumList');
  if (!ss.length) {
    $el.html(
      '<div class="empty">' +
      '<div class="empty-icon" style="background:var(--g-dim);border-color:rgba(34,197,94,.2)">' +
      '<svg viewBox="0 0 24 24" style="fill:var(--g)"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>' +
      '</div>' +
      '<div class="empty-t" style="color:var(--g)">All Settled! 🎉</div>' +
      '<div class="empty-s">Everyone is even — no payments needed</div>' +
      '</div>'
    );
    return;
  }
  var html = ss.map(function (x) {
    return '<div class="settle-card">' +
      '<div class="se-person">' +
      _avatarHtml('se-av', x.fromName, x.from) +
      '<div class="se-name">' + esc(x.fromName) + '</div>' +
      '</div>' +
      '<div class="se-mid">' +
      '<div class="se-label">owes <span class="se-arrow">→</span></div>' +
      '<div class="se-amt">' + fmtAmt(x.amount) + '</div>' +
      '</div>' +
      '<div class="se-person">' +
      _avatarHtml('se-av', x.toName, x.to) +
      '<div class="se-name">' + esc(x.toName) + '</div>' +
      '</div>' +
      '</div>';
  }).join('');
  $el.html(html);
}

function onFail(err) {
  $('#shLoading').hide();
  $('#shErrorMsg').text('' + err);
  $('#shError').show();
}

var SHARE_DATA = null;
var _slipCarouselList = [];
var _slipCarouselIdx = 0;

function _renderSlipCarousel() {
  var cur = _slipCarouselList[_slipCarouselIdx];
  $('#slipCarouselImg').attr('src', (cur && cur.slip) || '');
  $('#slipCounter').text(_slipCarouselList.length > 1 ? (_slipCarouselIdx + 1) + ' / ' + _slipCarouselList.length : '');
  $('#slipPrev, #slipNext').toggle(_slipCarouselList.length > 1);
}
function _downloadDataUri(dataUri, filename) {
  var a = document.createElement('a');
  a.href = dataUri;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
function _slipGoPrev() {
  _slipCarouselIdx = (_slipCarouselIdx - 1 + _slipCarouselList.length) % _slipCarouselList.length;
  _renderSlipCarousel();
}
function _slipGoNext() {
  _slipCarouselIdx = (_slipCarouselIdx + 1) % _slipCarouselList.length;
  _renderSlipCarousel();
}
// Swipe left/right on the photo itself, in addition to the < > buttons.
function _bindSlipSwipe(selector) {
  var startX = null, startY = null;
  $(document).on('touchstart', selector, function (e) {
    var t = e.originalEvent.touches[0];
    startX = t.clientX; startY = t.clientY;
  });
  $(document).on('touchend', selector, function (e) {
    if (startX === null || _slipCarouselList.length < 2) return;
    var t = e.originalEvent.changedTouches[0];
    var dx = t.clientX - startX, dy = t.clientY - startY;
    startX = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0) _slipGoNext(); else _slipGoPrev();
    }
  });
}

function onData(r) {
  $('#shLoading').hide();
  if (!r.success) {
    $('#shErrorMsg').text(r.error || 'This share link is no longer active');
    $('#shError').show();
    return;
  }
  SHARE_DATA = r;
  $('#shName').text(r.event.name);
  $('#shDate').text(fmtDate(r.event.createdAt));
  $('#shEmoji').text(evEmoji(r.event.name));
  $('#shBanner').css('background', bannerGrad(r.event.name));
  renderSummary(r.settlements || []);
  renderTx(r.details);
  var editMode = r.permission === 'edit';
  // #fab (and the edit sheets) are only rendered server-side at all when the
  // link was 'edit' at page-load time - see doGet's canEdit. If the owner
  // flips permission while this tab is already open, a refresh picks it up.
  $('#shPermBadge').toggleClass('edit', editMode);
  $('#shPermBadgeText').text(editMode ? 'Editable' : 'View only');
  $('#shContent').show();
}

function reloadShare() {
  google.script.run.withSuccessHandler(onData).withFailureHandler(onFail).getSharedEventView(SHARE_TOKEN);
}

function gscRun(fnName) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (res) {
    var r = google.script.run.withSuccessHandler(res).withFailureHandler(function (e) { res({ success: false, error: '' + e }) });
    r[fnName].apply(r, args);
  });
}

// ── Add/Edit/Delete Transaction (edit-permission links only) ────
// Unlike the main app (a fixed-height shell where only an inner pane
// scrolls), this page is a plain document, so an open sheet must explicitly
// lock body scroll - otherwise the page behind it still scrolls on touch.
function openSheet(id) {
  closeSheets();
  $('#overlay').addClass('on');
  $('#' + id).addClass('on');
  $('body').css('overflow', 'hidden');
}
function closeSheets() {
  $('#overlay').removeClass('on');
  $('.sheet.on').removeClass('on');
  $('body').css('overflow', '');
}

var splitMode = 'equal';
var _editTxId = null;
var _delTxId = null;
var _txSlipsExisting = []; // [{id, slip, slipHi}] already saved on the server (only when editing)
var _txSlipsRemoved  = []; // ids of existing photos marked for deletion on save
var _txSlipsNew       = []; // [{slip, slipHi}] picked but not yet uploaded

var _SLIP_ADD_ICON = '<div class="tx-slip-add" id="btnTxSlipAdd"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></div>';
var _SLIP_REMOVE_ICON = '<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>';

function _renderTxSlipGallery() {
  var html = _txSlipsExisting.map(function (s, idx) {
    return '<div class="tx-slip-item"><img src="' + s.slip + '"/>' +

  }).join('') + _txSlipsNew.map(function (s, idx) {

  }).join('') + _SLIP_ADD_ICON;

function _resizeImageFile(file, maxSize, quality) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = function () { reject(new Error('Could not read image')) };
      img.src = e.target.result;
    };
    reader.onerror = function () { reject(new Error('Could not read file')) };
    reader.readAsDataURL(file);
  });
}

function _compressSlip(file) {
  var attempts = [[1000, 0.6], [800, 0.5], [640, 0.4], [480, 0.35]];
  var i = 0;
  function tryNext() {
    return _resizeImageFile(file, attempts[i][0], attempts[i][1]).then(function (dataUrl) {
      if (dataUrl.length < 45000 || i === attempts.length - 1) return dataUrl;
      i++;
      return tryNext();
    });
  }
  return tryNext();
}

function _compressSlipHi(file) {
  var attempts = [[1600, 0.85], [1400, 0.75], [1200, 0.65], [1000, 0.55]];
  var i = 0;
  function tryNext() {
    return _resizeImageFile(file, attempts[i][0], attempts[i][1]).then(function (dataUrl) {
      if (dataUrl.length < 48000 || i === attempts.length - 1) return dataUrl;
      i++;
      return tryNext();
    });
  }
  return tryNext();
}

  await Promise.all(newSlips.map(function (s) { return gscRun('uploadTransactionSlipViaShare', SHARE_TOKEN, transactionId, s.slip, s.slipHi) }));

function openAddTxSheet() {
  if (!SHARE_DATA.friends.length) { toast('This event has no one to split expenses between yet', 'warn'); return }
  _editTxId = null;
  $('#txTitle').text('Add Transaction');
  $('#btnSubmitTx').text('Add Transaction');
  $('#inpDesc').val('');
  $('#inpAmt').val('');
  $('#ppBox').hide();
  setSplitMode('equal');
  buildTxFriendPickers(SHARE_DATA.friends.map(function (f) { return f.id }));
  _txSlipsExisting = []; _txSlipsRemoved = []; _txSlipsNew = [];
  _renderTxSlipGallery();
  openSheet('shTx');
}

function openEditTxSheet(tid) {
  var rows = SHARE_DATA.details.filter(function (d) { return d.transactionId === tid });
  if (!rows.length) return;
  var f = rows[0];
  var friendIds = rows.map(function (r) { return r.friendId });
  var isCustom = rows.some(function (r) { return Math.abs(parseFloat(r.amount) - parseFloat(rows[0].amount)) > 0.01 });

  _editTxId = tid;
  $('#txTitle').text('Edit Transaction');
  $('#btnSubmitTx').text('Save Changes');
  $('#inpDesc').val(f.description || '');
  buildTxFriendPickers(friendIds);
  $('#inpPayer').val(f.payId).trigger('change.select2');

  if (isCustom) {
    var prefill = {};
    rows.forEach(function (r) { prefill[r.friendId] = r.amount });
    setSplitMode('custom', prefill);
  } else {
    setSplitMode('equal');
    $('#inpAmt').val(parseFloat(f.totalAmount));
    calcPP();
  }
  _txSlipsExisting = (SHARE_DATA.slips && SHARE_DATA.slips[tid] || []).slice();
  _txSlipsRemoved = []; _txSlipsNew = [];
  _renderTxSlipGallery();
  openSheet('shTx');
}

async function submitTx() {
  var desc = $('#inpDesc').val().trim();
  var pay = $('#inpPayer').val();
  if (!desc) { toast('Please enter a description', 'warn'); return }
  var friendIds, totalAmount, customAmounts = null;
  if (splitMode === 'equal') {
    var amt = parseFloat($('#inpAmt').val());
    var sh = $('#inpShared input:checked').map(function () { return $(this).val() }).get();
    if (!amt || amt <= 0) { toast('Please enter a valid amount', 'warn'); return }
    if (!sh.length) { toast('Select at least one person', 'warn'); return }
    friendIds = sh; totalAmount = amt;
  } else {
    friendIds = []; customAmounts = {}; totalAmount = 0;
    $('#cusRows .ca-inp').each(function () {
      var a = parseFloat($(this).val()) || 0;
      if (a > 0) {
        var id = $(this).data('id');
        friendIds.push(id); customAmounts[id] = a; totalAmount += a;
      }
    });
    if (!friendIds.length) { toast('ระบุจำนวนเงินอย่างน้อย 1 คน', 'warn'); return }
  }
  var editId = _editTxId;
  var slipsRemoved = _txSlipsRemoved.slice();
  var slipsNew = _txSlipsNew.slice();
  closeSheets();
  try {
    var r = editId
      ? await gscRun('updateDetailViaShare', SHARE_TOKEN, editId, pay, friendIds, totalAmount, desc, customAmounts)
      : await gscRun('addDetailViaShare', SHARE_TOKEN, pay, friendIds, totalAmount, desc, customAmounts);
    if (r.success) {
      toast(editId ? 'Transaction updated' : 'Transaction added! 💸');
      await _saveTxSlipsIfNeeded(editId || r.transactionId, slipsRemoved, slipsNew);
      reloadShare();
    } else toast(r.error || 'Something went wrong', 'err');
  } catch (e) { toast('' + e, 'err') }
  _editTxId = null;
  _txSlipsExisting = []; _txSlipsRemoved = []; _txSlipsNew = [];
}

function askDeleteTx(tid) {
  _delTxId = tid;
  openSheet('shConfirm');
}

async function confirmDeleteTx() {
  var tid = _delTxId;
  closeSheets();
  if (!tid) return;
  try {
    var r = await gscRun('deleteDetailViaShare', SHARE_TOKEN, tid);
    if (r.success) { toast('Transaction deleted'); reloadShare() }
    else toast(r.error || 'Something went wrong', 'err');
  } catch (e) { toast('' + e, 'err') }
  _delTxId = null;
}

var _pdfLibsPromise = null;
function _loadPdfLibs() {
  if (_pdfLibsPromise) return _pdfLibsPromise;
  _pdfLibsPromise = new Promise(function (resolve, reject) {
    var s1 = document.createElement('script');
    s1.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s1.onload = function () {
      var s2 = document.createElement('script');
      s2.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
      s2.onload = resolve;
      s2.onerror = reject;
      document.head.appendChild(s2);
    };
    s1.onerror = reject;
    document.head.appendChild(s1);
  });
  return _pdfLibsPromise;
}

    document.body.removeChild(hideWrap);

    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF('p', 'pt', 'a4');
    var margin = 20;
    var pageW = doc.internal.pageSize.getWidth();
    var pageH = doc.internal.pageSize.getHeight();
    var usableW = pageW - margin * 2;
    var usableH = pageH - margin * 2;
    var imgH = canvas.height * usableW / canvas.width;
    var imgData = canvas.toDataURL('image/png');

    var heightLeft = imgH;
    var y = margin;
    doc.addImage(imgData, 'PNG', margin, y, usableW, imgH);
    heightLeft -= usableH;
    while (heightLeft > 0) {
      doc.addPage();
      y = margin - (imgH - heightLeft);
      doc.addImage(imgData, 'PNG', margin, y, usableW, imgH);
      heightLeft -= usableH;
    }

    doc.save(filename);

    try {
      var slip = await _compressSlip(file);
      var slipHi = await _compressSlipHi(file);
      _txSlipsNew.push({ slip: slip, slipHi: slipHi });
      _renderTxSlipGallery();
    } catch (e) { toast('Could not process that image', 'err') }
  });
});

if (!SHARE_TOKEN) {
  onFail('Invalid link');
} else {
  reloadShare();
}
</script>
