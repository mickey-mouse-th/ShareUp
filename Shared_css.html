<style>
/* ── Reset & Tokens ─────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --p:#4F46E5;--p-lt:#4338CA;--p-dim:#EEF2FF;--p-glow:rgba(79,70,229,.28);
  --p-grad:linear-gradient(135deg,#4F46E5 0%,#3730A3 100%);
  --g:#15803D;--g-dim:#F0FDFA;
  --r:#EF4444;--r-dim:#FEF2F2;
  --o:#B45309;--o-dim:#FFFBEB;
  --b:#0F766E;
  --bg:#F1F5F9;
  --s1:#FFFFFF;--s2:#F8FAFC;--s3:#F1F5F9;
  --bd:#E2E8F0;--bd2:#CBD5E1;
  --t1:#0F172A;--t2:#64748B;--t3:#94A3B8;
  --hdr-bg:#FFFFFF;--nav-bg:#FFFFFF;--overlay-bg:#0F172A;
  --rad:16px;--rad-sm:12px;
  --shadow:0 1px 3px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.06);
  --shadow-lg:0 24px 64px rgba(0,0,0,.18);
  --ease:.2s ease;
  --hh:64px;--nh:82px;
  --si:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
body{
  margin:0;font-size:17px;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;
  background:var(--bg);color:var(--t1);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
button,input,select,textarea{font:inherit;-webkit-appearance:none}

/* ── Splash ──────────────────────────────────── */
#splash{
  position:fixed;inset:0;z-index:9999;
  background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .5s ease;
}
#splash.out{opacity:0;pointer-events:none}
.sp-logo{
  width:96px;height:96px;border-radius:28px;
  background:var(--p-grad);
  display:flex;align-items:center;justify-content:center;margin-bottom:24px;
  box-shadow:var(--shadow-lg);
}
.sp-logo svg{width:52px;height:52px;fill:#fff}
.sp-name{font-size:32px;font-weight:800;letter-spacing:-.6px;color:var(--t1)}
.sp-tag{font-size:15px;color:var(--t2);margin-top:8px}
.sp-dots{display:flex;gap:8px;margin-top:52px}
.sp-dot{width:8px;height:8px;border-radius:50%;background:var(--p-dim);animation:dot .9s ease-in-out infinite}
.sp-dot:nth-child(2){animation-delay:.18s}
.sp-dot:nth-child(3){animation-delay:.36s}
@keyframes dot{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1;background:var(--p-lt)}}

/* ── Toast ───────────────────────────────────── */
#toastWrap{
  position:fixed;top:calc(var(--si)+14px);left:14px;right:14px;
  z-index:8000;display:flex;flex-direction:column;gap:8px;pointer-events:none;
}
.toast{
  background:#1e293b;
  border:1px solid var(--bd2);border-radius:var(--rad-sm);padding:14px 18px;
  font-size:15px;font-weight:500;display:flex;align-items:center;gap:12px;color:#fff;
  box-shadow:var(--shadow-lg);
  animation:tIn .3s cubic-bezier(.34,1.56,.64,1);pointer-events:all;
}
.toast-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.toast.ok .toast-dot{background:var(--g)}
.toast.err .toast-dot{background:var(--r)}
.toast.warn .toast-dot{background:var(--o)}
@keyframes tIn{from{opacity:0;transform:translateY(-16px) scale(.95)}to{opacity:1;transform:none}}

/* ── App Shell ───────────────────────────────── */
#appView{display:none;flex-direction:column;height:100dvh;overflow:hidden}
.hdr{
  padding:calc(var(--si)+10px) 16px 10px;min-height:calc(var(--si)+var(--hh));
  background:color-mix(in srgb,var(--hdr-bg) 85%,transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;flex-shrink:0;z-index:20;
}
.hdr-back{
  width:40px;height:40px;border-radius:50%;background:var(--p-dim);
  border:1px solid var(--bd);display:none;align-items:center;justify-content:center;
  color:var(--p);flex-shrink:0;
}
.hdr-back svg{width:22px;height:22px;fill:currentColor}
.show-back .hdr-back{display:flex}
.show-back .hdr-brand{display:none}
.hdr-brand{
  width:38px;height:38px;border-radius:var(--rad-sm);
  background:var(--p-grad);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 4px 14px var(--p-glow);
}
.hdr-brand svg{width:21px;height:21px;fill:#fff}
.hdr-title{flex:1;font-size:20px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t1)}
.hdr-av{
  width:40px;height:40px;border-radius:50%;
  background:var(--p-grad);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:16px;flex-shrink:0;cursor:pointer;
  box-shadow:0 4px 14px var(--p-glow);transition:transform .15s;
}
.hdr-av:active{transform:scale(.88)}
.pages{flex:1;overflow:hidden;position:relative;min-height:0}
.page{
  position:absolute;inset:0;overflow-y:scroll;-webkit-overflow-scrolling:touch;
  transition:transform .3s cubic-bezier(.25,.46,.45,.94);will-change:transform;
}
.page::-webkit-scrollbar{display:none}
.page.hidden{transform:translateX(105%);pointer-events:none}
.page.behind{transform:translateX(-100%);pointer-events:none}
.pg{padding:16px 16px calc(24px + var(--nh) + var(--sb))}
.bnav{
  padding-bottom:var(--sb);background:color-mix(in srgb,var(--nav-bg) 92%,transparent);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--bd);display:flex;flex-shrink:0;z-index:20;
}
.bnav-btn{
  flex:1;padding:14px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;
  background:none;border:none;color:var(--t3);transition:color .2s;cursor:pointer;
}
.bnav-btn.on{color:var(--p)}
.bnav-ic{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:var(--rad-sm);transition:background .2s}
.bnav-btn.on .bnav-ic{background:var(--p-dim)}
.bnav-ic svg{width:26px;height:26px;fill:currentColor}
.bnav-lbl{font-size:12px;font-weight:600;letter-spacing:.02em}
.fab{
  position:fixed;right:20px;bottom:calc(var(--nh) + var(--sb) + 20px);
  width:64px;height:64px;border-radius:22px;
  background:var(--p-grad);border:none;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 30px var(--p-glow),0 0 0 1px rgba(255,255,255,.15) inset;
  z-index:50;transition:transform .15s;cursor:pointer;
}
.fab:active{transform:scale(.88)}
.fab svg{width:30px;height:30px;fill:#fff}
.fab.hide{display:none}

/* ── Shared Components ───────────────────────── */
.btn-del{
  width:36px;height:36px;border-radius:var(--rad-sm);background:var(--r-dim);
  border:1px solid var(--bd);display:flex;align-items:center;
  justify-content:center;flex-shrink:0;transition:background .15s;cursor:pointer;
}
.btn-del:active{background:#fecdd3}
.btn-del svg{width:17px;height:17px;fill:var(--r)}
.btn-slip{
  width:36px;height:36px;border-radius:var(--rad-sm);background:var(--s2);
  border:1px solid var(--bd2);display:flex;align-items:center;
  justify-content:center;flex-shrink:0;transition:background .15s;cursor:pointer;
}
.btn-slip:active{background:var(--s3)}
.btn-slip svg{width:17px;height:17px;fill:var(--t2)}
.sec-row{display:flex;align-items:center;margin:22px 0 12px}
.sec-lbl{font-size:13px;font-weight:700;color:var(--t2);letter-spacing:.08em;text-transform:uppercase}
.sec-line{flex:1;height:1px;background:var(--bd);margin-left:12px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 28px;text-align:center}
.empty-icon{
  width:84px;height:84px;border-radius:24px;background:var(--p-dim);
  border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;margin-bottom:20px;
}
.empty-icon svg{width:42px;height:42px;fill:var(--p)}
.empty-t{font-size:19px;font-weight:700;color:var(--t1);margin-bottom:8px;letter-spacing:-.3px}
.empty-s{font-size:15px;color:var(--t2);line-height:1.6}

/* ── Search highlight ─────────────────────────── */
.search-hl{background:#fef9c3;color:#78350f;border-radius:2px;padding:0 1px;font-style:normal}

/* ── Password requirement checklist ────────────── */
.pw-checklist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.pw-rule{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t3);transition:color var(--ease)}
.pw-rule svg{width:15px;height:15px;fill:var(--t3);flex-shrink:0;transition:fill var(--ease)}
.pw-rule.met{color:var(--g)}
.pw-rule.met svg{fill:var(--g)}

/* ── Select2 overrides ─────────────────────────── */
.select2-container--default .select2-selection--single{
  height:48px;border:1.5px solid var(--bd);border-radius:var(--rad-sm);
  background:var(--s1);display:flex;align-items:center;
}
.select2-container--default .select2-selection--single .select2-selection__rendered{
  line-height:48px;padding-left:16px;padding-right:36px;font-size:15px;color:var(--t1);
}
.select2-container--default .select2-selection--single .select2-selection__placeholder{color:var(--t3)}
.select2-container--default .select2-selection--single .select2-selection__arrow{height:48px;right:10px}
.select2-container--default.select2-container--disabled .select2-selection--single{opacity:.5}
.select2-dropdown{
  border:1.5px solid var(--bd);border-radius:var(--rad-sm);
  box-shadow:var(--shadow-lg);overflow:hidden;
}
.select2-results__options{scrollbar-width:none}
.select2-results__options::-webkit-scrollbar{display:none}
.select2-container--default .select2-results__option{padding:11px 16px;font-size:15px;color:var(--t1)}
.select2-container--default .select2-results__option--highlighted[aria-selected]{
  background:var(--p);color:#fff;
}
.select2-container--default .select2-results__option[aria-selected=true]{
  background:var(--p-dim);color:var(--p-lt);font-weight:600;
}
.select2-search--dropdown{padding:8px}
.select2-search--dropdown .select2-search__field{
  border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:14px;
  background:var(--s1);color:var(--t1);outline:none;
}
.select2-container--open .select2-dropdown{z-index:100000}

/* ── Skeleton Loader ─────────────────────────── */
.sk-wrap{display:flex;flex-direction:column;gap:12px}
.sk-card{background:var(--s1);border:1px solid var(--bd);border-radius:22px;padding:16px 18px}
.sk-row{display:flex;align-items:center;gap:14px}
.sk-ic{width:58px;height:58px;border-radius:18px;flex-shrink:0}
.sk-av{width:50px;height:50px;border-radius:50%;flex-shrink:0}
.sk-lines{flex:1;display:flex;flex-direction:column;gap:9px}
.sk-line{height:13px;border-radius:7px}
.sk-w65{width:65%}.sk-w55{width:55%}.sk-w60{width:60%}.sk-w40{width:40%}.sk-w35{width:35%}
.sk-amt{width:72px;height:22px;border-radius:8px;flex-shrink:0}
.sk-chips{display:flex;gap:8px;margin-top:12px}
.sk-chip{height:26px;width:72px;border-radius:20px}
.sk-pulse{
  background:linear-gradient(90deg,var(--s2) 25%,var(--s3) 50%,var(--s2) 75%);
  background-size:200% 100%;
  animation:sk-shimmer 1.5s ease-in-out infinite;
}
@keyframes sk-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
