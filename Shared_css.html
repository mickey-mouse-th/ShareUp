<style>
/* ── Reset & Tokens ─────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --p:#7C5CFC;--p-lt:#A78BFA;--p-dim:rgba(124,92,252,.16);--p-glow:rgba(124,92,252,.28);
  --g:#22C55E;--g-dim:rgba(34,197,94,.15);
  --r:#F43F5E;--r-dim:rgba(244,63,94,.15);
  --o:#F59E0B;--o-dim:rgba(245,158,11,.15);
  --b:#38BDF8;
  --bg:#100F22;
  --s1:#1A1935;--s2:#22213E;--s3:#2C2A50;
  --bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.12);
  --t1:#FFFFFF;--t2:rgba(255,255,255,.58);--t3:rgba(255,255,255,.28);
  --hh:60px;--nh:76px;
  --si:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
body{
  margin:0;font-size:16px;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;
  background:var(--bg);color:var(--t1);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
button,input,select,textarea{font:inherit;-webkit-appearance:none}

/* ── Splash ──────────────────────────────────── */
#splash{
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(160deg,#1E1342 0%,#100F22 55%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .5s ease;
}
#splash.out{opacity:0;pointer-events:none}
.sp-logo{
  width:96px;height:96px;border-radius:28px;
  background:linear-gradient(135deg,#7C5CFC,#4F46E5);
  display:flex;align-items:center;justify-content:center;margin-bottom:24px;
  box-shadow:0 0 0 1px rgba(255,255,255,.12),0 0 60px rgba(124,92,252,.6),0 0 120px rgba(124,92,252,.25);
}
.sp-logo svg{width:52px;height:52px;fill:#fff}
.sp-name{font-size:32px;font-weight:800;letter-spacing:-.6px}
.sp-tag{font-size:15px;color:rgba(255,255,255,.45);margin-top:8px}
.sp-dots{display:flex;gap:8px;margin-top:52px}
.sp-dot{width:8px;height:8px;border-radius:50%;background:var(--p-dim);animation:dot .9s ease-in-out infinite}
.sp-dot:nth-child(2){animation-delay:.18s}
.sp-dot:nth-child(3){animation-delay:.36s}
@keyframes dot{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1;background:var(--p-lt)}}

/* ── Toast ───────────────────────────────────── */
#toastWrap{
  position:fixed;top:calc(var(--si)+14px);left:14px;right:14px;
  z-index:8000;display:flex;flex-direction:column;gap:8px;pointer-events:none;
}
.toast{
  background:rgba(22,21,44,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--bd2);border-radius:18px;padding:14px 18px;
  font-size:15px;font-weight:500;display:flex;align-items:center;gap:12px;color:#fff;
  box-shadow:0 16px 40px rgba(0,0,0,.5);
  animation:tIn .3s cubic-bezier(.34,1.56,.64,1);pointer-events:all;
}
.toast-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.toast.ok .toast-dot{background:var(--g)}
.toast.err .toast-dot{background:var(--r)}
.toast.warn .toast-dot{background:var(--o)}
@keyframes tIn{from{opacity:0;transform:translateY(-16px) scale(.95)}to{opacity:1;transform:none}}

/* ── App Shell ───────────────────────────────── */
#appView{display:none;flex-direction:column;height:100dvh;overflow:hidden}
.hdr{
  padding:calc(var(--si)+10px) 16px 10px;min-height:calc(var(--si)+var(--hh));
  background:rgba(16,15,34,.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;flex-shrink:0;z-index:20;
}
.hdr-back{
  width:40px;height:40px;border-radius:50%;background:var(--p-dim);
  border:1px solid rgba(124,92,252,.2);display:none;align-items:center;justify-content:center;
  color:var(--p-lt);flex-shrink:0;
}
.hdr-back svg{width:22px;height:22px;fill:currentColor}
.show-back .hdr-back{display:flex}
.show-back .hdr-brand{display:none}
.hdr-brand{
  width:38px;height:38px;border-radius:12px;
  background:linear-gradient(135deg,#7C5CFC,#4F46E5);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 4px 14px rgba(124,92,252,.4);
}
.hdr-brand svg{width:21px;height:21px;fill:#fff}
.hdr-title{flex:1;font-size:19px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-av{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg,#7C5CFC,#4F46E5);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:16px;flex-shrink:0;cursor:pointer;
  box-shadow:0 4px 14px rgba(124,92,252,.4);transition:transform .15s;
}
.hdr-av:active{transform:scale(.88)}
.pages{flex:1;overflow:hidden;position:relative;min-height:0}
.page{
  position:absolute;inset:0;overflow-y:scroll;-webkit-overflow-scrolling:touch;
  transition:transform .3s cubic-bezier(.25,.46,.45,.94);will-change:transform;
}
.page::-webkit-scrollbar{display:none}
.page.hidden{transform:translateX(105%);pointer-events:none}
.page.behind{transform:translateX(-28%);pointer-events:none}
.pg{padding:16px 16px calc(24px + var(--nh) + var(--sb))}
.bnav{
  padding-bottom:var(--sb);background:rgba(16,15,34,.96);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--bd);display:flex;flex-shrink:0;z-index:20;
}
.bnav-btn{
  flex:1;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;
  background:none;border:none;color:var(--t3);transition:color .2s;cursor:pointer;
}
.bnav-btn.on{color:var(--p-lt)}
.bnav-ic{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:11px;transition:background .2s}
.bnav-btn.on .bnav-ic{background:var(--p-dim)}
.bnav-ic svg{width:24px;height:24px;fill:currentColor}
.bnav-lbl{font-size:11px;font-weight:600;letter-spacing:.02em}
.fab{
  position:fixed;right:20px;bottom:calc(var(--nh) + var(--sb) + 18px);
  width:60px;height:60px;border-radius:20px;
  background:linear-gradient(135deg,#7C5CFC,#4F46E5);border:none;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 30px rgba(124,92,252,.6),0 0 0 1px rgba(255,255,255,.15) inset;
  z-index:50;transition:transform .15s;cursor:pointer;
}
.fab:active{transform:scale(.88)}
.fab svg{width:28px;height:28px;fill:#fff}
.fab.hide{display:none}

/* ── Shared Components ───────────────────────── */
.btn-del{
  width:36px;height:36px;border-radius:12px;background:var(--r-dim);
  border:1px solid rgba(244,63,94,.18);display:flex;align-items:center;
  justify-content:center;flex-shrink:0;transition:background .15s;cursor:pointer;
}
.btn-del:active{background:rgba(244,63,94,.3)}
.btn-del svg{width:17px;height:17px;fill:var(--r)}
.sec-row{display:flex;align-items:center;margin:22px 0 12px}
.sec-lbl{font-size:13px;font-weight:700;color:var(--t2);letter-spacing:.08em;text-transform:uppercase}
.sec-line{flex:1;height:1px;background:var(--bd);margin-left:12px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 28px;text-align:center}
.empty-icon{
  width:84px;height:84px;border-radius:24px;background:var(--p-dim);
  border:1px solid rgba(124,92,252,.18);display:flex;align-items:center;justify-content:center;margin-bottom:20px;
}
.empty-icon svg{width:42px;height:42px;fill:var(--p-lt)}
.empty-t{font-size:19px;font-weight:700;color:var(--t1);margin-bottom:8px;letter-spacing:-.3px}
.empty-s{font-size:15px;color:var(--t2);line-height:1.6}
</style>
