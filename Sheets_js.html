<script>
var splitMode = 'equal';
var _del = null;
var _evMode = 'create';   // 'create' | 'rename'
var _evEditId = null;
var _efEventId = null;
var _efMode = 'manage';   // 'create' | 'manage'
var _pendingNewEvent = null;
var _editTxId = null;      // null unless editing an existing transaction
var _txSlipsExisting = []; // [{id, slip, slipHi}] already saved on the server
var _txSlipsRemoved  = []; // ids of existing photos marked for deletion on save
var _txSlipsNew       = []; // [{slip, slipHi}] picked but not yet uploaded

var _SLIP_ADD_ICON = '<div class="tx-slip-add" id="btnTxSlipAdd"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></div>';
var _SLIP_REMOVE_ICON = '<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>';

function _renderTxSlipGallery() {
  // Removing an already-saved photo is a delete - never allowed via a share link, even an editable one.
  var canRemoveExisting = !IS_SHARE;
  var html = _txSlipsExisting.map(function (s, idx) {
    return '<div class="tx-slip-item"><img src="' + s.slip + '"/>' +
      (canRemoveExisting ? '<button type="button" class="tx-slip-remove" data-kind="existing" data-idx="' + idx + '">' + _SLIP_REMOVE_ICON + '</button>' : '') + '</div>';
  }).join('') + _txSlipsNew.map(function (s, idx) {
    return '<div class="tx-slip-item"><img src="' + s.slip + '"/>' +
      '<button type="button" class="tx-slip-remove" data-kind="new" data-idx="' + idx + '">' + _SLIP_REMOVE_ICON + '</button></div>';
  }).join('') + _SLIP_ADD_ICON;
  $('#txSlipGallery').html(html);
}

// Slips upload to Drive (no Sheets cell cap), so step down quality only if still too large. Target ~670,000 base64 chars (~500KB decoded).
// Decodes the file once and reuses the bitmap across every downscale attempt
// - only the (cheap) canvas draw+encode step repeats, not the file read/decode.
function _compressSlipForUpload(file) {
  var attempts = [[1920, 0.85], [1600, 0.8], [1280, 0.72], [1024, 0.65], [800, 0.55]];
  return _loadImageFromFile(file).then(function (img) {
    var i = 0;
    function tryNext() {
      var dataUrl = _drawImageToDataUrl(img, attempts[i][0], attempts[i][1]);
      if (dataUrl.length < 670000 || i === attempts.length - 1) return dataUrl;
      i++;
      return tryNext();
    }
    return tryNext();
  });
}

// Shared catch-and-toast wrapper for the many gsc() call sites below.
async function _tryToast(fn) {
  try { await fn() } catch (e) { toast('' + e, 'err') }
}

// Optimistic apply: splice removed photos out and append temp placeholders
// for new ones (already real, compressed data: URIs - not spinners) so the
// gallery updates instantly. Returns snapshots the background sync needs to
// reconcile per-item (a failed upload/delete never affects its siblings).
function _applyTxSlipsOptimistic(keyId, removedIds, newSlips) {
  var current = SLIPS[keyId] || [];
  var removedSnapshot = current.filter(function (s) { return removedIds.indexOf(s.id) !== -1 });
  var kept = current.filter(function (s) { return removedIds.indexOf(s.id) === -1 });
  var tempNew = newSlips.map(function (s, i) {
    return { id: '_tmpSlip' + Date.now() + i + Math.random().toString(36).slice(2), slip: s.slip, slipHi: s.slip };
  });
  var merged = kept.concat(tempNew);
  if (merged.length) SLIPS[keyId] = merged; else delete SLIPS[keyId];
  return { removedSnapshot: removedSnapshot, tempNew: tempNew };
}

// Background: fires the real delete/upload RPCs and reconciles per item -
// one failure only reverts that one photo, never its siblings.
function _syncTxSlips(keyId, removedIds, removedSnapshot, newSlips, tempNew) {
  if (IS_SHARE) removedIds = []; // slip deletion is never allowed via a share link
  var deletes = removedIds.map(function (id) {
    return gsc('deleteTransactionSlip', TK, keyId, id)
      .catch(function (e) { return { success: false, error: '' + e } })
      .then(function (r) { r._removedId = id; return r });
  });
  var uploads = newSlips.map(function (s, i) {
    var call = IS_SHARE
      ? gsc('uploadTransactionSlipViaShare', SHARE_TOKEN, keyId, s.slip)
      : gsc('uploadTransactionSlip', TK, keyId, s.slip);
    return call.catch(function (e) { return { success: false, error: '' + e } })
      .then(function (r) { r._tempId = tempNew[i].id; return r });
  });
  if (!deletes.length && !uploads.length) return;
  Promise.all(deletes.concat(uploads)).then(function (results) {
    var failMsg = null;
    results.forEach(function (r) {
      if (r._removedId !== undefined) {
        if (!r.success) {
          failMsg = failMsg || r.error;
          var removedSlip = removedSnapshot.filter(function (s) { return s.id === r._removedId })[0];
          if (removedSlip) SLIPS[keyId] = (SLIPS[keyId] || []).concat(removedSlip);
        }
      } else {
        var idx = (SLIPS[keyId] || []).findIndex(function (s) { return s.id === r._tempId });
        if (r.success) {
          if (idx !== -1) SLIPS[keyId][idx] = { id: r.id, slip: r.slip, slipHi: r.slipHi };
        } else {
          failMsg = failMsg || r.error;
          if (idx !== -1) SLIPS[keyId].splice(idx, 1);
        }
      }
    });
    if (SLIPS[keyId] && !SLIPS[keyId].length) delete SLIPS[keyId];
    if (failMsg) toast(failMsg || 'Could not save one or more photos', 'err');
    renderDetails();
  });
}

function setSplitMode(m, prefill) {
  splitMode = m;
  $('#modeEq').toggleClass('on', m === 'equal');
  $('#modeCus').toggleClass('on', m === 'custom');
  $('#eqAmtG').toggle(m === 'equal');
  $('#eqSplitG').toggle(m === 'equal');
  $('#ppBox').hide();
  $('#cusG').toggle(m === 'custom');
  if (m === 'custom') renderCustomRows(prefill);
}

function renderCustomRows(prefill) {
  var html = $.map(FRIENDS, function (f) {
    var val = (prefill && prefill[f.id] !== undefined) ? parseFloat(prefill[f.id]).toFixed(2) : '';
    return '<div class="ca-row">' +
      '<div class="ca-av" style="background:' + avCol(f.name) + '">' + initials(f.name) + '</div>' +
      '<span class="ca-name">' + esc(f.name) + '</span>' +
      '<div class="ca-inp-wrap">' +
      '<span class="ca-inp-sym">฿</span>' +
      '<input class="ca-inp" type="number" data-id="' + esc(f.id) + '" placeholder="0" min="0" step="0.01" value="' + val + '"/>' +
      '</div>' +
      '</div>';
  }).join('');
  $('#cusRows').html(html);
  calcCustomTotal();
}

function calcCustomTotal() {
  var t = 0;
  $('#cusRows .ca-inp').each(function () { t += parseFloat($(this).val()) || 0 });
  $('#cusTotalVal').text('฿' + t.toFixed(2));
}

function calcPP() {
  var a = parseFloat($('#inpAmt').val()) || 0;
  var c = $('#inpShared input:checked').length;
  if (a > 0 && c > 0) {
    $('#ppAmt').text('฿' + (a / c).toFixed(2));
    $('#ppBox').show();
  } else {
    $('#ppBox').hide();
  }
}

// ── New Event / Rename Event ─────────────────
var _evIcon = '';

function _renderEvIconGrid(selected) {
  _evIcon = selected || '';
  var html = $.map(EMOJIS, function (em) {
    return '<button type="button" class="icon-pick' + (em === _evIcon ? ' on' : '') + '" data-icon="' + em + '">' + em + '</button>';
  }).join('');
  $('#evIconGrid').html(html);
}

function openNewEventSheet() {
  _evMode = 'create'; _evEditId = null;
  $('#evTitle').text('New Event');
  $('#btnSubmitEvent').text('Next');
  $('#btnEvManageFriends').hide();
  $('#inpEv').val('');
  _renderEvIconGrid('');
  openSheet('shEvent');
}

function openRenameEventSheet(ev) {
  _evMode = 'rename'; _evEditId = ev.id;
  $('#evTitle').text('Edit Event');
  $('#btnSubmitEvent').text('Save');
  $('#btnEvManageFriends').show();
  $('#inpEv').val(ev.name);
  _renderEvIconGrid(ev.icon || evEmoji(ev.name));
  openSheet('shEvent');
}

function submitEvent() {
  var n = $('#inpEv').val().trim();
  if (!n) { toast('Please enter an event name', 'warn'); return }

  if (_evMode === 'rename') {
    var editId = _evEditId, icon = _evIcon;
    closeSheets();
    var idxNow = EVENTS.findIndex(function (e) { return e.id === editId });
    var oldEv = idxNow !== -1 ? { name: EVENTS[idxNow].name, icon: EVENTS[idxNow].icon } : null;

    function _applyEventRename(name, ic) {
      var i = EVENTS.findIndex(function (e) { return e.id === editId });
      if (i !== -1) { EVENTS[i].name = name; EVENTS[i].icon = ic }
      refreshEventsUI();
      if (CUR_EV && CUR_EV.id === editId) {
        CUR_EV.name = name; CUR_EV.icon = ic;
        $('#hdrTitle').text(name);
        $('#detailBannerName').text(name);
        $('#detailEmoji').text(ic || evEmoji(name));
        $('#detailBanner').css('background', bannerGrad(name));
      }
    }

    _applyEventRename(n, icon);
    toast('Event saved');
    bgSync(
      function () { return gsc('renameEvent', TK, editId, n, icon) },
      function () { if (oldEv) _applyEventRename(oldEv.name, oldEv.icon) },
      function (r) { _applyEventRename(r.name, r.icon) }
    );
    return;
  }

  // Create: uses a temp id since the friend-picker sheet that opens next needs
  // *some* id to reference before the server responds. getEventFriendsData
  // enforces server-side event ownership, so it can't be opened against a
  // temp id - that sheet's open is deferred until the real id resolves
  // (the only non-instant part of this flow; the Home card itself is instant).
  var tempEventId = '_tmp' + Date.now() + Math.random().toString(36).slice(2);
  var tempEvent = { id: tempEventId, name: n, icon: icon, accountId: ME.id, createdAt: new Date().toISOString(), settled: true };
  EVENTS.unshift(tempEvent);
  refreshEventsUI();
  toast('Event created! 🎉');
  bgSync(
    function () { return gsc('addEvent', TK, n, icon) },
    function () {
      EVENTS = EVENTS.filter(function (e) { return e.id !== tempEventId });
      refreshEventsUI();
    },
    function (r) {
      var i = EVENTS.findIndex(function (e) { return e.id === tempEventId });
      if (i !== -1) { r.event.settled = true; EVENTS[i] = r.event }
      openEventFriendsSheet(r.event.id, 'create', r.event);
    }
  );
}

// ── Add / Manage Event Friends ────────────────
async function openEventFriendsSheet(eventId, mode, pendingEvent) {
  _efEventId = eventId;
  _efMode = mode;
  _pendingNewEvent = pendingEvent || null;
  $('#efTitle').text(mode === 'create' ? 'Add Friends' : 'Manage Friends');
  $('#btnEfDone').text(mode === 'create' ? 'Create Event' : 'Save');
  $('#inpEfNew').val('');
  $('#efList').html(skeletonHtml(3, 'fr'));
  openSheet('shEventFriends');
  await _tryToast(async function () {
    var r = await gsc('getEventFriendsData', TK, eventId);
    if (r.success) {
      var linkedIds = r.linkedFriends.map(function (f) { return f.id });
      renderEfList(r.allFriends, linkedIds);
    } else toast(r.error, 'err');
  });
}

// Checkbox-row markup shared by the friend checklists (event-friends list, tx friend picker).
function _ckRowHtml(id, name, checked) {
  return '<div class="ck-row' + (checked ? ' checked' : '') + '" data-id="' + esc(id) + '">' +
    '<input type="checkbox" value="' + esc(id) + '"' + (checked ? ' checked' : '') + '/>' +
    '<label>' + esc(name) + '</label>' +
    '</div>';
}

function _toggleCkRow($row) {
  var inp = $row.find('input');
  inp.prop('checked', !inp.prop('checked'));
  $row.toggleClass('checked', inp.prop('checked'));
}

function _setAllCk(checked) {
  $('#inpShared .ck-row').each(function () {
    $(this).find('input').prop('checked', checked);
    $(this).toggleClass('checked', checked);
  });
  calcPP();
}

function renderEfList(allFriends, linkedIds) {
  if (!allFriends.length) {
    $('#efList').html('<div class="empty"><div class="empty-t">No friends yet</div><div class="empty-s">Add one above</div></div>');
    return;
  }
  var html = $.map(allFriends, function (f) {
    return _ckRowHtml(f.id, f.name, linkedIds.indexOf(f.id) !== -1);
  }).join('');
  $('#efList').html(html);
}

// Redraws whatever currently depends on FRIENDS after a change - the
// transaction list's payer/chip names, and the Add/Edit Transaction picker
// if it happens to be open concurrently.
function _onFriendsChanged() {
  renderDetails();
  if ($('#shTx').hasClass('on')) buildTxFriendPickers(FRIENDS.map(function (f) { return f.id }));
}

// In-flight submitEfAddNew() calls, keyed by their temp id's row. submitEfDone()
// awaits these first so a fast "add then Done" never submits a temp id that
// the server would silently drop (setEventFriends filters unknown ids).
var _efPendingAdds = [];

function submitEfAddNew() {
  var n = $('#inpEfNew').val().trim();
  if (!n) return;
  $('#inpEfNew').val('');
  var eventId = _efEventId;
  var tempId = '_tmpFriend' + Date.now() + Math.random().toString(36).slice(2);
  var $existing = $('#efList .ck-row').filter(function () {
    return $(this).find('label').text().toLowerCase() === n.toLowerCase();
  }).first();
  var matchedExisting = $existing.length > 0;
  var wasChecked = matchedExisting && $existing.hasClass('checked');
  if (matchedExisting) {
    $existing.addClass('checked').find('input').prop('checked', true);
  } else {
    $('#efList .empty').remove();
    $('#efList').append(_ckRowHtml(tempId, n, true));
  }

  var p = bgSync(
    function () { return gsc('addFriendToEvent', TK, eventId, n) },
    function () {
      if (matchedExisting) { if (!wasChecked) { $existing.removeClass('checked').find('input').prop('checked', false) } }
      else { $('#efList .ck-row[data-id="' + tempId + '"]').remove() }
    },
    function (r) {
      if (!matchedExisting) {
        var $row = $('#efList .ck-row[data-id="' + tempId + '"]');
        $row.attr('data-id', r.friend.id).find('input').val(r.friend.id);
      }
    }
  );
  _efPendingAdds.push(p);
  p.then(function () { _efPendingAdds.splice(_efPendingAdds.indexOf(p), 1) });
}

async function submitEfDone() {
  if (_efPendingAdds.length) await Promise.all(_efPendingAdds);
  var ids = $('#efList .ck-row input:checked').map(function () { return $(this).val() }).get();
  var mode = _efMode, eventId = _efEventId, pendingEvent = _pendingNewEvent;
  var isOpenEvent = CUR_EV && CUR_EV.id === eventId;
  closeSheets();

  var oldFriends = FRIENDS.slice();
  var predicted = $('#efList .ck-row.checked').map(function () {
    return { id: $(this).attr('data-id'), name: $(this).find('label').text() };
  }).get();
  if (mode === 'create' || isOpenEvent) { FRIENDS = predicted; _onFriendsChanged() }

  bgSync(
    function () { return gsc('setEventFriends', TK, eventId, ids) },
    function () { if (mode === 'create' || isOpenEvent) { FRIENDS = oldFriends; _onFriendsChanged() } },
    function (r) {
      if (r.blocked && r.blocked.length) {
        toast(r.blocked.map(function (b) { return b.name }).join(', ') + ' has transactions here and can\'t be removed', 'warn');
      }
      if (mode === 'create') {
        FRIENDS = r.friends;
        if (pendingEvent) openDetail(pendingEvent);
      } else if (isOpenEvent) {
        FRIENDS = r.friends;
        _onFriendsChanged();
      }
    }
  );
}

// ── FAB ────────────────────────────────────────
function buildTxFriendPickers(checkedIds) {
  var payerHtml = $.map(FRIENDS, function (f) {
    return '<option value="' + esc(f.id) + '">' + esc(f.name) + '</option>';
  }).join('');
  var $payer = $('#inpPayer');
  if ($payer.hasClass('select2-hidden-accessible')) $payer.select2('destroy');
  $payer.html(payerHtml).select2({
    minimumResultsForSearch: Infinity,
    dropdownParent: $(document.body),
    width: '100%'
  });
  var ckHtml = $.map(FRIENDS, function (f) {
    return _ckRowHtml(f.id, f.name, checkedIds.indexOf(f.id) !== -1);
  }).join('');
  $('#inpShared').html(ckHtml);
}

function handleFab() {
  if (IS_SHARE && !PERM.canAdd) return; // defense-in-depth - FAB is already hidden in this case
  if (CUR_EV) {
    if (!FRIENDS.length) {
      toast('Add at least one friend to this event first', 'warn');
      openEventFriendsSheet(CUR_EV.id, 'manage');
      return;
    }
    _editTxId = null;
    $('#txTitle').text('Add Transaction');
    $('#btnSubmitTx').text('Add Transaction');
    $('#inpDesc').val('');
    $('#inpAmt').val('');
    $('#ppBox').hide();
    setSplitMode('equal');
    buildTxFriendPickers(FRIENDS.map(function (f) { return f.id }));
    _txSlipsExisting = []; _txSlipsRemoved = []; _txSlipsNew = [];
    _renderTxSlipGallery();
    openSheet('shTx');
  } else {
    openNewEventSheet();
  }
}

function openEditTxSheet(tid) {
  if (IS_SHARE && !PERM.canEdit) return; // defense-in-depth - the Edit icon is already hidden in this case
  var rows = DETAILS.filter(function (d) { return d.transactionId === tid });
  if (!rows.length) return;
  var f = rows[0];
  var friendIds = rows.map(function (r) { return r.friendId });
  var isCustom = $.grep(rows, function (r) {
    return Math.abs(parseFloat(r.amount) - parseFloat(rows[0].amount)) > 0.01;
  }).length > 0;

  _editTxId = tid;
  $('#txTitle').text('Edit Transaction');
  $('#btnSubmitTx').text('Save Changes');
  $('#inpDesc').val(f.description || '');
  buildTxFriendPickers(friendIds);
  $('#inpPayer').val(f.payId).trigger('change.select2');

  if (isCustom) {
    var prefill = {};
    rows.forEach(function (r) { prefill[r.friendId] = r.amount });
    setSplitMode('custom', prefill);
  } else {
    setSplitMode('equal');
    $('#inpAmt').val(parseFloat(f.totalAmount));
    calcPP();
  }
  _txSlipsExisting = (SLIPS[tid] || []).slice();
  _txSlipsRemoved = []; _txSlipsNew = [];
  _renderTxSlipGallery();
  openSheet('shTx');
  _resolveExistingSlips(tid);
}

// Existing slips may be an unresolved Drive fileId (see _resolveSlipSrc); swap in real
// thumbnails once resolved. Guarded by _editTxId in case the user reopens a different tx first.
async function _resolveExistingSlips(tid) {
  var resolved = await Promise.all(_txSlipsExisting.map(function (s) {
    return _resolveSlipSrc(s.slip).then(function (src) { return { id: s.id, slip: src, slipHi: s.slipHi } });
  }));
  if (_editTxId === tid) { _txSlipsExisting = resolved; _renderTxSlipGallery() }
}

function _buildLocalDetailRows(transactionId, payId, friendIds, totalAmount, description, customAmounts, createdAt) {
  var perPerson = totalAmount / friendIds.length;
  return friendIds.map(function (fid) {
    var amount = (customAmounts && customAmounts[fid] !== undefined) ? parseFloat(customAmounts[fid]) : perPerson;
    return { id: transactionId + '_' + fid, eventId: CUR_EV.id, transactionId: transactionId,
      payId: payId, friendId: fid, amount: amount, totalAmount: totalAmount, description: description, createdAt: createdAt };
  });
}

function submitTx() {
  var desc = $('#inpDesc').val().trim();
  var pay  = $('#inpPayer').val();
  if (!desc) { toast('Please enter a description', 'warn'); return }
  var friendIds, totalAmount, customAmounts = null;
  if (splitMode === 'equal') {
    var amt = parseFloat($('#inpAmt').val());
    var sh  = $('#inpShared input:checked').map(function () { return $(this).val() }).get();
    if (!amt || amt <= 0) { toast('Please enter a valid amount', 'warn'); return }
    if (!sh.length) { toast('Select at least one person', 'warn'); return }
    friendIds = sh; totalAmount = amt;
  } else {
    friendIds = []; customAmounts = {}; totalAmount = 0;
    $('#cusRows .ca-inp').each(function () {
      var a = parseFloat($(this).val()) || 0;
      if (a > 0) {
        var id = $(this).data('id');
        friendIds.push(id); customAmounts[id] = a; totalAmount += a;
      }
    });
    if (!friendIds.length) { toast('Enter an amount for at least 1 person', 'warn'); return }
  }
  var editId = _editTxId;
  var slipsRemoved = _txSlipsRemoved.slice();
  var slipsNew = _txSlipsNew.slice();
  closeSheets();

  // Optimistic: show the change immediately from local data, save in the
  // background, roll back + toast only if the save actually fails.
  if (editId) {
    var oldRows = DETAILS.filter(function (d) { return d.transactionId === editId });
    var createdAt = oldRows.length ? oldRows[0].createdAt : new Date().toISOString();
    DETAILS = DETAILS.filter(function (d) { return d.transactionId !== editId })
      .concat(_buildLocalDetailRows(editId, pay, friendIds, totalAmount, desc, customAmounts, createdAt));
    _recomputeSettlementsLocal();
    var slipSnap = _applyTxSlipsOptimistic(editId, slipsRemoved, slipsNew);
    renderDetails();
    toast('Transaction updated');
    // Slips are a separate server resource from the tx edit - fired
    // independently, not rolled back if the tx-level edit below fails.
    _syncTxSlips(editId, slipsRemoved, slipSnap.removedSnapshot, slipsNew, slipSnap.tempNew);
    bgSync(
      function () {
        return IS_SHARE
          ? gsc('updateDetailViaShare', SHARE_TOKEN, editId, pay, friendIds, totalAmount, desc, customAmounts)
          : gsc('updateDetail', TK, editId, pay, friendIds, totalAmount, desc, customAmounts);
      },
      function () {
        DETAILS = DETAILS.filter(function (d) { return d.transactionId !== editId }).concat(oldRows);
        _recomputeSettlementsLocal();
        renderDetails();
      }
    );
  } else {
    var tempId = '_tmp' + Date.now() + Math.random().toString(36).slice(2);
    DETAILS = DETAILS.concat(_buildLocalDetailRows(tempId, pay, friendIds, totalAmount, desc, customAmounts, new Date().toISOString()));
    _recomputeSettlementsLocal();
    var createSlipSnap = _applyTxSlipsOptimistic(tempId, [], slipsNew);
    renderDetails();
    toast('Transaction added! 💸');
    bgSync(
      function () {
        return IS_SHARE
          ? gsc('addDetailViaShare', SHARE_TOKEN, pay, friendIds, totalAmount, desc, customAmounts)
          : gsc('addDetail', TK, CUR_EV.id, pay, friendIds, totalAmount, desc, customAmounts);
      },
      function () {
        DETAILS = DETAILS.filter(function (d) { return d.transactionId !== tempId });
        _recomputeSettlementsLocal();
        delete SLIPS[tempId];
        renderDetails();
      },
      function (r) {
        // Swap the temp id for the real one so later edit/delete/slip actions target the right row.
        DETAILS.forEach(function (d) { if (d.transactionId === tempId) { d.transactionId = r.transactionId; d.id = r.transactionId + '_' + d.friendId } });
        if (SLIPS[tempId]) { SLIPS[r.transactionId] = SLIPS[tempId]; delete SLIPS[tempId] }
        renderDetails();
        // The real transactionId only exists now - the actual upload RPCs were deferred until this point.
        _syncTxSlips(r.transactionId, [], [], slipsNew, createSlipSnap.tempNew);
      }
    );
  }
  _editTxId = null;
  _txSlipsExisting = []; _txSlipsRemoved = []; _txSlipsNew = [];
}

function askDel(type, id, name) {
  if (type === 'tx' && IS_SHARE) return; // defense-in-depth - delete is never allowed via a share link, button is already hidden
  var titles = {
    event:   'Delete Event?',
    tx:      'Delete Transaction?',
    account: 'Delete Account?'
  };
  var msgs = {
    event:   'Delete "' + name + '"? All transactions will be permanently removed.',
    tx:      'Delete this transaction? This cannot be undone.',
    account: 'Delete account "' + name + '"?'
  };
  $('#cfTitle').text(titles[type] || 'Delete?');
  $('#cfMsg').text(msgs[type] || 'Are you sure?');
  _del = { type: type, id: id };
  openSheet('shConfirm');
}

// ── My Profile ─────────────────────────────────
var _pfPhotoPending; // undefined = untouched (don't send); '' = removed; string = new photo

function _renderPfAvatar(name, photo) {
  var $el = $('#pfAvatar');
  if (photo) $el.css('background', 'url(' + photo + ') center/cover no-repeat').text('');
  else $el.css('background', avCol(name)).text(initials(name));
}

// Reads + decodes a file into an <img> once, so repeated resize attempts
// (see _compressSlipForUpload) don't pay for a fresh FileReader+decode each time.
function _loadImageFromFile(file) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () { resolve(img) };
      img.onerror = function () { reject(new Error('Could not read image')) };
      img.src = e.target.result;
    };
    reader.onerror = function () { reject(new Error('Could not read file')) };
    reader.readAsDataURL(file);
  });
}

// Synchronous: draws an already-decoded image to a canvas at the given max
// dimension and re-encodes as JPEG so the result fits well under the ~50k-char
// Sheets cell cap.
function _drawImageToDataUrl(img, maxSize, quality) {
  var scale = Math.min(1, maxSize / Math.max(img.width, img.height));
  var w = Math.max(1, Math.round(img.width * scale));
  var h = Math.max(1, Math.round(img.height * scale));
  var canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(img, 0, 0, w, h);
  return canvas.toDataURL('image/jpeg', quality);
}

// Single-shot convenience wrapper (profile photo picker - no retry loop needed).
function _resizeImageFile(file, maxSize, quality) {
  return _loadImageFromFile(file).then(function (img) { return _drawImageToDataUrl(img, maxSize, quality) });
}

var _pfPwPolicy = null;

async function openProfileSheet() {
  openSheet('shProfile');
  _pfPhotoPending = undefined;
  $('#inpPfCurPw, #inpPfNewPw').val('');
  gsc('getPasswordPolicy').then(function (p) {
    _pfPwPolicy = p;
    renderPwChecklist('pfPwChecklist', p);
  }).catch(function () {});
  await _tryToast(async function () {
    var r = await gsc('getMyProfile', TK);
    if (r.success) {
      $('#inpPfName').val(r.displayName);
      $('#inpPfUser').val(r.username);
      _renderPfAvatar(r.displayName, r.photo);
      $('#pfRemovePhotoRow').toggle(!!r.photo);
    } else toast(r.error, 'err');
  });
}

function submitProfile() {
  var name = $('#inpPfName').val().trim();
  if (!name) { toast('Please enter a name', 'warn'); return }
  var photoPending = _pfPhotoPending;
  var oldME = ME, oldMePhoto = ME_PHOTO, oldStorageVal = _authStore().getItem('su_me');
  var oldHeroName = $('#heroName').text();

  ME = Object.assign({}, ME, { displayName: name });
  _authStore().setItem('su_me', JSON.stringify(ME));
  $('#heroName').text(name);
  _renderHdrAvatar(name, photoPending !== undefined ? photoPending : ME_PHOTO);
  toast('Profile updated');
  closeSheets();

  bgSync(
    function () { return gsc('updateProfile', TK, name, photoPending) },
    function () {
      ME = oldME;
      _authStore().setItem('su_me', oldStorageVal);
      $('#heroName').text(oldHeroName);
      _renderHdrAvatar(oldME.displayName || oldME.username, oldMePhoto);
    },
    function (r) {
      ME = r.user;
      _authStore().setItem('su_me', JSON.stringify(ME));
    }
  );
}

function submitChangePassword() {
  var cur = $('#inpPfCurPw').val();
  var next = $('#inpPfNewPw').val();
  if (!cur || !next) { toast('Please fill in both password fields', 'warn'); return }
  $('#inpPfCurPw, #inpPfNewPw').val('');
  toast('Password changed');
  bgSync(
    function () { return gsc('changePassword', TK, cur, next) },
    function () { $('#inpPfCurPw').val(cur); $('#inpPfNewPw').val(next) }
  );
}

$(function () {
  // Close buttons
  $('#shEventClose, #shEfClose, #shTxClose, #shShareClose, #cfCancel, #logoutCancel, ' +
    '#shAccountClose, #shProfileClose, #shUserEditClose, #shSlipViewClose').on('click', closeSheets);

  // Transaction slip
  $('#txSlipGallery').on('click', '#btnTxSlipAdd', function () { $('#inpTxSlip').trigger('click') });
  $('#txSlipGallery').on('click', '.tx-slip-remove', function () {
    var kind = $(this).data('kind'), idx = $(this).data('idx');
    if (kind === 'existing') {
      _txSlipsRemoved.push(_txSlipsExisting[idx].id);
      _txSlipsExisting.splice(idx, 1);
    } else {
      _txSlipsNew.splice(idx, 1);
    }
    _renderTxSlipGallery();
  });
  $('#inpTxSlip').on('change', async function () {
    var file = this.files && this.files[0];
    this.value = '';
    if (!file) return;
    if (file.type.indexOf('image/') !== 0) { toast('Please choose an image file', 'warn'); return }
    try {
      var slip = await _compressSlipForUpload(file);
      _txSlipsNew.push({ slip: slip });
      _renderTxSlipGallery();
    } catch (e) { toast('Could not process that image', 'err') }
  });

  // Account menu
  $('#btnOpenProfile').on('click', openProfileSheet);
  $('#btnOpenLogout').on('click', function () { openSheet('shLogout') });

  // My Profile
  $('#btnPfPhoto').on('click', function () { $('#inpPfPhoto').trigger('click') });
  $('#inpPfPhoto').on('change', async function () {
    var file = this.files && this.files[0];
    this.value = '';
    if (!file) return;
    if (file.type.indexOf('image/') !== 0) { toast('Please choose an image file', 'warn'); return }
    try {
      var dataUrl = await _resizeImageFile(file, 160, 0.72);
      _pfPhotoPending = dataUrl;
      _renderPfAvatar($('#inpPfName').val(), dataUrl);
      $('#pfRemovePhotoRow').show();
    } catch (e) { toast('Could not process that image', 'err') }
  });
  $('#btnPfRemovePhoto').on('click', function (e) {
    e.preventDefault();
    _pfPhotoPending = '';
    _renderPfAvatar($('#inpPfName').val(), '');
    $('#pfRemovePhotoRow').hide();
  });
  $('#btnPfSave').on('click', submitProfile);
  $('#btnPfChangePw').on('click', submitChangePassword);
  $('#inpPfNewPw').on('input', function () {
    if (_pfPwPolicy) updatePwChecklist('pfPwChecklist', _pfPwPolicy, $(this).val());
  });

  $('#evIconGrid').on('click', '.icon-pick', function () {
    $('#evIconGrid .icon-pick').removeClass('on');
    $(this).addClass('on');
    _evIcon = $(this).data('icon');
  });
  $('#btnEvManageFriends').on('click', function () {
    if (_evEditId) openEventFriendsSheet(_evEditId, 'manage');
  });

  // Submit buttons
  $('#btnSubmitEvent').on('click', submitEvent);
  $('#btnEfAddNew').on('click', submitEfAddNew);
  $('#btnEfDone').on('click', submitEfDone);
  $('#btnSubmitTx').on('click', submitTx);

  // Split mode toggle
  $('#modeEq').on('click', function () { setSplitMode('equal') });
  $('#modeCus').on('click', function () { setSplitMode('custom') });

  // Equal mode: checkbox toggle
  $('#inpShared').on('click', '.ck-row', function () { _toggleCkRow($(this)); calcPP() });

  // Event-friends checklist: local toggle only, submitted in one batch by Done
  $('#efList').on('click', '.ck-row', function () { _toggleCkRow($(this)) });

  // Equal mode: amount input
  $('#inpAmt').on('input', calcPP);
  $('#inpPayer').on('change', calcPP);

  // Custom mode: amount inputs (delegated since rendered dynamically)
  $('#cusRows').on('input', '.ca-inp', calcCustomTotal);

  // Select all / clear
  $('#btnCkAll').on('click', function () { _setAllCk(true) });
  $('#btnCkNone').on('click', function () { _setAllCk(false) });

  // Confirm delete
  $('#cfOk').on('click', async function () {
    if (!_del) return;
    var t = _del.type, id = _del.id; _del = null; closeSheets();
    if (t === 'tx' && IS_SHARE) return; // defense-in-depth - delete is never allowed via a share link

    // Optimistic: remove from the list immediately, save in the background,
    // put it back + toast only if the delete actually fails.
    if (t === 'tx') {
      if (!CUR_EV) return;
      var removedRows = DETAILS.filter(function (d) { return d.transactionId === id });
      DETAILS = DETAILS.filter(function (d) { return d.transactionId !== id });
      _recomputeSettlementsLocal();
      renderDetails();
      var r = await gsc('deleteDetail', TK, id).catch(function (e) { return { success: false, error: '' + e } });
      if (r.success) {
        toast('Deleted');
      } else {
        DETAILS = DETAILS.concat(removedRows);
        _recomputeSettlementsLocal();
        renderDetails();
        toast(r.error, 'err');
      }
      return;
    }

    if (t === 'event') {
      var evIdx = EVENTS.findIndex(function (e) { return e.id === id });
      var removedEvent = evIdx !== -1 ? EVENTS[evIdx] : null;
      var wasCur = CUR_EV && CUR_EV.id === id;
      var savedDetails, savedSlips, savedSettlements;
      if (wasCur) { savedDetails = DETAILS; savedSlips = SLIPS; savedSettlements = SETTLEMENTS }
      if (evIdx !== -1) EVENTS.splice(evIdx, 1);
      refreshEventsUI();
      toast('Deleted');
      if (wasCur) { goBack(); DETAILS = []; SLIPS = {}; SETTLEMENTS = null }
      bgSync(
        function () { return gsc('deleteEvent', TK, id) },
        function () {
          if (removedEvent && !EVENTS.some(function (e) { return e.id === id })) {
            EVENTS.splice(Math.min(evIdx, EVENTS.length), 0, removedEvent);
          }
          refreshEventsUI();
          if (wasCur) { DETAILS = savedDetails; SLIPS = savedSlips; SETTLEMENTS = savedSettlements; openDetail(removedEvent) }
        }
      );
    } else if (t === 'account') {
      var acctIdx = ACCOUNTS.findIndex(function (a) { return a.id === id });
      var removedAcct = acctIdx !== -1 ? ACCOUNTS[acctIdx] : null;
      if (acctIdx !== -1) ACCOUNTS.splice(acctIdx, 1);
      renderAccounts();
      toast('Deleted');
      bgSync(
        function () { return gsc('deleteAccount', TK, id) },
        function () {
          if (removedAcct && !ACCOUNTS.some(function (a) { return a.id === id })) {
            ACCOUNTS.splice(Math.min(acctIdx, ACCOUNTS.length), 0, removedAcct);
          }
          renderAccounts();
        }
      );
    }
  });

  // Logout confirm
  $('#btnDoLogout').on('click', doLogout);

  // Enter key shortcuts
  $('#inpEv').on('keydown', function (e) { if (e.key === 'Enter') submitEvent() });
  $('#inpEfNew').on('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submitEfAddNew() } });
});
</script>
