<script>
var splitMode = 'equal';
var _del = null;
var _evMode = 'create';   // 'create' | 'rename'
var _evEditId = null;
var _efEventId = null;    // 'create' | 'manage'
var _efMode = 'manage';
var _pendingNewEvent = null;
var _editTxId = null;     // set while editing an existing transaction, else null
var _txSlipsExisting = []; // [{id, slip, slipHi}] already saved on the server (only when editing)
var _txSlipsRemoved  = []; // ids of existing photos marked for deletion on save
var _txSlipsNew       = []; // [{slip, slipHi}] picked but not yet uploaded

var _SLIP_ADD_ICON = '<div class="tx-slip-add" id="btnTxSlipAdd"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></div>';
var _SLIP_REMOVE_ICON = '<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>';

function _renderTxSlipGallery() {
  // Removing an already-saved photo is a delete, never allowed via a share
  // link (even an editable one) - only newly-picked, not-yet-uploaded photos
  // stay removable in share mode.
  var canRemoveExisting = !IS_SHARE;
  var html = _txSlipsExisting.map(function (s, idx) {
    return '<div class="tx-slip-item"><img src="' + s.slip + '"/>' +
      (canRemoveExisting ? '<button type="button" class="tx-slip-remove" data-kind="existing" data-idx="' + idx + '">' + _SLIP_REMOVE_ICON + '</button>' : '') + '</div>';
  }).join('') + _txSlipsNew.map(function (s, idx) {
    return '<div class="tx-slip-item"><img src="' + s.slip + '"/>' +
      '<button type="button" class="tx-slip-remove" data-kind="new" data-idx="' + idx + '">' + _SLIP_REMOVE_ICON + '</button></div>';
  }).join('') + _SLIP_ADD_ICON;
  $('#txSlipGallery').html(html);
}

// Slips upload to Drive now (no more ~50k-character Sheets cell cap), so a
// single reasonably high-quality copy is enough - step down only if the
// photo is still large after the first attempt. Target ~670,000 base64
// characters (~500KB of actual image data once decoded).
function _compressSlipForUpload(file) {
  var attempts = [[1920, 0.85], [1600, 0.8], [1280, 0.72], [1024, 0.65], [800, 0.55]];
  var i = 0;
  function tryNext() {
    return _resizeImageFile(file, attempts[i][0], attempts[i][1]).then(function (dataUrl) {
      if (dataUrl.length < 670000 || i === attempts.length - 1) return dataUrl;
      i++;
      return tryNext();
    });
  }
  return tryNext();
}

async function _saveTxSlipsIfNeeded(transactionId, removedIds, newSlips) {
  if (IS_SHARE) removedIds = []; // slip deletion is never allowed via a share link (server function no longer exists either)
  if (!removedIds.length && !newSlips.length) return;
  try {
    if (removedIds.length) await Promise.all(removedIds.map(function (id) { return gsc('deleteTransactionSlip', TK, transactionId, id) }));
    var results = await Promise.all(newSlips.map(function (s) {
      return IS_SHARE
        ? gsc('uploadTransactionSlipViaShare', SHARE_TOKEN, transactionId, s.slip)
        : gsc('uploadTransactionSlip', TK, transactionId, s.slip);
    }));
    // Use the URLs the server/Drive actually stored, not the client's
    // pre-upload copy, so the gallery matches what's really saved.
    var added = results.map(function (r) {
      return r.success ? { id: r.id, slip: r.slip, slipHi: r.slipHi } : null;
    }).filter(Boolean);
    // Failed uploads (expired session, or still-too-large after compression)
    // used to be dropped silently here - surface them instead.
    var failures = results.filter(function (r) { return !r.success });
    if (failures.length) toast(failures[0].error || 'Could not upload one or more photos', 'err');
    var current = (SLIPS[transactionId] || [])
      .filter(function (s) { return removedIds.indexOf(s.id) === -1 })
      .concat(added);
    if (current.length) SLIPS[transactionId] = current; else delete SLIPS[transactionId];
    renderDetails();
  } catch (e) { toast('' + e, 'err') }
}

function setSplitMode(m, prefill) {
  splitMode = m;
  $('#modeEq').toggleClass('on', m === 'equal');
  $('#modeCus').toggleClass('on', m === 'custom');
  $('#eqAmtG').toggle(m === 'equal');
  $('#eqSplitG').toggle(m === 'equal');
  $('#ppBox').hide();
  $('#cusG').toggle(m === 'custom');
  if (m === 'custom') renderCustomRows(prefill);
}

function renderCustomRows(prefill) {
  var html = $.map(FRIENDS, function (f) {
    var val = (prefill && prefill[f.id] !== undefined) ? parseFloat(prefill[f.id]).toFixed(2) : '';
    return '<div class="ca-row">' +
      '<div class="ca-av" style="background:' + avCol(f.name) + '">' + initials(f.name) + '</div>' +
      '<span class="ca-name">' + esc(f.name) + '</span>' +
      '<div class="ca-inp-wrap">' +
      '<span class="ca-inp-sym">฿</span>' +
      '<input class="ca-inp" type="number" data-id="' + esc(f.id) + '" placeholder="0" min="0" step="0.01" value="' + val + '"/>' +
      '</div>' +
      '</div>';
  }).join('');
  $('#cusRows').html(html);
  calcCustomTotal();
}

function calcCustomTotal() {
  var t = 0;
  $('#cusRows .ca-inp').each(function () { t += parseFloat($(this).val()) || 0 });
  $('#cusTotalVal').text('฿' + t.toFixed(2));
}

function calcPP() {
  var a = parseFloat($('#inpAmt').val()) || 0;
  var c = $('#inpShared input:checked').length;
  if (a > 0 && c > 0) {
    $('#ppAmt').text('฿' + (a / c).toFixed(2));
    $('#ppBox').show();
  } else {
    $('#ppBox').hide();
  }
}

// ── New Event / Rename Event ─────────────────
var _evIcon = '';

function _renderEvIconGrid(selected) {
  _evIcon = selected || '';
  var html = $.map(EMOJIS, function (em) {
    return '<button type="button" class="icon-pick' + (em === _evIcon ? ' on' : '') + '" data-icon="' + em + '">' + em + '</button>';
  }).join('');
  $('#evIconGrid').html(html);
}

function openNewEventSheet() {
  _evMode = 'create'; _evEditId = null;
  $('#evTitle').text('New Event');
  $('#btnSubmitEvent').text('Next');
  $('#btnEvManageFriends').hide();
  $('#inpEv').val('');
  _renderEvIconGrid('');
  openSheet('shEvent');
}

function openRenameEventSheet(ev) {
  _evMode = 'rename'; _evEditId = ev.id;
  $('#evTitle').text('Edit Event');
  $('#btnSubmitEvent').text('Save');
  $('#btnEvManageFriends').show();
  $('#inpEv').val(ev.name);
  _renderEvIconGrid(ev.icon || evEmoji(ev.name));
  openSheet('shEvent');
}

async function submitEvent() {
  var n = $('#inpEv').val().trim();
  if (!n) { toast('Please enter an event name', 'warn'); return }

  if (_evMode === 'rename') {
    closeSheets();
    try {
      var r = await gsc('renameEvent', TK, _evEditId, n, _evIcon);
      if (r.success) {
        toast('Event saved');
        var idx = -1;
        for (var i = 0; i < EVENTS.length; i++) { if (EVENTS[i].id === _evEditId) { idx = i; break } }
        if (idx !== -1) { EVENTS[idx].name = r.name; EVENTS[idx].icon = r.icon }
        refreshEventsUI();
        if (CUR_EV && CUR_EV.id === _evEditId) {
          CUR_EV.name = r.name;
          CUR_EV.icon = r.icon;
          $('#hdrTitle').text(r.name);
          $('#detailBannerName').text(r.name);
          $('#detailEmoji').text(r.icon || evEmoji(r.name));
          $('#detailBanner').css('background', bannerGrad(r.name));
        }
      } else toast(r.error, 'err');
    } catch (e) { toast('' + e, 'err') }
    return;
  }

  try {
    var r = await gsc('addEvent', TK, n, _evIcon);
    if (r.success) {
      r.event.settled = true; // brand-new event has no transactions yet
      EVENTS.unshift(r.event);
      refreshEventsUI();
      openEventFriendsSheet(r.event.id, 'create', r.event);
    } else toast(r.error, 'err');
  } catch (e) { toast('' + e, 'err') }
}

// ── Add / Manage Event Friends ────────────────
async function openEventFriendsSheet(eventId, mode, pendingEvent) {
  _efEventId = eventId;
  _efMode = mode;
  _pendingNewEvent = pendingEvent || null;
  $('#efTitle').text(mode === 'create' ? 'Add Friends' : 'Manage Friends');
  $('#btnEfDone').text(mode === 'create' ? 'Create Event' : 'Save');
  $('#inpEfNew').val('');
  $('#efList').html(skeletonHtml(3, 'fr'));
  openSheet('shEventFriends');
  try {
    var r = await gsc('getEventFriendsData', TK, eventId);
    if (r.success) {
      var linkedIds = r.linkedFriends.map(function (f) { return f.id });
      renderEfList(r.allFriends, linkedIds);
    } else toast(r.error, 'err');
  } catch (e) { toast('' + e, 'err') }
}

function renderEfList(allFriends, linkedIds) {
  if (!allFriends.length) {
    $('#efList').html('<div class="empty"><div class="empty-t">No friends yet</div><div class="empty-s">Add one above</div></div>');
    return;
  }
  var html = $.map(allFriends, function (f) {
    var checked = linkedIds.indexOf(f.id) !== -1;
    return '<div class="ck-row' + (checked ? ' checked' : '') + '" data-id="' + esc(f.id) + '">' +
      '<input type="checkbox" value="' + esc(f.id) + '"' + (checked ? ' checked' : '') + '/>' +
      '<label>' + esc(f.name) + '</label>' +
      '</div>';
  }).join('');
  $('#efList').html(html);
}

async function submitEfAddNew() {
  var n = $('#inpEfNew').val().trim();
  if (!n) return;
  try {
    var r = await gsc('addFriendToEvent', TK, _efEventId, n);
    if (r.success) {
      $('#inpEfNew').val('');
      var $existing = $('#efList .ck-row[data-id="' + r.friend.id + '"]');
      if ($existing.length) {
        $existing.addClass('checked').find('input').prop('checked', true);
      } else {
        $('#efList .empty').remove();
        $('#efList').append(
          '<div class="ck-row checked" data-id="' + esc(r.friend.id) + '">' +
          '<input type="checkbox" value="' + esc(r.friend.id) + '" checked/>' +
          '<label>' + esc(r.friend.name) + '</label>' +
          '</div>'
        );
      }
    } else toast(r.error, 'err');
  } catch (e) { toast('' + e, 'err') }
}

async function submitEfDone() {
  var ids = $('#efList .ck-row input:checked').map(function () { return $(this).val() }).get();
  var mode = _efMode, eventId = _efEventId, pendingEvent = _pendingNewEvent;
  closeSheets();
  try {
    var r = await gsc('setEventFriends', TK, eventId, ids);
    if (r.success) {
      if (r.blocked && r.blocked.length) {
        toast(r.blocked.map(function (b) { return b.name }).join(', ') + ' has transactions here and can\'t be removed', 'warn');
      }
      if (mode === 'create') {
        toast('Event created! 🎉');
        if (pendingEvent) { FRIENDS = r.friends; openDetail(pendingEvent) }
      } else if (CUR_EV && CUR_EV.id === eventId) {
        FRIENDS = r.friends;
        if (typeof renderEventFriends === 'function') renderEventFriends();
      }
    } else toast(r.error, 'err');
  } catch (e) { toast('' + e, 'err') }
}

// ── FAB ────────────────────────────────────────
function buildTxFriendPickers(checkedIds) {
  var payerHtml = $.map(FRIENDS, function (f) {
    return '<option value="' + esc(f.id) + '">' + esc(f.name) + '</option>';
  }).join('');
  var $payer = $('#inpPayer');
  if ($payer.hasClass('select2-hidden-accessible')) $payer.select2('destroy');
  $payer.html(payerHtml).select2({
    minimumResultsForSearch: Infinity,
    dropdownParent: $(document.body),
    width: '100%'
  });
  var ckHtml = $.map(FRIENDS, function (f) {
    var checked = checkedIds.indexOf(f.id) !== -1;
    return '<div class="ck-row' + (checked ? ' checked' : '') + '" data-id="' + esc(f.id) + '">' +
      '<input type="checkbox" value="' + esc(f.id) + '"' + (checked ? ' checked' : '') + '/>' +
      '<label>' + esc(f.name) + '</label>' +
      '</div>';
  }).join('');
  $('#inpShared').html(ckHtml);
}

function handleFab() {
  if (IS_SHARE && !PERM.canAdd) return; // defense-in-depth - FAB is already hidden in this case
  if (CUR_EV) {
    if (!FRIENDS.length) {
      toast('Add at least one friend to this event first', 'warn');
      openEventFriendsSheet(CUR_EV.id, 'manage');
      return;
    }
    _editTxId = null;
    $('#txTitle').text('Add Transaction');
    $('#btnSubmitTx').text('Add Transaction');
    $('#inpDesc').val('');
    $('#inpAmt').val('');
    $('#ppBox').hide();
    setSplitMode('equal');
    buildTxFriendPickers(FRIENDS.map(function (f) { return f.id }));
    _txSlipsExisting = []; _txSlipsRemoved = []; _txSlipsNew = [];
    _renderTxSlipGallery();
    openSheet('shTx');
  } else {
    openNewEventSheet();
  }
}

function openEditTxSheet(tid) {
  if (IS_SHARE && !PERM.canEdit) return; // defense-in-depth - the Edit icon is already hidden in this case
  var rows = DETAILS.filter(function (d) { return d.transactionId === tid });
  if (!rows.length) return;
  var f = rows[0];
  var friendIds = rows.map(function (r) { return r.friendId });
  var isCustom = $.grep(rows, function (r) {
    return Math.abs(parseFloat(r.amount) - parseFloat(rows[0].amount)) > 0.01;
  }).length > 0;

  _editTxId = tid;
  $('#txTitle').text('Edit Transaction');
  $('#btnSubmitTx').text('Save Changes');
  $('#inpDesc').val(f.description || '');
  buildTxFriendPickers(friendIds);
  $('#inpPayer').val(f.payId).trigger('change.select2');

  if (isCustom) {
    var prefill = {};
    rows.forEach(function (r) { prefill[r.friendId] = r.amount });
    setSplitMode('custom', prefill);
  } else {
    setSplitMode('equal');
    $('#inpAmt').val(parseFloat(f.totalAmount));
    calcPP();
  }
  _txSlipsExisting = (SLIPS[tid] || []).slice();
  _txSlipsRemoved = []; _txSlipsNew = [];
  _renderTxSlipGallery();
  openSheet('shTx');
  _resolveExistingSlips(tid);
}

// Existing slips may be a Drive fileId that still needs resolving to a real
// image (see _resolveSlipSrc) - render immediately with what we have, then
// swap in real thumbnails once resolved. Guarded by _editTxId in case the
// user closes/reopens a different transaction before this resolves.
async function _resolveExistingSlips(tid) {
  var resolved = await Promise.all(_txSlipsExisting.map(function (s) {
    return _resolveSlipSrc(s.slip).then(function (src) { return { id: s.id, slip: src, slipHi: s.slipHi } });
  }));
  if (_editTxId === tid) { _txSlipsExisting = resolved; _renderTxSlipGallery() }
}

function _buildLocalDetailRows(transactionId, payId, friendIds, totalAmount, description, customAmounts, createdAt) {
  var perPerson = totalAmount / friendIds.length;
  return friendIds.map(function (fid) {
    var amount = (customAmounts && customAmounts[fid] !== undefined) ? parseFloat(customAmounts[fid]) : perPerson;
    return { id: transactionId + '_' + fid, eventId: CUR_EV.id, transactionId: transactionId,
      payId: payId, friendId: fid, amount: amount, totalAmount: totalAmount, description: description, createdAt: createdAt };
  });
}

async function submitTx() {
  var desc = $('#inpDesc').val().trim();
  var pay  = $('#inpPayer').val();
  if (!desc) { toast('Please enter a description', 'warn'); return }
  var friendIds, totalAmount, customAmounts = null;
  if (splitMode === 'equal') {
    var amt = parseFloat($('#inpAmt').val());
    var sh  = $('#inpShared input:checked').map(function () { return $(this).val() }).get();
    if (!amt || amt <= 0) { toast('Please enter a valid amount', 'warn'); return }
    if (!sh.length) { toast('Select at least one person', 'warn'); return }
    friendIds = sh; totalAmount = amt;
  } else {
    friendIds = []; customAmounts = {}; totalAmount = 0;
    $('#cusRows .ca-inp').each(function () {
      var a = parseFloat($(this).val()) || 0;
      if (a > 0) {
        var id = $(this).data('id');
        friendIds.push(id); customAmounts[id] = a; totalAmount += a;
      }
    });
    if (!friendIds.length) { toast('Enter an amount for at least 1 person', 'warn'); return }
  }
  var editId = _editTxId;
  var slipsRemoved = _txSlipsRemoved.slice();
  var slipsNew = _txSlipsNew.slice();
  closeSheets();
  try {
    if (editId) {
      var r = IS_SHARE
        ? await gsc('updateDetailViaShare', SHARE_TOKEN, editId, pay, friendIds, totalAmount, desc, customAmounts)
        : await gsc('updateDetail', TK, editId, pay, friendIds, totalAmount, desc, customAmounts);
      if (r.success) {
        toast('Transaction updated');
        var existing = DETAILS.filter(function (d) { return d.transactionId === editId })[0];
        var createdAt = existing ? existing.createdAt : new Date().toISOString();
        DETAILS = DETAILS.filter(function (d) { return d.transactionId !== editId })
          .concat(_buildLocalDetailRows(editId, pay, friendIds, totalAmount, desc, customAmounts, createdAt));
        renderDetails();
        SETTLEMENTS = null; // stale — the Summary tab/export will refetch next time they're needed
        await _saveTxSlipsIfNeeded(editId, slipsRemoved, slipsNew);
      } else toast(r.error, 'err');
    } else {
      var r = IS_SHARE
        ? await gsc('addDetailViaShare', SHARE_TOKEN, pay, friendIds, totalAmount, desc, customAmounts)
        : await gsc('addDetail', TK, CUR_EV.id, pay, friendIds, totalAmount, desc, customAmounts);
      if (r.success) {
        toast('Transaction added! 💸');
        DETAILS = DETAILS.concat(_buildLocalDetailRows(r.transactionId, pay, friendIds, totalAmount, desc, customAmounts, new Date().toISOString()));
        renderDetails();
        SETTLEMENTS = null;
        await _saveTxSlipsIfNeeded(r.transactionId, slipsRemoved, slipsNew);
      } else toast(r.error, 'err');
    }
  } catch (e) { toast('' + e, 'err') }
  _editTxId = null;
  _txSlipsExisting = []; _txSlipsRemoved = []; _txSlipsNew = [];
}

function askDel(type, id, name) {
  if (type === 'tx' && IS_SHARE) return; // defense-in-depth - delete is never allowed via a share link, button is already hidden
  var titles = {
    event:   'Delete Event?',
    tx:      'Delete Transaction?',
    account: 'Delete Account?'
  };
  var msgs = {
    event:   'Delete "' + name + '"? All transactions will be permanently removed.',
    tx:      'Delete this transaction? This cannot be undone.',
    account: 'Delete account "' + name + '"?'
  };
  $('#cfTitle').text(titles[type] || 'Delete?');
  $('#cfMsg').text(msgs[type] || 'Are you sure?');
  _del = { type: type, id: id };
  openSheet('shConfirm');
}

// ── My Profile ─────────────────────────────────
var _pfPhotoPending; // undefined = untouched (don't send); '' = removed; string = new photo

function _renderPfAvatar(name, photo) {
  var $el = $('#pfAvatar');
  if (photo) $el.css('background', 'url(' + photo + ') center/cover no-repeat').text('');
  else $el.css('background', avCol(name)).text(initials(name));
}

// Downscales to a small square-ish thumbnail and re-encodes as JPEG so the
// result comfortably fits in a single Sheets cell (well under ~50k chars).
function _resizeImageFile(file, maxSize, quality) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = function () { reject(new Error('Could not read image')) };
      img.src = e.target.result;
    };
    reader.onerror = function () { reject(new Error('Could not read file')) };
    reader.readAsDataURL(file);
  });
}

var _pfPwPolicy = null;

async function openProfileSheet() {
  openSheet('shProfile');
  _pfPhotoPending = undefined;
  $('#inpPfCurPw, #inpPfNewPw').val('');
  gsc('getPasswordPolicy').then(function (p) {
    _pfPwPolicy = p;
    renderPwChecklist('pfPwChecklist', p);
  }).catch(function () {});
  try {
    var r = await gsc('getMyProfile', TK);
    if (r.success) {
      $('#inpPfName').val(r.displayName);
      $('#inpPfUser').val(r.username);
      _renderPfAvatar(r.displayName, r.photo);
      $('#pfRemovePhotoRow').toggle(!!r.photo);
    } else toast(r.error, 'err');
  } catch (e) { toast('' + e, 'err') }
}

async function submitProfile() {
  var name = $('#inpPfName').val().trim();
  if (!name) { toast('Please enter a name', 'warn'); return }
  try {
    var r = await gsc('updateProfile', TK, name, _pfPhotoPending);
    if (r.success) {
      ME = r.user;
      localStorage.setItem('su_me', JSON.stringify(ME));
      $('#heroName').text(ME.displayName);
      _renderHdrAvatar(ME.displayName, _pfPhotoPending !== undefined ? _pfPhotoPending : ME_PHOTO);
      toast('Profile updated');
      closeSheets();
    } else toast(r.error, 'err');
  } catch (e) { toast('' + e, 'err') }
}

async function submitChangePassword() {
  var cur = $('#inpPfCurPw').val();
  var next = $('#inpPfNewPw').val();
  if (!cur || !next) { toast('Please fill in both password fields', 'warn'); return }
  try {
    var r = await gsc('changePassword', TK, cur, next);
    if (r.success) {
      toast('Password changed');
      $('#inpPfCurPw, #inpPfNewPw').val('');
    } else toast(r.error, 'err');
  } catch (e) { toast('' + e, 'err') }
}

$(function () {
  // Close buttons
  $('#shEventClose, #shEfClose, #shTxClose, #shShareClose').on('click', closeSheets);
  $('#cfCancel, #logoutCancel').on('click', closeSheets);
  $('#shAccountClose, #shProfileClose, #shUserEditClose').on('click', closeSheets);
  $('#shSlipViewClose').on('click', closeSheets);

  // Transaction slip
  $('#txSlipGallery').on('click', '#btnTxSlipAdd', function () { $('#inpTxSlip').trigger('click') });
  $('#txSlipGallery').on('click', '.tx-slip-remove', function () {
    var kind = $(this).data('kind'), idx = $(this).data('idx');
    if (kind === 'existing') {
      _txSlipsRemoved.push(_txSlipsExisting[idx].id);
      _txSlipsExisting.splice(idx, 1);
    } else {
      _txSlipsNew.splice(idx, 1);
    }
    _renderTxSlipGallery();
  });
  $('#inpTxSlip').on('change', async function () {
    var file = this.files && this.files[0];
    this.value = '';
    if (!file) return;
    if (file.type.indexOf('image/') !== 0) { toast('Please choose an image file', 'warn'); return }
    try {
      var slip = await _compressSlipForUpload(file);
      _txSlipsNew.push({ slip: slip });
      _renderTxSlipGallery();
    } catch (e) { toast('Could not process that image', 'err') }
  });

  // Account menu
  $('#btnOpenProfile').on('click', openProfileSheet);
  $('#btnOpenLogout').on('click', function () { openSheet('shLogout') });

  // My Profile
  $('#btnPfPhoto').on('click', function () { $('#inpPfPhoto').trigger('click') });
  $('#inpPfPhoto').on('change', async function () {
    var file = this.files && this.files[0];
    this.value = '';
    if (!file) return;
    if (file.type.indexOf('image/') !== 0) { toast('Please choose an image file', 'warn'); return }
    try {
      var dataUrl = await _resizeImageFile(file, 160, 0.72);
      _pfPhotoPending = dataUrl;
      _renderPfAvatar($('#inpPfName').val(), dataUrl);
      $('#pfRemovePhotoRow').show();
    } catch (e) { toast('Could not process that image', 'err') }
  });
  $('#btnPfRemovePhoto').on('click', function (e) {
    e.preventDefault();
    _pfPhotoPending = '';
    _renderPfAvatar($('#inpPfName').val(), '');
    $('#pfRemovePhotoRow').hide();
  });
  $('#btnPfSave').on('click', submitProfile);
  $('#btnPfChangePw').on('click', submitChangePassword);
  $('#inpPfNewPw').on('input', function () {
    if (_pfPwPolicy) updatePwChecklist('pfPwChecklist', _pfPwPolicy, $(this).val());
  });

  $('#evIconGrid').on('click', '.icon-pick', function () {
    $('#evIconGrid .icon-pick').removeClass('on');
    $(this).addClass('on');
    _evIcon = $(this).data('icon');
  });
  $('#btnEvManageFriends').on('click', function () {
    if (_evEditId) openEventFriendsSheet(_evEditId, 'manage');
  });

  // Submit buttons
  $('#btnSubmitEvent').on('click', submitEvent);
  $('#btnEfAddNew').on('click', submitEfAddNew);
  $('#btnEfDone').on('click', submitEfDone);
  $('#btnSubmitTx').on('click', submitTx);

  // Split mode toggle
  $('#modeEq').on('click', function () { setSplitMode('equal') });
  $('#modeCus').on('click', function () { setSplitMode('custom') });

  // Equal mode: checkbox toggle
  $('#inpShared').on('click', '.ck-row', function () {
    var inp = $(this).find('input');
    inp.prop('checked', !inp.prop('checked'));
    $(this).toggleClass('checked', inp.prop('checked'));
    calcPP();
  });

  // Event-friends checklist: local toggle only, submitted in one batch by Done
  $('#efList').on('click', '.ck-row', function () {
    var inp = $(this).find('input');
    inp.prop('checked', !inp.prop('checked'));
    $(this).toggleClass('checked', inp.prop('checked'));
  });

  // Equal mode: amount input
  $('#inpAmt').on('input', calcPP);
  $('#inpPayer').on('change', calcPP);

  // Custom mode: amount inputs (delegated since rendered dynamically)
  $('#cusRows').on('input', '.ca-inp', calcCustomTotal);

  // Select all / clear
  $('#btnCkAll').on('click', function () {
    $('#inpShared .ck-row').each(function () {
      $(this).find('input').prop('checked', true);
      $(this).addClass('checked');
    });
    calcPP();
  });
  $('#btnCkNone').on('click', function () {
    $('#inpShared .ck-row').each(function () {
      $(this).find('input').prop('checked', false);
      $(this).removeClass('checked');
    });
    calcPP();
  });

  // Confirm delete
  $('#cfOk').on('click', async function () {
    if (!_del) return;
    var t = _del.type, id = _del.id; _del = null; closeSheets();
    if (t === 'tx' && IS_SHARE) return; // defense-in-depth - delete is never allowed via a share link
    try {
      var r;
      if (t === 'event')        r = await gsc('deleteEvent',   TK, id);
      else if (t === 'tx')      r = await gsc('deleteDetail',  TK, id);
      else if (t === 'account') r = await gsc('deleteAccount', TK, id);
      if (r && r.success) {
        toast('Deleted');
        if (t === 'event') {
          EVENTS = EVENTS.filter(function (e) { return e.id !== id });
          refreshEventsUI();
        } else if (t === 'tx' && CUR_EV) {
          DETAILS = DETAILS.filter(function (d) { return d.transactionId !== id });
          renderDetails();
          SETTLEMENTS = null;
        } else if (t === 'account') {
          loadAccounts();
        }
      } else if (r) toast(r.error, 'err');
    } catch (e) { toast('' + e, 'err') }
  });

  // Logout confirm
  $('#btnDoLogout').on('click', doLogout);

  // Enter key shortcuts
  $('#inpEv').on('keydown', function (e) { if (e.key === 'Enter') submitEvent() });
  $('#inpEfNew').on('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submitEfAddNew() } });
});
</script>
