<style>
#authView{
  position:fixed;inset:0;z-index:1000;
  min-height:100dvh;display:none;flex-direction:column;
  align-items:center;justify-content:center;
  padding:calc(var(--si)+24px) 20px calc(24px + var(--sb));
  background:var(--bg);
}

.auth-wrap{width:100%;max-width:400px;position:relative;z-index:1}
.auth-logo{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.auth-logo-ic{
  width:56px;height:56px;border-radius:18px;
  background:var(--p-grad);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px var(--p-glow);flex-shrink:0;
}
.auth-logo-ic svg{width:28px;height:28px;fill:#fff}
.auth-logo-name{font-size:20px;font-weight:800;letter-spacing:-.3px;color:var(--t1);line-height:1.2}
.auth-logo-sub{font-size:13px;color:var(--t2);margin-top:3px}
.auth-box{
  background:var(--s1);border:1px solid var(--bd);
  border-radius:24px;padding:32px 28px;
  box-shadow:var(--shadow-lg);
  animation:auth-slide-up .32s ease;
}
@keyframes auth-slide-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.auth-h{font-size:24px;font-weight:800;letter-spacing:-.3px;margin-bottom:6px;color:var(--t1)}
.auth-s{font-size:14px;color:var(--t2);margin-bottom:26px;line-height:1.5}
.fld{margin-bottom:16px}
.fld-label{display:block;font-size:12px;font-weight:700;color:var(--t2);letter-spacing:.3px;text-transform:uppercase;margin-bottom:7px}
.fld-row{position:relative}
.fld-inp{
  width:100%;height:50px;background:var(--s2);border:1.5px solid var(--bd);
  border-radius:var(--rad-sm);padding:0 46px 0 16px;font-size:15px;color:var(--t1);
  outline:none;transition:border-color .2s,background .2s;
}
.fld-inp::placeholder{color:var(--t3)}
.fld-inp:hover{border-color:var(--bd2)}
.fld-inp:focus{border-color:var(--p);background:var(--s1)}
.pw-btn{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--t3);display:flex;align-items:center;padding:6px;cursor:pointer;
}
.pw-btn svg{width:20px;height:20px;fill:currentColor}
.pf-hint{font-size:12px;color:var(--t3);margin-top:7px;line-height:1.5}
.btn-primary{
  width:100%;height:52px;margin-top:6px;border:none;border-radius:var(--rad-sm);
  background:var(--p-grad);
  color:#fff;font-size:16px;font-weight:700;letter-spacing:-.1px;
  box-shadow:0 4px 14px var(--p-glow);transition:transform .15s,box-shadow .15s;
  cursor:pointer;
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px var(--p-glow)}
.btn-primary:active{transform:scale(.98)}
.auth-foot{text-align:center;margin-top:20px;font-size:13px;color:var(--t2)}
.auth-foot a{color:var(--p);font-weight:600;text-decoration:none;transition:color .15s}
.auth-foot a:hover{color:var(--p-lt)}
</style>
