<style>
#authView{
  position:fixed;inset:0;z-index:1000;
  min-height:100dvh;display:none;flex-direction:column;
  background:var(--bg);overflow:hidden;
}

/* Colored hero panel - the "background" - with the sheet below overlapping
   its bottom edge so the two read as one full-screen surface, not a
   floating card on empty space. */
.auth-top{
  flex:0 0 auto;background:var(--p-grad);
  padding:calc(var(--si) + 24px) 24px 44px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
}
.auth-logo{display:flex;flex-direction:column;align-items:center;gap:8px}
.auth-logo-ic{
  width:44px;height:44px;border-radius:14px;
  background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.auth-logo-ic svg{width:22px;height:22px;fill:#fff}
.auth-logo-name{font-size:17px;font-weight:800;letter-spacing:-.3px;color:#fff;line-height:1.2}
.auth-logo-sub{font-size:12px;color:rgba(255,255,255,.75);margin-top:1px}

.auth-sheet{
  flex:1 1 auto;background:var(--s1);min-height:0;
  border-radius:28px 28px 0 0;margin-top:-20px;position:relative;z-index:1;
  box-shadow:0 -8px 24px rgba(0,0,0,.08);
  padding:32px 24px calc(24px + var(--sb));overflow-y:auto;
  display:flex;flex-direction:column;justify-content:safe center;
  animation:auth-slide-up .32s ease;
}
@keyframes auth-slide-up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.auth-sheet-inner{width:100%;max-width:460px;margin:0 auto;flex:0 0 auto}

.auth-h{font-size:30px;font-weight:800;letter-spacing:-.3px;margin-bottom:8px;color:var(--t1)}
.auth-s{font-size:17px;color:var(--t2);margin-bottom:32px;line-height:1.5}
.fld{margin-bottom:22px}
.fld-label{display:block;font-size:13px;font-weight:700;color:var(--t2);letter-spacing:.3px;text-transform:uppercase;margin-bottom:9px}
.fld-row{position:relative}
.fld-inp{
  width:100%;height:64px;background:var(--s2);border:1.5px solid var(--bd);
  border-radius:16px;padding:0 54px 0 22px;font-size:19px;color:var(--t1);
  outline:none;transition:border-color .2s,background .2s;
}
.fld-inp::placeholder{color:var(--t3)}
.fld-inp:hover{border-color:var(--bd2)}
.fld-inp:focus{border-color:var(--p);background:var(--s1)}
.pw-btn{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--t3);display:flex;align-items:center;padding:6px;cursor:pointer;
}
.pw-btn svg{width:24px;height:24px;fill:currentColor}
.pf-hint{font-size:13px;color:var(--t3);margin-top:8px;line-height:1.5}
.btn-primary{
  width:100%;height:64px;margin-top:8px;border:none;border-radius:16px;
  background:var(--p-grad);
  color:#fff;font-size:19px;font-weight:700;letter-spacing:-.1px;
  box-shadow:0 4px 14px var(--p-glow);transition:transform .15s,box-shadow .15s;
  cursor:pointer;
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px var(--p-glow)}
.btn-primary:active{transform:scale(.98)}
.auth-foot{text-align:center;margin-top:20px;font-size:13px;color:var(--t2)}
.auth-foot a{color:var(--p);font-weight:600;text-decoration:none;transition:color .15s}
.auth-foot a:hover{color:var(--p-lt)}
</style>
