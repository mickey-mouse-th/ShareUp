<style>
#authView{
  position:fixed;inset:0;z-index:1000;
  min-height:100dvh;display:none;flex-direction:column;
  align-items:center;justify-content:center;
  padding:calc(var(--si)+24px) 20px calc(24px + var(--sb));
  background:#07071a;overflow:hidden;
}

/* ── Floating glow orbs ───────────────────────── */
.auth-orb{
  position:absolute;border-radius:50%;filter:blur(72px);pointer-events:none;
  animation:auth-orb-drift 10s ease-in-out infinite;
}
.auth-orb-1{
  width:480px;height:480px;
  background:radial-gradient(circle,rgba(79,70,229,.55) 0%,transparent 70%);
  top:-160px;left:-140px;animation-duration:12s;
}
.auth-orb-2{
  width:380px;height:380px;
  background:radial-gradient(circle,rgba(124,58,237,.45) 0%,transparent 70%);
  bottom:-100px;right:-80px;animation-duration:9s;animation-delay:-4s;
}
.auth-orb-3{
  width:260px;height:260px;
  background:radial-gradient(circle,rgba(219,39,119,.35) 0%,transparent 70%);
  top:45%;left:55%;animation-duration:14s;animation-delay:-7s;
}
.auth-orb-4{
  width:200px;height:200px;
  background:radial-gradient(circle,rgba(6,182,212,.3) 0%,transparent 70%);
  bottom:20%;left:5%;animation-duration:11s;animation-delay:-2s;
}
@keyframes auth-orb-drift{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(28px,-24px) scale(1.06)}
  66%{transform:translate(-18px,18px) scale(.94)}
}

.auth-wrap{width:100%;max-width:400px;position:relative;z-index:1}
.auth-logo{display:flex;align-items:center;gap:13px;margin-bottom:32px}
.auth-logo-ic{
  width:50px;height:50px;border-radius:15px;
  background:var(--p-grad);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 24px var(--p-glow);flex-shrink:0;
}
.auth-logo-ic svg{width:26px;height:26px;fill:#fff}
.auth-logo-name{font-size:17px;font-weight:800;letter-spacing:-.3px;color:#fff;line-height:1}
.auth-logo-sub{font-size:11px;color:rgba(255,255,255,.4);margin-top:3px}
.auth-box{
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.11);
  backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);
  border-radius:24px;padding:36px 32px 32px;
  box-shadow:0 0 0 1px rgba(255,255,255,.06) inset,0 32px 80px rgba(0,0,0,.55);
  animation:auth-slide-up .32s ease;
}
@keyframes auth-slide-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.auth-h{font-size:22px;font-weight:800;letter-spacing:-.3px;margin-bottom:5px;color:#fff}
.auth-s{font-size:13px;color:rgba(255,255,255,.45);margin-bottom:22px;line-height:1.5}
.fld{margin-bottom:16px}
.fld-label{display:block;font-size:11px;font-weight:700;color:rgba(255,255,255,.55);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
.fld-row{position:relative}
.fld-inp{
  width:100%;height:48px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.1);
  border-radius:12px;padding:0 44px 0 13px;font-size:16px;color:#fff;
  outline:none;transition:border-color .2s,background .2s;
}
.fld-inp::placeholder{color:rgba(255,255,255,.25)}
.fld-inp:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
.fld-inp:focus{border-color:var(--p);background:rgba(255,255,255,.1)}
.pw-btn{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:rgba(255,255,255,.4);display:flex;align-items:center;padding:6px;cursor:pointer;
}
.pw-btn svg{width:20px;height:20px;fill:currentColor}
.pf-hint{font-size:11px;color:rgba(255,255,255,.35);margin-top:6px;line-height:1.5}
.btn-primary{
  width:100%;height:50px;margin-top:6px;border:none;border-radius:13px;
  background:var(--p-grad);
  color:#fff;font-size:15px;font-weight:700;letter-spacing:-.2px;
  box-shadow:0 4px 22px var(--p-glow);transition:transform .15s,box-shadow .15s;
  cursor:pointer;
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px var(--p-glow)}
.btn-primary:active{transform:scale(.98)}
.auth-foot{text-align:center;margin-top:18px;font-size:13px;color:rgba(255,255,255,.4)}
.auth-foot a{color:#A5B4FC;font-weight:600;text-decoration:none;transition:color .15s}
.auth-foot a:hover{color:#C7D2FE}
</style>
