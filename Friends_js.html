<script>
async function loadFriends() {
  try {
    var r = await gsc('getFriends', TK);
    if (r.success) {
      FRIENDS = r.friends || [];
      $('#stFriends').text(FRIENDS.length);
      if (CUR_TAB === 'friends') renderFriends();
    }
  } catch (e) {}
}

function renderFriends() {
  var $el = $('#friendsList');
  if (!FRIENDS.length) {
    $el.html(
      '<div class="empty">' +
      '<div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg></div>' +
      '<div class="empty-t">No friends yet</div>' +
      '<div class="empty-s">Tap + to add friends and start splitting expenses</div>' +
      '</div>'
    );
    return;
  }
  var html = $.map(FRIENDS, function (f, i) {
    var isMe = f.name === 'Me';
    var del = isMe ? '<span class="fr-me">You</span>' :
      '<button class="btn-del fr-del" data-id="' + esc(f.id) + '" data-name="' + esc(f.name) + '">' +
      '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>' +
      '</button>';
    return (i > 0 ? '<div class="fr-sep"></div>' : '') +
      '<div class="fr-row">' +
      '<div class="fr-av" style="background:' + avCol(f.name) + '">' + initials(f.name) + '</div>' +
      '<span class="fr-name">' + esc(f.name) + '</span>' +
      del +
      '</div>';
  }).join('');
  $el.html(html);
}

async function submitFriend() {
  var n = $('#inpFr').val().trim();
  if (!n) { toast('Please enter a name', 'warn'); return }
  closeSheets();
  try {
    var r = await gsc('addFriend', TK, n);
    if (r.success) { toast('Friend added!'); loadFriends(); }
    else toast(r.error, 'err');
  } catch (e) { toast('' + e, 'err') }
}

$(function () {
  $('#friendsList').on('click', '.fr-del', function (e) {
    e.stopPropagation();
    askDel('friend', $(this).data('id'), $(this).data('name'));
  });
  $('#inpFr').on('keydown', function (e) { if (e.key === 'Enter') submitFriend() });
});
</script>
