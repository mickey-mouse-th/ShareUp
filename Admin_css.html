<style>
.acc-card{background:var(--s1);border:1px solid var(--bd);border-radius:20px;margin-bottom:10px;overflow:hidden}
.acc-row{display:flex;align-items:center;padding:14px 16px;gap:12px;flex-wrap:wrap}
.acc-av{
  width:48px;height:48px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:18px;flex-shrink:0;
}
.acc-info{flex:1;min-width:0}
.acc-name{font-size:15px;font-weight:700;color:var(--t1)}
.acc-user{font-size:13px;color:var(--t2);margin-top:2px}
.acc-date{font-size:12px;color:var(--t3);margin-top:2px}
.role-sel{
  font-size:12px;font-weight:700;border-radius:10px;padding:7px 10px;
  border:1px solid var(--bd2);background:var(--s2);color:var(--t1);cursor:pointer;
}
.role-sel option{background:#1a1935;color:#fff}
.tgl{position:relative;display:inline-block;width:44px;height:26px;flex-shrink:0}
.tgl input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.tgl input:disabled{cursor:not-allowed}
.tgl-track{position:absolute;inset:0;background:var(--s2);border:1px solid var(--bd2);border-radius:14px;transition:background .15s}
.tgl-track::before{
  content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:var(--t2);transition:transform .15s,background .15s;
}
.tgl.on .tgl-track{background:var(--g-dim);border-color:rgba(34,197,94,.35)}
.tgl.on .tgl-track::before{transform:translateX(18px);background:var(--g)}
.tgl input:disabled ~ .tgl-track{opacity:.5}
</style>
