<script>
async function loadAccounts() {
  $('#accountsList').html(skeletonHtml(3, 'acc'));
  try {
    var r = await gsc('getAllAccounts', TK);
    if (r.success) renderAccounts(r.accounts || []);
    else _handleDataError(r.error);
  } catch (e) { _handleDataError('' + e) }
}

function renderAccounts(list) {
  var $el = $('#accountsList');
  if (!list.length) {
    $el.html('<div class="empty"><div class="empty-t">No accounts found</div></div>');
    return;
  }
  var html = $.map(list, function (a) {
    var isMe = ME && a.id === ME.id;
    var youBadge = isMe
      ? ' <small style="font-size:11px;color:var(--p-lt);background:var(--p-dim);border-radius:6px;padding:2px 8px;border:1px solid rgba(147,51,234,.22)">You</small>'
      : '';
    var roles = ['user', 'staff', 'admin'].map(function (r) {
      return '<option value="' + r + '"' + (a.role === r ? ' selected' : '') + '>' + r[0].toUpperCase() + r.slice(1) + '</option>';
    }).join('');
    var delBtn = !isMe
      ? '<button class="btn-del acc-del" data-id="' + esc(a.id) + '" data-name="' + esc(a.displayName) + '">' +
        '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>' +
        '</button>'
      : '';
    var enabled = a.status !== 'disabled';
    var tgl = '<label class="tgl' + (enabled ? ' on' : '') + '">' +
      '<input type="checkbox" class="acc-tgl" data-id="' + esc(a.id) + '"' +
      (enabled ? ' checked' : '') + (isMe ? ' disabled' : '') + '>' +
      '<span class="tgl-track"></span></label>';
    return '<div class="acc-card"><div class="acc-row">' +
      avatarHtmlDirect('acc-av', a.displayName, a.photo) +
      '<div class="acc-info">' +
      '<div class="acc-name">' + esc(a.displayName) + youBadge + (enabled ? '' : ' <small style="font-size:11px;color:var(--r);background:var(--r-dim);border-radius:6px;padding:2px 8px;border:1px solid rgba(244,63,94,.25)">Disabled</small>') + '</div>' +
      '<div class="acc-user">@' + esc(a.username) + '</div>' +
      '<div class="acc-date">' + fmtDate(a.lastLogin) + '</div>' +
      '</div>' +
      '<select class="role-sel" data-id="' + esc(a.id) + '"' + (isMe ? ' disabled' : '') + '>' + roles + '</select>' +
      tgl +
      delBtn +
      '</div></div>';
  }).join('');
  $el.html(html);
}

$(function () {
  $('#accountsList').on('change', '.role-sel', async function () {
    var id   = $(this).data('id');
    var role = $(this).val();
    try {
      var r = await gsc('updateAccountRole', TK, id, role);
      if (r.success) toast('Role updated');
      else { toast(r.error, 'err'); loadAccounts(); }
    } catch (e) { toast('' + e, 'err') }
  });

  $('#accountsList').on('click', '.acc-del', function () {
    askDel('account', $(this).data('id'), $(this).data('name'));
  });

  $('#accountsList').on('change', '.acc-tgl', async function () {
    var id = $(this).data('id');
    var enable = $(this).is(':checked');
    var status = enable ? 'active' : 'disabled';
    try {
      var r = await gsc('updateAccountStatus', TK, id, status);
      if (r.success) {
        toast(enable ? 'Account enabled' : 'Account disabled');
        loadAccounts();
      } else { toast(r.error, 'err'); loadAccounts(); }
    } catch (e) { toast('' + e, 'err') }
  });
});
</script>
