<script>
var ACCOUNTS = [];
var _ueId = null; // account open in the Edit User sheet
var USER_SEARCH = '';

// Runs a gsc() call; on success passes the result to onSuccess, otherwise
// toasts the server error or thrown exception. Shared by the mutation
// handlers below so each one only states its call and its success action.
async function _runAction(call, onSuccess) {
  try {
    var r = await call();
    if (r.success) onSuccess(r);
    else toast(r.error, 'err');
  } catch (e) { toast('' + e, 'err') }
}

function _findAccount(id) {
  return ACCOUNTS.filter(function (x) { return x.id === id })[0];
}

async function loadAccounts() {
  $('#accountsList').html(skeletonHtml(3, 'acc'));
  try {
    var r = await gsc('getAllAccounts', TK);
    if (r.success) { ACCOUNTS = r.accounts || []; renderAccounts() }
    else _handleDataError(r.error);
  } catch (e) { _handleDataError('' + e) }
}

function renderAccounts() {
  var $el = $('#accountsList');
  var q = USER_SEARCH.trim().toLowerCase();
  var list = !q ? ACCOUNTS : ACCOUNTS.filter(function (a) {
    return a.displayName.toLowerCase().indexOf(q) !== -1 || a.username.toLowerCase().indexOf(q) !== -1;
  });
  if (!list.length) {
    $el.html(
      '<div class="empty">' +
      '<div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 8 1.34 8 4v2H4v-2c0-2.66 5.3-4 8-4zm0-2a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg></div>' +
      '<div class="empty-t">' + (ACCOUNTS.length ? 'No accounts found' : 'No accounts yet') + '</div>' +
      '<div class="empty-s">' + (ACCOUNTS.length ? 'Try a different search' : 'Accounts will show up here once someone registers') + '</div>' +
      '</div>'
    );
    return;
  }
  var html = $.map(list, function (a) {
    var isMe = ME && a.id === ME.id;
    var youBadge = isMe ? ' <small class="badge-you">You</small>' : '';
    var enabled = a.status !== 'disabled';
    return '<div class="acc-card acc-tap" data-id="' + esc(a.id) + '"><div class="acc-row">' +
      avatarHtmlDirect('acc-av', a.displayName, a.photo) +
      '<div class="acc-info">' +
      '<div class="acc-name">' + highlightText(a.displayName, q) + youBadge + (enabled ? '' : ' <small class="badge-disabled">Disabled</small>') + '</div>' +
      '<div class="acc-user">@' + highlightText(a.username, q) + '</div>' +
      '</div>' +
      '<span class="acc-role-badge">' + esc(a.role[0].toUpperCase() + a.role.slice(1)) + '</span>' +
      '<div class="acc-chev"><svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></div>' +
      '</div></div>';
  }).join('');
  $el.html(html);
}

function _renderUeAvatar(name, photo) {
  var $el = $('#ueAvatar');
  if (photo) $el.css('background', 'url(' + photo + ') center/cover no-repeat').text('');
  else $el.css('background', avCol(name)).text(initials(name));
}

function openUserEditSheet(id) {
  var a = _findAccount(id);
  if (!a) return;
  _ueId = a.id;
  var isMe = ME && a.id === ME.id;
  var enabled = a.status !== 'disabled';

  _renderUeAvatar(a.displayName, a.photo);
  $('#ueName').text(a.displayName);
  $('#ueUsername').text('@' + a.username);
  $('#ueRoleSel').val(a.role).trigger('change.select2').prop('disabled', isMe);
  $('#ueStatusTgl').prop('checked', enabled).prop('disabled', isMe);
  $('#ueTglWrap').toggleClass('on', enabled);
  $('#ueStatusHint').text(enabled ? 'Active — can sign in' : 'Disabled — can\'t sign in');
  $('#ueJoined').text(fmtDate(a.firstLogin));
  $('#ueLastActive').text(fmtDate(a.lastLogin));
  $('#btnUeDelete').toggle(!isMe);

  openSheet('shUserEdit');
}

function _tglSet(wrapId, chkId, on) {
  $('#' + wrapId).toggleClass('on', on);
  $('#' + chkId).prop('checked', on);
}

// Picks the unit (minutes/hours/days) that reads most naturally for the count.
function _sessionHintText(minutes) {
  if (!minutes || minutes < 1) return '';
  if (minutes < 120) return '≈ ' + minutes + ' minutes';
  if (minutes < 1440 * 2) return '≈ ' + (minutes / 60).toFixed(1) + ' hours';
  return '≈ ' + (minutes / 1440).toFixed(1) + ' days';
}

function loadSettingsPanel() {
  return _runAction(function () { return gsc('getSettings', TK) }, function (r) {
    var s = r.settings;
    $('#asSessionMin').val(s.sessionMinutes);
    $('#asSessionHint').text(_sessionHintText(s.sessionMinutes));
    $('#asPwMinLen').val(s.pwMinLength);
    _tglSet('asPwUpperWrap', 'asPwUpper', s.pwRequireUpper);
    _tglSet('asPwLowerWrap', 'asPwLower', s.pwRequireLower);
    _tglSet('asPwNumberWrap', 'asPwNumber', s.pwRequireNumber);
    _tglSet('asPwSpecialWrap', 'asPwSpecial', s.pwRequireSpecial);
  }).then(function () { $('#asSessionMin, #asPwMinLen').removeClass('sk-pulse') });
}

// ── Admin sub-nav (User / Theme / Settings) ────
// No panel is shown by default; the 3-item menu always comes up first.
var ADMIN_TAB = 'menu';
var _themeLoaded = false, _settingsLoaded = false;

function switchAdminTab(t) {
  ADMIN_TAB = t;
  $('#panelAdminMenu').toggle(t === 'menu');
  $('#panelAdminUser').toggle(t === 'user');
  $('#panelAdminTheme').toggle(t === 'theme');
  $('#panelAdminSettings').toggle(t === 'settings');
  if (t === 'theme' && !_themeLoaded) { _themeLoaded = true; loadThemePanel() }
  if (t === 'settings' && !_settingsLoaded) { _settingsLoaded = true; loadSettingsPanel() }
}

// ── Theme Settings ────────────────────────────
// Mirrors DEFAULT_THEME in Code.js - used for the "Reset to Default" button
// and to seed the reference table/previews before load.
var DEFAULT_THEME_CLIENT = {
  p: '#4F46E5', pLt: '#4338CA',
  bg: '#F1F5F9', s1: '#FFFFFF', s2: '#F8FAFC', bd: '#E2E8F0',
  t1: '#0F172A', t2: '#64748B', t3: '#94A3B8',
  g: '#15803D', r: '#EF4444', o: '#B45309', b: '#0F766E',
  hdrBg: '#FFFFFF', navBg: '#FFFFFF', overlayBg: '#0F172A'
};
var THEME_CSS_VAR = {
  p: '--p', pLt: '--p-lt', bg: '--bg', s1: '--s1', s2: '--s2', bd: '--bd',
  t1: '--t1', t2: '--t2', t3: '--t3', g: '--g', r: '--r', o: '--o', b: '--b',
  hdrBg: '--hdr-bg', navBg: '--nav-bg', overlayBg: '--overlay-bg'
};
// Drives the editable rows below. `kind` picks which real, self-labeled
// component markup to render for that token (see _componentHtml) - e.g.
// "Card Surface" shows an actual card, "Primary" a real button. No abstract
// swatches.
var THEME_TOKENS = [
  { token: 'p',         group: 'Brand',              label: 'Primary (Buttons)',       kind: 'button' },
  { token: 'pLt',       group: 'Brand',              label: 'Accent / Highlight',      kind: 'accent' },
  { token: 'bg',        group: 'Page',                label: 'Page Background',        kind: 'pagebg' },
  { token: 's1',        group: 'Page',                label: 'Card Surface',           kind: 'card' },
  { token: 's2',        group: 'Page',                label: 'Secondary Surface',      kind: 'input' },
  { token: 'bd',        group: 'Page',                label: 'Border',                 kind: 'border' },
  { token: 't1',        group: 'Text',                label: 'Primary Text',           kind: 'text1' },
  { token: 't2',        group: 'Text',                label: 'Muted Text',             kind: 'text2' },
  { token: 't3',        group: 'Text',                label: 'Faint Text',             kind: 'text3' },
  { token: 'g',         group: 'Status',              label: 'Success',                kind: 'badge-g' },
  { token: 'r',         group: 'Status',              label: 'Danger',                 kind: 'badge-r' },
  { token: 'o',         group: 'Status',              label: 'Warning',                kind: 'badge-o' },
  { token: 'b',         group: 'Status',              label: 'Info',                   kind: 'badge-b' },
  { token: 'hdrBg',     group: 'Header & Navigation', label: 'Header Background',      kind: 'header' },
  { token: 'navBg',     group: 'Header & Navigation', label: 'Bottom Nav Background',  kind: 'nav' },
  { token: 'overlayBg', group: 'Header & Navigation', label: 'Popup / Modal Overlay',  kind: 'popup' }
];

// Real, labeled component markup per token "kind" - every color reads its
// var(--x) straight off the cascade (see _seedLiveVars/_previewThemeToken),
// so a row updates live from its own edits AND from any other token it
// depends on (e.g. Card reacts to Card Surface + Primary/Muted Text).
function _componentHtml(t) {
  switch (t.kind) {
    case 'button': return '<button type="button" class="cpv-btn">Button</button>';
    case 'accent': return '<div class="cpv-accent-row"><span class="cpv-accent-chip">Accent</span><span class="cpv-accent-link">Link / Highlight</span></div>';
    case 'pagebg': return '<div class="cpv-page">Page Background</div>';
    case 'card':   return '<div class="cpv-card"><div class="cpv-card-title">Card</div><div class="cpv-card-sub">Card Surface + Shadow</div></div>';
    case 'input':  return '<div class="cpv-input">Secondary Surface / Search…</div>';
    case 'border': return '<div class="cpv-border">Border</div>';
    case 'text1':  return '<div class="cpv-text cpv-text-1">Aa Primary Text</div>';
    case 'text2':  return '<div class="cpv-text cpv-text-2">Aa Muted Text</div>';
    case 'text3':  return '<div class="cpv-text cpv-text-3">Aa Faint Text</div>';
    case 'badge-g': return '<span class="cpv-badge cpv-badge-g">Success</span>';
    case 'badge-r': return '<span class="cpv-badge cpv-badge-r">Danger</span>';
    case 'badge-o': return '<span class="cpv-badge cpv-badge-o">Warning</span>';
    case 'badge-b': return '<span class="cpv-badge cpv-badge-b">Info</span>';
    case 'header': return '<div class="cpv-header"><span class="cpv-header-back">‹</span><b>Header</b></div>';
    case 'nav':    return '<div class="cpv-nav"><i class="on"></i><i></i><i></i><span>Bottom Nav</span></div>';
    case 'popup':  return '<div class="cpv-popup"><div class="cpv-popup-card">Popup / Modal</div></div>';
    default:       return '<div class="cpv-card"></div>';
  }
}

function _renderThemeGroups(theme) {
  var groups = [], byGroup = {};
  THEME_TOKENS.forEach(function (t) {
    if (!byGroup[t.group]) { byGroup[t.group] = []; groups.push(t.group) }
    byGroup[t.group].push(t);
  });
  var html = groups.map(function (g) {
    return '<div class="theme-group">' +
      '<label class="inp-lbl theme-group-lbl">' + esc(g) + '</label>' +
      '<div class="theme-row-list">' +
      byGroup[g].map(function (t) {
        return '<div class="theme-row">' +
          '<div class="theme-row-preview">' + _componentHtml(t) + '</div>' +
          '<div class="theme-row-meta">' +
            '<span class="theme-row-lbl">' + esc(t.label) + '</span>' +
            '<label class="theme-row-swatch">' +
              '<input type="color" class="theme-inp" data-token="' + t.token + '" value="' + theme[t.token] + '"/>' +
              '<span class="theme-row-dot" id="dot-' + t.token + '" style="background:' + theme[t.token] + '"></span>' +
              '<span class="theme-row-hex" data-hex="' + t.token + '">' + esc(theme[t.token].toUpperCase()) + '</span>' +
            '</label>' +
          '</div></div>';
      }).join('') +
      '</div></div>';
  }).join('');
  $('#themeGroups').html(html);
  _seedLiveVars(theme);
}

// Sets every theme CSS var on #themeLiveScope (not :root) so the top preview
// frame and every row's preview reflect the draft palette live, without
// touching the real app until Save.
function _seedLiveVars(theme) {
  var el = document.getElementById('themeLiveScope');
  if (!el) return;
  for (var k in THEME_CSS_VAR) if (theme[k]) el.style.setProperty(THEME_CSS_VAR[k], theme[k]);
}

// Local-only preview: updates the live var plus this row's own swatch
// dot/hex text - never touches the real app until Save.
function _previewThemeToken(token, value) {
  $('#dot-' + token).css('background', value);
  $('.theme-row-hex[data-hex="' + token + '"]').text(value.toUpperCase());
  var cssVar = THEME_CSS_VAR[token];
  var el = document.getElementById('themeLiveScope');
  if (cssVar && el) el.style.setProperty(cssVar, value);
}

function _applyThemeLive(theme) {
  var root = document.documentElement.style;
  THEME_TOKENS.forEach(function (t) {
    if (theme[t.token]) root.setProperty(THEME_CSS_VAR[t.token], theme[t.token]);
  });
}

async function loadThemePanel() {
  _renderThemeGroups(DEFAULT_THEME_CLIENT);
  try {
    var r = await gsc('getTheme');
    if (!r.success) { toast(r.error || 'Failed to load theme', 'err'); return }
    _renderThemeGroups(r.theme);
  } catch (e) { toast('' + e, 'err') }
}

$(function () {
  $('#accountsList').on('click', '.acc-tap', function () {
    openUserEditSheet($(this).data('id'));
  });

  $('#ueRoleSel').select2({
    minimumResultsForSearch: Infinity,
    dropdownParent: $(document.body),
    width: '130px'
  });

  $('#menuAdminUser').on('click', function () { switchAdminTab('user') });
  $('#menuAdminTheme').on('click', function () { switchAdminTab('theme') });
  $('#menuAdminSettings').on('click', function () { switchAdminTab('settings') });
  $('#btnAdminUserBack, #btnAdminThemeBack, #btnAdminSettingsBack').on('click', function () { switchAdminTab('menu') });

  $('#userSearchInp').on('input', function () {
    USER_SEARCH = $(this).val();
    $('#userSearchClear').toggleClass('hidden', !USER_SEARCH);
    renderAccounts();
  });
  $('#userSearchClear').on('click', function () {
    USER_SEARCH = '';
    $('#userSearchInp').val('').trigger('focus');
    $(this).addClass('hidden');
    renderAccounts();
  });

  $('#themeGroups').on('input', '.theme-inp', function () {
    _previewThemeToken($(this).data('token'), $(this).val());
  });

  $('#btnThemeSave').on('click', function () {
    var theme = {};
    $('.theme-inp').each(function () { theme[$(this).data('token')] = $(this).val() });
    // No JS global holds "the live theme" - snapshot via computed style so a
    // failed save can restore exactly what was showing before.
    var oldTheme = {};
    THEME_TOKENS.forEach(function (t) {
      oldTheme[t.token] = getComputedStyle(document.documentElement).getPropertyValue(THEME_CSS_VAR[t.token]).trim();
    });
    _applyThemeLive(theme);
    toast('Theme saved');
    bgSync(
      function () { return gsc('saveTheme', TK, theme) },
      function () { _applyThemeLive(oldTheme) },
      function (r) { _applyThemeLive(r.theme) }
    );
  });

  $('#btnThemeReset').on('click', function () {
    _renderThemeGroups(DEFAULT_THEME_CLIENT);
  });

  $('#asSessionMin').on('input', function () {
    $('#asSessionHint').text(_sessionHintText(parseFloat($(this).val())));
  });

  $('.tgl input', '#panelAdminSettings').on('change', function () {
    $(this).closest('.tgl').toggleClass('on', $(this).is(':checked'));
  });

  $('#btnAsSave').on('click', function () {
    var settings = {
      sessionMinutes: $('#asSessionMin').val(),
      pwMinLength: $('#asPwMinLen').val(),
      pwRequireUpper: $('#asPwUpper').is(':checked'),
      pwRequireLower: $('#asPwLower').is(':checked'),
      pwRequireNumber: $('#asPwNumber').is(':checked'),
      pwRequireSpecial: $('#asPwSpecial').is(':checked')
    };
    toast('Settings saved');
    // No cached global holds settings - on failure, just pull the form back
    // to the last-saved values instead of leaving rejected input sitting there.
    bgSync(function () { return gsc('updateSettings', TK, settings) }, loadSettingsPanel);
  });

  $('#ueRoleSel').on('change', function () {
    var role = $(this).val(), id = _ueId;
    var acct = _findAccount(id), oldRole = acct ? acct.role : null;
    if (acct) acct.role = role;
    renderAccounts();
    toast('Role updated');
    bgSync(
      function () { return gsc('updateAccountRole', TK, id, role) },
      function () {
        if (acct) acct.role = oldRole;
        renderAccounts();
        $('#ueRoleSel').val(oldRole).trigger('change.select2');
      }
    );
  });

  $('#ueStatusTgl').on('change', function () {
    var enable = $(this).is(':checked'), id = _ueId;
    var acct = _findAccount(id), oldStatus = acct ? acct.status : null;
    var oldEnabled = oldStatus !== 'disabled';
    $('#ueTglWrap').toggleClass('on', enable);
    $('#ueStatusHint').text(enable ? 'Active — can sign in' : 'Disabled — can\'t sign in');
    var status = enable ? 'active' : 'disabled';
    if (acct) acct.status = status;
    renderAccounts();
    toast(enable ? 'Account enabled' : 'Account disabled');
    bgSync(
      function () { return gsc('updateAccountStatus', TK, id, status) },
      function () {
        if (acct) acct.status = oldStatus;
        renderAccounts();
        $('#ueStatusTgl').prop('checked', oldEnabled);
        $('#ueTglWrap').toggleClass('on', oldEnabled);
        $('#ueStatusHint').text(oldEnabled ? 'Active — can sign in' : 'Disabled — can\'t sign in');
      }
    );
  });

  $('#btnUeDelete').on('click', function () {
    var a = _findAccount(_ueId);
    closeSheets();
    askDel('account', _ueId, a ? a.displayName : '');
  });
});
</script>
