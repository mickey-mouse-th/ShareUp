<div id="authView">
  <div class="auth-wrap">
    <div class="auth-logo">
      <div class="auth-logo-ic">
        <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
      </div>
      <div>
        <div class="auth-logo-name">ShareUp</div>
        <div class="auth-logo-sub">Split expenses with friends</div>
      </div>
    </div>
    <div class="auth-box">
      <!-- Login Panel -->
      <div id="loginPanel">
        <div class="auth-h">Welcome back 👋</div>
        <div class="auth-s">Sign in to continue</div>
        <form id="loginForm">
          <div class="fld">
            <label class="fld-label">Username</label>
            <div class="fld-row">
              <input class="fld-inp" type="text" id="loginUser" placeholder="Enter your username" autocomplete="username" required/>
            </div>
          </div>
          <div class="fld">
            <label class="fld-label">Password</label>
            <div class="fld-row">
              <input class="fld-inp" type="password" id="loginPass" placeholder="Enter your password" autocomplete="current-password" required/>
              <button type="button" class="pw-btn" data-target="loginPass">
                <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn-primary">Sign In</button>
        </form>
        <p class="auth-foot">Don't have an account? <a href="#" id="goRegister">Register</a></p>
      </div>
      <!-- Register Panel -->
      <div id="regPanel" style="display:none">
        <div class="auth-h">Create account ✨</div>
        <div class="auth-s">Join ShareUp for free</div>
        <form id="regForm">
          <div class="fld">
            <label class="fld-label">Display Name</label>
            <div class="fld-row">
              <input class="fld-inp" type="text" id="regName" placeholder="Your full name" required/>
            </div>
          </div>
          <div class="fld">
            <label class="fld-label">Username</label>
            <div class="fld-row">
              <input class="fld-inp" type="text" id="regUser" placeholder="Choose a username" autocomplete="username" required/>
            </div>
          </div>
          <div class="fld">
            <label class="fld-label">Password</label>
            <div class="fld-row">
              <input class="fld-inp" type="password" id="regPass" placeholder="Create a password" autocomplete="new-password" required/>
              <button type="button" class="pw-btn" data-target="regPass">
                <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn-primary">Create Account</button>
        </form>
        <p class="auth-foot">Already have an account? <a href="#" id="goLogin">Sign in</a></p>
      </div>
    </div>
  </div>
</div>
