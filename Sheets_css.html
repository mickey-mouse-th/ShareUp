<style>
.overlay{
  position:fixed;inset:0;background:color-mix(in srgb,var(--overlay-bg) 45%,transparent);z-index:600;
  opacity:0;pointer-events:none;transition:opacity .3s;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.overlay.on{opacity:1;pointer-events:all}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:601;
  background:var(--s1);border:1px solid var(--bd);border-bottom:none;
  border-radius:var(--rad) var(--rad) 0 0;padding-bottom:var(--sb);
  transform:translateY(110%);transition:transform .35s cubic-bezier(.25,.46,.45,.94);
  max-height:94vh;display:flex;flex-direction:column;
  box-shadow:var(--shadow-lg);
}
.sheet.on{transform:translateY(0)}
.sh-pill{width:44px;height:5px;background:var(--bd2);border-radius:99px;margin:14px auto 0;flex-shrink:0}
.sh-hd{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px 14px;border-bottom:1px solid var(--bd);flex-shrink:0;
}
.sh-title{font-size:20px;font-weight:700;letter-spacing:-.3px;color:var(--t1)}
.sh-close{
  width:38px;height:38px;border-radius:50%;background:var(--s2);border:none;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--t2);cursor:pointer;
}
.sh-body{padding:22px 22px 28px;overflow-y:auto;flex:1}
.inp-lbl{display:block;font-size:13px;font-weight:700;color:var(--t2);letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px}
.inp{
  width:100%;height:58px;background:var(--s1);border:1.5px solid var(--bd);
  border-radius:var(--rad-sm);padding:0 18px;font-size:17px;color:var(--t1);
  outline:none;transition:border-color .2s,background .2s;
}
.inp::placeholder{color:var(--t3)}
.inp.sk-pulse{
  color:transparent;
  background:linear-gradient(90deg,var(--s2) 25%,var(--s3) 50%,var(--s2) 75%);
  background-size:200% 100%;animation:sk-shimmer 1.5s ease-in-out infinite;
}
.inp:focus{border-color:var(--p);background:var(--s1)}
select.inp{cursor:pointer}
select.inp option{background:var(--s1);color:var(--t1)}
.inp-g{margin-bottom:18px}
.ck-list{display:flex;flex-direction:column;gap:10px;max-height:240px;overflow-y:auto}
.ck-row{
  display:flex;align-items:center;gap:14px;
  background:var(--s2);border:1px solid var(--bd);border-radius:var(--rad-sm);
  padding:14px 18px;cursor:pointer;transition:background .15s,border-color .15s;
}
.ck-row.checked{background:var(--p-dim);border-color:var(--p)}
.ck-row input{width:20px;height:20px;accent-color:var(--p);flex-shrink:0;pointer-events:none}
.ck-row label{font-size:16px;color:var(--t1);flex:1;cursor:pointer;font-weight:500;pointer-events:none}
.pp-box{
  text-align:center;background:var(--p-dim);border:1px solid var(--p);
  border-radius:var(--rad-sm);padding:18px;margin-top:14px;
}
.pp-label{font-size:14px;color:var(--t2);font-weight:500}
.pp-amt{font-size:26px;font-weight:800;color:var(--p-lt);margin-top:6px;letter-spacing:-.3px}
.ck-btns{display:flex;gap:10px;margin-bottom:14px}
.ck-btn{
  font-size:14px;font-weight:600;border-radius:var(--rad-sm);padding:10px 20px;
  border:1px solid var(--bd);background:var(--s2);color:var(--t2);cursor:pointer;
}
.ck-btn.hi{border-color:var(--p);color:var(--p-lt);background:var(--p-dim)}
.inp-row{display:flex;gap:10px}
.inp-row .inp{flex:1}
.inp-row .ck-btn{height:58px;padding:0 22px;border-radius:var(--rad-sm);flex-shrink:0}
.sh-btn{
  width:100%;height:60px;border:none;border-radius:var(--rad-sm);
  background:var(--p-grad);
  color:#fff;font-size:18px;font-weight:700;letter-spacing:-.2px;
  margin-top:22px;box-shadow:0 8px 24px var(--p-glow);
  transition:opacity .15s;cursor:pointer;
}
.sh-btn:active{opacity:.85}
.sh-btn-ghost{background:var(--s2);color:var(--t2);box-shadow:none;border:1px solid var(--bd);margin-top:12px}

/* ── Event icon picker ───────────────────────── */
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px}
.icon-pick{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  font-size:22px;border-radius:var(--rad-sm);border:2px solid var(--bd);
  background:var(--s2);cursor:pointer;transition:border-color var(--ease),background var(--ease);
}
.icon-pick:hover{background:var(--bd)}
.icon-pick.on{border-color:var(--p);background:var(--p-dim)}

/* ── Theme settings ──────────────────────────── */
.theme-hint{
  font-size:13px;color:var(--t2);background:var(--s2);border:1px solid var(--bd);
  border-radius:var(--rad-sm);padding:10px 14px;margin-bottom:16px;line-height:1.5;
}
.theme-group{margin-bottom:26px}
.theme-group-lbl{display:block;margin-bottom:12px}
.theme-inp{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}

/* Each row's preview IS a real, labeled instance of the thing it controls
   (an actual button, card, badge, popup...) rendered with var(--token) - so
   #themeGroups itself carries the live (unsaved) draft values as inline CSS
   var overrides (see _seedLiveVars/_previewThemeToken in Admin_js.html),
   meaning every row reacts live to every other row's edits (e.g. the Card
   preview's title updates when Primary Text changes) with zero extra JS. */
/* Sized close to the real app's own measurements (60px buttons, 64px header,
   82px nav...) rather than shrunk-down icons, so it reads as an actual
   screen rather than a diagram. Scoped under .theme-preview-frame only -
   the compact per-row previews further down keep their original size. */
.theme-preview-frame{
  border-radius:var(--rad);border:1px solid var(--bd);overflow:hidden;
  background:var(--bg);box-shadow:var(--shadow-lg);margin-bottom:28px;
  max-width:420px;margin-left:auto;margin-right:auto;
}
.theme-preview-frame .cpv-header{height:64px;font-size:17px;padding:0 20px}
.theme-preview-frame .cpv-header-back{font-size:24px}
.theme-preview-body{padding:22px 20px;display:flex;flex-direction:column;gap:20px}
.theme-preview-frame .cpv-accent-chip{padding:8px 18px;font-size:14px}
.theme-preview-frame .cpv-accent-link{font-size:15px}
.theme-preview-frame .cpv-card{padding:20px 22px;border-radius:var(--rad)}
.theme-preview-frame .cpv-card-title{font-size:18px}
.theme-preview-frame .cpv-card-sub{font-size:14px;margin-top:5px}
.theme-preview-frame .cpv-text{font-size:17px}
.theme-preview-badges{display:flex;flex-wrap:wrap;gap:10px}
.theme-preview-frame .cpv-badge{padding:8px 18px;font-size:14px}
.theme-preview-frame .cpv-input{height:52px;font-size:15px;padding:0 18px;border-radius:var(--rad-sm)}
.theme-preview-frame .cpv-border{padding:18px;font-size:14px;border-radius:var(--rad-sm)}
.theme-preview-frame .cpv-btn{height:56px;font-size:17px;border-radius:var(--rad-sm)}
.theme-preview-frame .cpv-nav{height:64px;font-size:14px}
.theme-preview-frame .cpv-nav i{width:12px;height:12px}
.theme-preview-popup-wrap{padding:22px 20px;border-top:1px dashed var(--bd)}
.theme-preview-frame .cpv-popup{height:110px;border-radius:var(--rad)}
.theme-preview-frame .cpv-popup-card{padding:16px 32px;font-size:15px;border-radius:var(--rad-sm)}

/* Login screen preview - mirrors Auth_css.html's real full-bleed hero+sheet
   look. Fully theme-reactive (background/card/text all pull from shared
   vars, same as the rest of the app), so every element here previews the
   live edit. */
.theme-preview-lbl{font-size:12px;color:var(--t2);margin:18px 0 8px}
.tlp-wrap{border-radius:var(--rad);overflow:hidden;margin-bottom:26px;box-shadow:var(--shadow-lg)}
.tlp-top{background:var(--p-grad);padding:26px 16px 34px;text-align:center}
.tlp-logo-ic{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.18);display:block;margin:0 auto 10px}
.tlp-top b{color:#fff;font-size:14px;display:block}
.tlp-top small{color:rgba(255,255,255,.75);font-size:11px}
.tlp-box{background:var(--s1);border-radius:16px 16px 0 0;margin-top:-16px;position:relative;padding:18px 16px}
.tlp-title{color:var(--t1);font-size:16px;font-weight:800;margin-bottom:12px}
.tlp-field{height:34px;border-radius:9px;background:var(--s2);border:1px solid var(--bd);margin-bottom:10px}
.tlp-btn{
  width:100%;height:38px;border:none;border-radius:10px;margin-top:4px;
  background:var(--p-grad);color:#fff;font-size:13px;font-weight:700;
  box-shadow:0 4px 16px var(--p-glow);
}
.tlp-link{margin-top:12px;text-align:center;font-size:11px;color:var(--t2)}
.tlp-link span{color:var(--p-lt);font-weight:600}
.theme-row-list{display:flex;flex-direction:column;gap:18px}
.theme-row-preview{margin-bottom:9px;display:flex}
.theme-row-meta{display:flex;align-items:center;justify-content:space-between;gap:10px}
.theme-row-lbl{font-size:13px;font-weight:600;color:var(--t1)}
.theme-row-swatch{display:flex;align-items:center;gap:9px;cursor:pointer;padding:4px;margin:-4px}
.theme-row-dot{width:28px;height:28px;border-radius:8px;box-shadow:0 0 0 1px var(--bd);flex-shrink:0}
.theme-row-hex{font-size:12px;font-family:ui-monospace,'SF Mono',monospace;color:var(--t2);min-width:66px;text-align:right}

/* Component previews - real, self-labeled instances, not abstract shapes */
.cpv-btn{
  height:40px;padding:0 20px;border:none;border-radius:var(--rad-sm);
  background:var(--p);color:#fff;font-size:14px;font-weight:700;
}
.cpv-accent-row{display:flex;align-items:center;gap:12px}
.cpv-accent-chip{padding:6px 14px;border-radius:99px;background:var(--p-lt);color:#fff;font-size:12px;font-weight:700}
.cpv-accent-link{font-size:13px;font-weight:700;color:var(--p-lt)}
.cpv-page{
  width:100%;padding:14px;border-radius:var(--rad-sm);background:var(--bg);
  border:1px dashed var(--bd2);font-size:12px;font-weight:600;color:var(--t2);text-align:center;
}
.cpv-card{
  width:100%;padding:14px 16px;border-radius:var(--rad-sm);background:var(--s1);
  border:1px solid var(--bd);box-shadow:var(--shadow);
}
.cpv-card-title{font-size:14px;font-weight:700;color:var(--t1)}
.cpv-card-sub{font-size:12px;color:var(--t2);margin-top:3px}
.cpv-input{
  width:100%;height:38px;border-radius:var(--rad-sm);background:var(--s2);
  border:1px solid var(--bd);display:flex;align-items:center;padding:0 14px;
  font-size:12px;color:var(--t3);
}
.cpv-border{
  width:100%;padding:12px;border-radius:var(--rad-sm);background:var(--s1);
  border:2px solid var(--bd);font-size:12px;font-weight:600;color:var(--t2);text-align:center;
}
.cpv-text{font-size:15px;font-weight:600}
.cpv-text-1{color:var(--t1)}
.cpv-text-2{color:var(--t2)}
.cpv-text-3{color:var(--t3)}
.cpv-badge{display:inline-block;padding:6px 14px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}
.cpv-badge-g{background:var(--g)}
.cpv-badge-r{background:var(--r)}
.cpv-badge-o{background:var(--o)}
.cpv-badge-b{background:var(--b)}
.cpv-header{
  width:100%;height:40px;border-radius:var(--rad-sm);background:var(--hdr-bg);
  border:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:0 14px;
  font-size:14px;font-weight:700;color:var(--t1);
}
.cpv-header-back{font-size:18px;color:var(--t2)}
.cpv-nav{
  width:100%;height:44px;border-radius:var(--rad-sm);background:var(--nav-bg);
  border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;gap:10px;
  font-size:12px;font-weight:600;color:var(--t2);
}
.cpv-nav i{width:9px;height:9px;border-radius:50%;background:var(--t3);display:block;font-style:normal}
.cpv-nav i.on{background:var(--p)}
.cpv-popup{
  width:100%;height:74px;border-radius:var(--rad-sm);background:var(--overlay-bg);
  opacity:.92;display:flex;align-items:center;justify-content:center;
}
.cpv-popup-card{
  background:var(--s1);color:var(--t1);border-radius:var(--rad-sm);padding:10px 22px;
  font-size:12px;font-weight:700;box-shadow:var(--shadow-lg);
}
.cf-icon{
  width:72px;height:72px;border-radius:var(--rad-sm);background:var(--r-dim);
  border:1px solid var(--r);display:flex;align-items:center;
  justify-content:center;margin:0 auto 20px;
}
.cf-icon svg{width:36px;height:36px;fill:var(--r)}
.cf-title{font-size:22px;font-weight:800;text-align:center;color:var(--t1);margin-bottom:10px;letter-spacing:-.4px}
.cf-msg{font-size:16px;color:var(--t2);text-align:center;line-height:1.6;margin-bottom:26px}
.cf-btns{display:flex;gap:12px}
.btn-cancel{flex:1;height:58px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--rad-sm);font-size:17px;font-weight:600;color:var(--t2);cursor:pointer}
.btn-confirm{flex:1;height:58px;background:var(--r);border:none;border-radius:var(--rad-sm);font-size:17px;font-weight:700;color:#fff;cursor:pointer;box-shadow:0 6px 20px color-mix(in srgb,var(--r) 35%,transparent)}
.split-toggle{display:flex;gap:4px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--rad-sm);padding:4px;margin-bottom:4px}
.smode-btn{flex:1;padding:13px 8px;font-size:15px;font-weight:600;border:none;background:none;color:var(--t3);border-radius:10px;transition:all .2s;letter-spacing:-.1px;cursor:pointer}
.smode-btn.on{background:var(--p-dim);color:var(--p-lt);border:1px solid var(--p)}
.ca-row{display:flex;align-items:center;gap:12px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--rad-sm);padding:14px 16px;margin-bottom:10px}
.ca-av{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;color:#fff;flex-shrink:0}
.ca-name{flex:1;font-size:16px;font-weight:500;color:var(--t1)}
.ca-inp-wrap{position:relative;flex-shrink:0}
.ca-inp-sym{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:15px;font-weight:700;color:var(--t2);pointer-events:none}
.ca-inp{width:120px;height:44px;background:var(--s1);border:1.5px solid var(--bd);border-radius:10px;padding:0 10px 0 26px;font-size:16px;font-weight:700;color:var(--t1);text-align:right;outline:none;transition:border-color .2s}
.ca-inp:focus{border-color:var(--p)}
.ca-inp::placeholder{color:var(--t3);font-weight:400}

.acc-menu-row{
  display:flex;align-items:center;gap:14px;width:100%;
  background:var(--s2);border:1px solid var(--bd);border-radius:var(--rad-sm);
  padding:16px 18px;margin-bottom:10px;cursor:pointer;color:var(--t1);
  font-size:16px;font-weight:600;text-align:left;
}
.acc-menu-row svg{width:22px;height:22px;fill:var(--p-lt);flex-shrink:0}
.acc-menu-row span{flex:1}
.acc-menu-chev{width:18px!important;height:18px!important;fill:var(--t3)!important}

.pf-avatar-wrap{position:relative;width:96px;height:96px;margin:4px auto 14px}
.pf-avatar{
  width:96px;height:96px;border-radius:50%;background:var(--p-grad);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:32px;
}
.pf-avatar.sk-pulse{
  color:transparent;
  background:linear-gradient(90deg,var(--s2) 25%,var(--s3) 50%,var(--s2) 75%);
  background-size:200% 100%;animation:sk-shimmer 1.5s ease-in-out infinite;
}
.pf-avatar-edit{
  position:absolute;right:-2px;bottom:-2px;width:34px;height:34px;border-radius:50%;
  background:var(--p);border:3px solid var(--s1);display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.pf-avatar-edit svg{width:16px;height:16px;fill:#fff}
.pf-remove-link{color:var(--r);font-size:14px;font-weight:600;text-decoration:none}
.pf-hint{font-size:12px;color:var(--t3);margin-top:8px}
.pf-divider{height:1px;background:var(--bd);margin:28px 0 22px}
.tx-slip-gallery{display:flex;flex-wrap:wrap;gap:10px}
.tx-slip-item{position:relative;width:64px;height:64px;border-radius:var(--rad-sm);overflow:hidden;background:var(--s2);border:1px solid var(--bd);flex-shrink:0}
.tx-slip-item img{
  width:100%;height:100%;object-fit:cover;display:block;
  background:linear-gradient(90deg,var(--s2) 25%,var(--s3) 50%,var(--s2) 75%);
  background-size:200% 100%;animation:sk-shimmer 1.5s ease-in-out infinite;
}
.tx-slip-remove{
  position:absolute;top:0;right:0;width:32px;height:32px;border-radius:50%;
  background:rgba(15,23,42,.6);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
}
.tx-slip-remove svg{width:16px;height:16px;fill:#fff}
.tx-slip-add{
  width:64px;height:64px;border-radius:var(--rad-sm);background:var(--s2);border:1px dashed var(--bd2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
}
.tx-slip-add svg{width:24px;height:24px;fill:var(--t3)}
.slip-carousel{position:relative;display:flex;align-items:center;justify-content:center}
.slip-carousel img{
  width:100%;min-height:220px;border-radius:var(--rad-sm);display:block;
  background:linear-gradient(90deg,var(--s2) 25%,var(--s3) 50%,var(--s2) 75%);
  background-size:200% 100%;animation:sk-shimmer 1.5s ease-in-out infinite;
}
.slip-nav{
  position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;
  background:rgba(15,23,42,.55);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.slip-nav svg{width:20px;height:20px;fill:#fff}
.slip-nav-prev{left:8px}
.slip-nav-next{right:8px}
.slip-counter{text-align:center;font-size:13px;color:var(--t2);margin-top:10px}
.sh-close svg{width:18px;height:18px;fill:currentColor}
/* Bigger touch targets for the slip viewer's header icons specifically -
   easy to miss at the base 38px size when reaching for them one-handed. */
#shSlipView .sh-hd .sh-close{width:46px;height:46px}
#shSlipView .sh-hd .sh-close svg{width:22px;height:22px}
.slip-dl-wrap{position:relative}
.slip-dl-menu{
  position:absolute;top:54px;right:0;background:var(--s1);border:1px solid var(--bd);
  border-radius:var(--rad-sm);box-shadow:var(--shadow-lg);padding:6px;min-width:170px;
  display:none;z-index:10;
}
.slip-dl-menu.on{display:block}
.slip-dl-menu button{
  display:block;width:100%;text-align:left;padding:11px 12px;border:none;background:none;
  color:var(--t1);font-size:14px;font-weight:600;border-radius:8px;cursor:pointer;
}
.slip-dl-menu button:active{background:var(--s2)}
.ca-total-box{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;background:var(--p-dim);border:1px solid var(--p);border-radius:var(--rad-sm);margin-top:6px;margin-bottom:2px}
.ca-total-lbl{font-size:15px;font-weight:600;color:var(--t2)}
.ca-total-val{font-size:22px;font-weight:800;color:var(--p-lt);letter-spacing:-.3px}
</style>
