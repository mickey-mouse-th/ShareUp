<script>
function authPg(p) {
  if (p === 'login') {
    $('#loginPanel').show();
    $('#regPanel').hide();
  } else {
    $('#loginPanel').hide();
    $('#regPanel').show();
  }
}

var _regPwPolicy = null;

$(function () {
  gsc('getPasswordPolicy').then(function (p) {
    _regPwPolicy = p;
    renderPwChecklist('regPwChecklist', p);
  }).catch(function () {});

  $('#regPass').on('input', function () {
    if (_regPwPolicy) updatePwChecklist('regPwChecklist', _regPwPolicy, $(this).val());
  });

  $('#goRegister').on('click', function (e) { e.preventDefault(); authPg('reg') });
  $('#goLogin').on('click', function (e) { e.preventDefault(); authPg('login') });

  // Toggle password visibility
  $(document).on('click', '.pw-btn', function () {
    var id = $(this).data('target');
    var inp = $('#' + id);
    inp.attr('type', inp.attr('type') === 'password' ? 'text' : 'password');
  });

  // Login
  $('#loginForm').on('submit', async function (e) {
    e.preventDefault();
    var u = $('#loginUser').val().trim();
    var p = $('#loginPass').val();
    try {
      var r = await gsc('loginUser', u, p);
      if (r.success) {
        TK = r.token; ME = r.user;
        var remember = $('#loginRemember').is(':checked');
        // Remember me checked: persists in localStorage across app closes
        // (until the configured session length expires). Unchecked: kept in
        // sessionStorage only, gone as soon as this tab/window closes.
        var store = remember ? localStorage : sessionStorage;
        store.setItem('su_tk', TK);
        store.setItem('su_me', JSON.stringify(ME));
        // Silently carry the token in the URL too when remembering - Safari
        // wipes localStorage for Apps Script's sandboxed frame on a real app
        // close, but keeps a closed tab's last URL, so reopening still logs
        // back in from here with no extra step from the user. Best-effort:
        // the sandboxed frame can block top-level navigation outright, in
        // which case this silently no-ops and the app still starts normally.
        if (remember && r.url) { try { top.location.href = r.url } catch (e) {} }
        startApp();
      } else {
        toast(r.error || 'Login failed', 'err');
      }
    } catch (e) { toast('' + e, 'err') }
  });

  // Register
  $('#regForm').on('submit', async function (e) {
    e.preventDefault();
    var n = $('#regName').val().trim();
    var u = $('#regUser').val().trim();
    var p = $('#regPass').val();
    try {
      var r = await gsc('registerUser', n, u, p);
      if (r.success) {
        toast('Account created! Sign in 🎉');
        $('#regForm')[0].reset();
        authPg('login');
      } else {
        toast(r.error || 'Failed', 'err');
      }
    } catch (e) { toast('' + e, 'err') }
  });
});
</script>
