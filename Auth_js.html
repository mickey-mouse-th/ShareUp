<script>
function authPg(p) {
  var isLogin = p === 'login';
  $('#loginPanel').toggle(isLogin);
  $('#regPanel').toggle(!isLogin);
}

function valTrim(sel) { return $(sel).val().trim(); }
function reportError(e) { toast('' + e, 'err'); }
function toastErr(r, fallback) { toast(r.error || fallback, 'err'); }

var _regPwPolicy = null;

$(function () {
  gsc('getPasswordPolicy').then(function (p) {
    _regPwPolicy = p;
    renderPwChecklist('regPwChecklist', p);
  }).catch(function () {});

  $('#regPass').on('input', function () {
    if (_regPwPolicy) updatePwChecklist('regPwChecklist', _regPwPolicy, $(this).val());
  });

  $('#goRegister').on('click', function (e) { e.preventDefault(); authPg('reg') });
  $('#goLogin').on('click', function (e) { e.preventDefault(); authPg('login') });

  $(document).on('click', '.pw-btn', function () {
    var inp = $('#' + $(this).data('target'));
    inp.attr('type', inp.attr('type') === 'password' ? 'text' : 'password');
  });

  $('#loginForm').on('submit', async function (e) {
    e.preventDefault();
    var u = valTrim('#loginUser');
    var p = $('#loginPass').val();
    try {
      var r = await gsc('loginUser', u, p);
      if (r.success) {
        TK = r.token; ME = r.user;
        var remember = $('#loginRemember').is(':checked');
        // Remember me: persist in localStorage (survives app close); else sessionStorage only.
        var store = remember ? localStorage : sessionStorage;
        store.setItem('su_tk', TK);
        store.setItem('su_me', JSON.stringify(ME));
        // Safari wipes the sandboxed frame's localStorage on close but keeps the tab's last URL,
        // so also carrying the token there logs us back in on reopen. Best-effort: navigation can
        // be blocked by the sandbox, in which case this silently no-ops.
        if (remember && r.url) { try { top.location.href = r.url } catch (e) {} }
        startApp();
      } else {
        toastErr(r, 'Login failed');
      }
    } catch (e) { reportError(e) }
  });

  $('#regForm').on('submit', async function (e) {
    e.preventDefault();
    var n = valTrim('#regName');
    var u = valTrim('#regUser');
    var p = $('#regPass').val();
    try {
      var r = await gsc('registerUser', n, u, p);
      if (r.success) {
        toast('Account created! Sign in 🎉');
        $('#regForm')[0].reset();
        authPg('login');
      } else {
        toastErr(r, 'Failed');
      }
    } catch (e) { reportError(e) }
  });
});
</script>
